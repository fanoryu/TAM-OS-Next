name: CI

# Verify + build the Distribution-1 deployment package on every change to main and on demand.
# The app needs no dependencies — Node is used only for the build/verify tooling,
# so there is no `npm install` step.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Print Node version
        run: node --version

      - name: Verify build
        run: node tools/verify-build.js

      # Deterministic identity / authorization / SESSION runtime harnesses (fixed allowlist;
      # no network, no clock, no credentials — fetch is a stub and the API timeout is a
      # virtual timer). Each is a blocking step: a non-zero exit fails the job. The rest of
      # the runtime suite is still run locally only.
      - name: Runtime harness - identity foundation
        run: node tools/verify-identity-foundation-runtime.js

      - name: Runtime harness - session identity
        run: node tools/verify-session-identity-runtime.js

      - name: Runtime harness - identity selection
        run: node tools/verify-identity-selection-runtime.js

      - name: Runtime harness - workspace self-scope
        run: node tools/verify-workspace-selfscope-runtime.js

      - name: Runtime harness - authorization
        run: node tools/verify-authz-runtime.js

      - name: Runtime harness - SESSION auth boot (AFI-2)
        run: node tools/verify-auth-boot-runtime.js

      - name: Runtime harness - SESSION credential flows (AFI-3)
        run: node tools/verify-auth-flow-runtime.js

      - name: Runtime harness - SESSION Employee workspace (AFI-4a)
        run: node tools/verify-session-employee-runtime.js

      - name: Build deployment package
        run: node tools/build-package.js

      - name: Confirm the build reproduces the committed package manifest
        run: git diff --exit-code -- dist/package-manifest.json

      - name: Resolve package name from APP_VERSION
        id: meta
        run: |
          VERSION="$(node -e "process.stdout.write(require('./tools/app-version.js').readAppMeta().version)")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=dist/tam-os-v$VERSION-package.zip" >> "$GITHUB_OUTPUT"
          echo "artifact=tam-os-v$VERSION-package" >> "$GITHUB_OUTPUT"

      - name: Confirm package ZIP and manifest exist
        run: |
          for f in "${{ steps.meta.outputs.zip }}" dist/package-manifest.json; do
            if [ ! -f "$f" ]; then
              echo "::error::Expected package output not found: $f"
              exit 1
            fi
            echo "Found $f ($(wc -c < "$f") bytes)"
          done

      - name: Upload deployment package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: |
            ${{ steps.meta.outputs.zip }}
            dist/package-manifest.json
          if-no-files-found: error
