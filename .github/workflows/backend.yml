name: Backend

# Backend Foundation: lint, boundary-check and test the PHP backend under server/.
# PHP comes from the GitHub-hosted runner image (no third-party setup action). Both jobs fail
# loudly if that PHP is not 8.3.x — the production target (ADR-0004) — rather than testing
# against a different version. No Composer.
#
# backend-db (BF-2A) runs the database suite against a disposable MariaDB service container.
# It is the authoritative database integration environment; it never reaches Hostinger.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Require the runner's PHP to be 8.3.x
        run: |
          php -v
          php -r 'exit(PHP_MAJOR_VERSION === 8 && PHP_MINOR_VERSION === 3 ? 0 : 1);' || {
            echo "::error::Runner PHP is not 8.3.x. Stop: adding a PHP setup action needs owner approval (CLAUDE.md §20)."
            exit 1
          }

      - name: Lint every tracked PHP file
        run: |
          set -e
          count=0
          while IFS= read -r -d '' f; do
            php -l "$f" > /dev/null
            count=$((count + 1))
          done < <(git ls-files -z -- 'server/*.php')
          test "$count" -gt 0
          echo "php -l: $count files, no syntax errors"

      - name: Backend boundary check (selftest, then the repository)
        run: |
          node tools/verify-backend-boundary.js --selftest
          node tools/verify-backend-boundary.js

      - name: Backend tests
        run: php server/tests/run.php

  backend-db:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        # Official Docker Library image, MariaDB 10.11 LTS — a CI baseline, NOT proof of
        # compatibility with the (unverified) Hostinger server version. Pinned by tag AND by
        # the multi-arch index digest, resolved from registry-1.docker.io on 2026-09-29
        # (library/mariadb:10.11 = 10.11.19 = 10.11.19-jammy). Update deliberately: resolve the
        # new digest, record it here, and review the MariaDB release notes.
        image: mariadb:10.11.19@sha256:7f22313fc130a377a44999965bcb0a08dd5b21e8502824c1b864f792f9bc66ab
        env:
          # Disposable CI-only values for a throw-away container; not secrets, never reused.
          MARIADB_ROOT_PASSWORD: ci-only-root-not-a-secret
          MARIADB_DATABASE: tamos_test
          MARIADB_USER: tamos_ci
          MARIADB_PASSWORD: ci-only-not-a-secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=24
    env:
      TAMOS_DB_TESTS: '1'
      TAMOS_TEST_DB_HOST: 127.0.0.1
      TAMOS_TEST_DB_PORT: '3306'
      TAMOS_TEST_DB_NAME: tamos_test
      TAMOS_TEST_DB_USER: tamos_ci
      TAMOS_TEST_DB_PASS: ci-only-not-a-secret
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Require the runner's PHP to be 8.3.x with pdo_mysql
        run: |
          php -v
          php -r 'exit(PHP_MAJOR_VERSION === 8 && PHP_MINOR_VERSION === 3 ? 0 : 1);' || {
            echo "::error::Runner PHP is not 8.3.x. Stop: adding a PHP setup action needs owner approval (CLAUDE.md §20)."
            exit 1
          }
          php -r 'exit(extension_loaded("pdo_mysql") ? 0 : 1);' || {
            echo "::error::Runner PHP has no pdo_mysql. Stop: changing the PHP toolchain needs owner approval."
            exit 1
          }

      # AWP-01 B-3: the B1 observer reads information_schema.INNODB_TRX, which needs the global
      # PROCESS privilege. It is granted only inside this job's throw-away service container and
      # disappears with it. Root authenticates with the container's own MARIADB_ROOT_PASSWORD,
      # read inside the container (never on a command line or in this log); no new credential.
      - name: Grant the B1 observer PROCESS inside the throw-away MariaDB container (test-only)
        shell: bash
        env:
          SERVICE_ID: ${{ job.services.mariadb.id }}
        run: |
          set -euo pipefail
          root_sql() { docker exec -i "$SERVICE_ID" sh -c 'MYSQL_PWD="$MARIADB_ROOT_PASSWORD" exec mariadb -uroot --batch --skip-column-names'; }
          hosts=$(echo "SELECT host FROM mysql.user WHERE user = '$TAMOS_TEST_DB_USER' ORDER BY host;" | root_sql)
          if [ "$hosts" != "%" ]; then
            echo "::error::Expected exactly one test account $TAMOS_TEST_DB_USER@%, found: [$hosts]. Not granting."
            exit 1
          fi
          echo "GRANT PROCESS ON *.* TO '$TAMOS_TEST_DB_USER'@'%';" | root_sql
          echo "SHOW GRANTS FOR '$TAMOS_TEST_DB_USER'@'%';" | root_sql | sed -E 's/PASSWORD .*/PASSWORD <hash>/'

      - name: Verify the test account itself can read INNODB_TRX (the B1 observer connection)
        run: |
          php -r '
            $pdo = new PDO("mysql:host=" . getenv("TAMOS_TEST_DB_HOST") . ";port=" . getenv("TAMOS_TEST_DB_PORT") . ";dbname=" . getenv("TAMOS_TEST_DB_NAME"),
                getenv("TAMOS_TEST_DB_USER"), getenv("TAMOS_TEST_DB_PASS"), [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);
            $grants = implode("\n", $pdo->query("SHOW GRANTS FOR CURRENT_USER()")->fetchAll(PDO::FETCH_COLUMN));
            $pdo->query("SELECT COUNT(*) FROM information_schema.INNODB_TRX")->fetchColumn();
            if (!str_contains($grants, "GRANT PROCESS ON *.*")) { fwrite(STDERR, "PROCESS not granted\n"); exit(1); }
            echo "observer: ", $pdo->query("SELECT CURRENT_USER()")->fetchColumn(), " has PROCESS; INNODB_TRX readable\n";
          '

      - name: Backend tests including the database suite
        shell: bash
        env:
          # AWP-01 B1: the commit-fault proxy retains its result.json here (outside the checkout).
          TAMOS_B1_EVIDENCE_DIR: ${{ runner.temp }}/b1-evidence
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/backend-db"
          php server/tests/run.php --require-db 2>&1 | tee "$RUNNER_TEMP/backend-db/backend-tests.log"

      # On failure only: the test log, every retained B1 result.json and its .sha256 sidecar.
      # Fabricated fixtures only; the CI passwords above are disposable and not secrets.
      - name: Upload backend-db failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-db-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/backend-db/backend-tests.log
            ${{ runner.temp }}/b1-evidence/
          if-no-files-found: warn
          retention-days: 14
