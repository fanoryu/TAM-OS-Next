name: Release

# Publishes a GitHub Release when a version tag (v*) is pushed.
# Guardrails: the tag MUST equal v<APP_VERSION>, verify + build MUST pass, the build MUST
# reproduce the committed package manifest, and the version-derived package ZIP MUST exist
# and match that manifest — otherwise nothing is published (Distribution-1).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v7

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Verify build
        run: node tools/verify-build.js

      - name: Build deployment package
        run: node tools/build-package.js

      - name: Confirm the build reproduces the committed package manifest
        run: git diff --exit-code -- dist/package-manifest.json

      - name: Determine version from APP_VERSION
        id: meta
        run: |
          VERSION="$(node -e "process.stdout.write(require('./tools/app-version.js').readAppMeta().version)")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=dist/tam-os-v$VERSION-package.zip" >> "$GITHUB_OUTPUT"
          echo "expected_tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Confirm tag matches APP_VERSION
        run: |
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="${{ steps.meta.outputs.expected_tag }}"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "::error::Tag '$TAG' does not match APP_VERSION ('$EXPECTED'). Refusing to publish."
            exit 1
          fi
          echo "Tag $TAG matches APP_VERSION."

      - name: Confirm package ZIP exists and matches the committed manifest
        run: |
          ZIP="${{ steps.meta.outputs.zip }}"
          if [ ! -f "$ZIP" ]; then
            echo "::error::Package ZIP not found: $ZIP"
            exit 1
          fi
          node -e "const m=require('./dist/package-manifest.json');const h=require('crypto').createHash('sha256').update(require('fs').readFileSync(process.argv[1])).digest('hex');if(m.zip.name!==require('path').basename(process.argv[1])||m.zip.sha256!==h){console.error('::error::Package ZIP does not match dist/package-manifest.json');process.exit(1)}" "$ZIP"
          echo "Found $ZIP ($(wc -c < "$ZIP") bytes), matching dist/package-manifest.json"

      - name: Resolve release notes source
        id: notes
        run: |
          if [ -f RELEASE_NOTES.md ]; then
            echo "file=RELEASE_NOTES.md" >> "$GITHUB_OUTPUT"
          else
            echo "file=CHANGELOG.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release (idempotent) and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          ZIP="${{ steps.meta.outputs.zip }}"
          NOTES="${{ steps.notes.outputs.file }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — refreshing assets only (no duplicate release)."
            gh release upload "$TAG" "$ZIP" dist/package-manifest.json --clobber
          else
            gh release create "$TAG" "$ZIP" dist/package-manifest.json \
              --title "TAM OS $TAG" \
              --notes-file "$NOTES" \
              --verify-tag
          fi
