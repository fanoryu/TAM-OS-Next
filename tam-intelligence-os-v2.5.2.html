/* ============================================================
   v2.2.1 — STABILIZATION LAYER
   Additive only. Save coordinator, non-destructive normalization,
   reusable validators, the integrity checker, and shared UI/a11y
   helpers. No storage keys renamed, no business logic changed.
   ============================================================ */

/* ---------- unified persistence coordinator (Phase 4) ---------- */
// Persists every dataset through StorageAdapter in one call. Used by restore
// and available for any flow that changes several collections at once. Each
// underlying save already surfaces its own failures; this simply coordinates.
async function saveAllData(){
  // v2.5.2 — persist every dataset (previously only a subset), so Smart Import
  // audit batches, overtime, adjustments and employee-merge audits are durable.
  await Promise.all([
    persist(), saveSettings(), saveBackups(),
    ...Object.keys(HR_KEYS).map(k=>persistHR(k)),
  ]);
  return true;
}

/* ---------- non-destructive normalization migration (Phase 2) ---------- */
// Runs once. Fills MISSING id / createdAt / updatedAt on every entity so
// diagnostics and future features can rely on them. Never edits an existing
// value, never touches a financial amount, never renames a key. Relationships
// already use IDs (employeeId / contractId / payrollPlanId) and are left as-is.
function isValidDate(iso){ if(!iso) return false; const d = new Date(String(iso).length<=10 ? iso+'T00:00:00' : iso); return !isNaN(d.getTime()); }
async function migrateNormalizeEntities(){
  try{
    const flag = await StorageAdapter.get('tam_migrated_norm_v221');
    if(flag && flag.value==='done'){ if(!State.settings.lastMigrationAt){ /* record for older sessions */ } return; }
    let changed = 0; const nowIso = new Date().toISOString();
    const norm = (arr, prefix)=>{ (arr||[]).forEach(r=>{
      if(r && typeof r==='object'){
        if(!r.id){ r.id = uid(prefix); changed++; }
        if(!r.createdAt){ r.createdAt = r.updatedAt || nowIso; changed++; }
        if(!r.updatedAt){ r.updatedAt = r.createdAt; changed++; }
      }
    }); };
    norm(State.employees,'emp'); norm(State.contracts,'ct'); norm(State.payrollPlans,'pp');
    norm(State.recurringExpenses,'re'); norm(State.monthlyPlans,'mp');
    // Give transactions a stable createdAt from their first history entry where
    // one exists — additive, no financial value is read or written.
    State.txns.forEach(t=>{ if(t && !('createdAt' in t)){ t.createdAt = (t.history && t.history[0] && t.history[0].ts) || null; } });
    if(changed){
      // Backup-before-migration, only when something is actually normalized.
      State.backups.unshift({id:uid('backup'), monthKey:'__all__', monthLabel:'Pre-2.2.1 normalization', timestamp:nowIso, txns:JSON.parse(JSON.stringify(State.txns)), migration:true});
      await saveBackups();
      await Promise.all(['employees','contracts','payrollPlans','recurringExpenses','monthlyPlans'].map(persistHR));
      await persist();
    }
    State.settings.lastMigrationAt = nowIso;
    await saveSettings();
    await StorageAdapter.set('tam_migrated_norm_v221','done');
  }catch(e){ showError('Normalization step skipped — existing data is unchanged.', e); }
}

/* ---------- reusable validators (Phase 9) ----------
   Every validator returns {valid, errors[], warnings[]}. errors block; warnings
   inform. Shared by forms, imports, the integrity checker, and restore. */
function vNew(){ return {valid:true, errors:[], warnings:[]}; }
function vDone(r){ r.valid = r.errors.length===0; return r; }
function isNum(v){ return v!==null && v!==undefined && v!=='' && isFinite(Number(v)); }
function validateEmployee(e){
  const r = vNew();
  if(!e || typeof e!=='object'){ r.errors.push('Employee record is not an object'); return vDone(r); }
  if(!e.id) r.errors.push('Missing stable id');
  if(!String(e.fullName||'').trim()) r.errors.push('Full name is required');
  if(e.employmentStatus && !EMPLOYMENT_STATUSES.includes(e.employmentStatus)) r.warnings.push('Unrecognized employment status: '+e.employmentStatus);
  if(e.monthlyBaseSalary!=null && (!isNum(e.monthlyBaseSalary) || Number(e.monthlyBaseSalary)<0)) r.warnings.push('Base salary is negative or non-numeric');
  if(e.joinDate && !isValidDate(e.joinDate)) r.warnings.push('Join date is not a valid date');
  return vDone(r);
}
function validateContract(c){
  const r = vNew();
  if(!c || typeof c!=='object'){ r.errors.push('Contract record is not an object'); return vDone(r); }
  if(!c.id) r.errors.push('Missing stable id');
  if(!c.employeeId) r.errors.push('Contract has no employeeId link');
  else if(!empById(c.employeeId)) r.warnings.push('Contract references an employee that no longer exists');
  if(!String(c.contractNumber||'').trim()) r.errors.push('Contract number is required');
  if(!isValidDate(c.startDate)) r.errors.push('Start date is missing or invalid');
  if(!isNum(c.durationMonths) || Number(c.durationMonths)<1) r.errors.push('Duration must be a positive number of months');
  if(c.monthlySalary!=null && (!isNum(c.monthlySalary) || Number(c.monthlySalary)<0)) r.warnings.push('Monthly salary is negative or non-numeric');
  if(c.status && !CONTRACT_STORED_STATUSES.includes(c.status)) r.warnings.push('Unrecognized stored contract status: '+c.status);
  return vDone(r);
}
function validatePayrollPlan(p){
  const r = vNew();
  if(!p || typeof p!=='object'){ r.errors.push('Payroll plan is not an object'); return vDone(r); }
  if(!p.id) r.errors.push('Missing stable id');
  if(!p.monthKey) r.errors.push('Missing monthKey');
  if(!p.employeeId) r.errors.push('Missing employeeId link'); else if(!empById(p.employeeId)) r.warnings.push('Payroll plan references a missing employee');
  if(!p.contractId) r.warnings.push('Missing contractId link'); else if(!contractById(p.contractId)) r.warnings.push('Payroll plan references a missing contract');
  ['baseSalary','overtime','allowance','deduction','bonus','benefits','otherAdjustment'].forEach(k=>{ if(p[k]!=null && !isNum(p[k])) r.warnings.push(`Component ${k} is non-numeric`); });
  if(p.plannedAmount!=null && !isNum(p.plannedAmount)) r.warnings.push('Planned amount is non-numeric');
  return vDone(r);
}
function validateRecurring(x){
  const r = vNew();
  if(!x || typeof x!=='object'){ r.errors.push('Recurring template is not an object'); return vDone(r); }
  if(!x.id) r.errors.push('Missing stable id');
  if(!String(x.name||'').trim()) r.errors.push('Name is required');
  if(x.defaultAmount!=null && (!isNum(x.defaultAmount) || Number(x.defaultAmount)<0)) r.warnings.push('Default amount is negative or non-numeric');
  if(x.frequency && !RECUR_FREQUENCIES[x.frequency]) r.warnings.push('Unrecognized frequency: '+x.frequency);
  if(x.startMonth && !/^\d{4}-\d{2}$/.test(x.startMonth)) r.warnings.push('Start month should be YYYY-MM');
  if(x.endMonth && !/^\d{4}-\d{2}$/.test(x.endMonth)) r.warnings.push('End month should be YYYY-MM');
  return vDone(r);
}
function validateMonthlyPlan(m){
  const r = vNew();
  if(!m || typeof m!=='object'){ r.errors.push('Monthly plan is not an object'); return vDone(r); }
  if(!m.id) r.errors.push('Missing stable id');
  if(!m.monthKey) r.errors.push('Missing monthKey');
  if(m.status && !PLAN_STATUSES.includes(m.status)) r.warnings.push('Unrecognized plan status: '+m.status);
  if(m.committedTxnIds && !Array.isArray(m.committedTxnIds)) r.errors.push('committedTxnIds must be an array');
  return vDone(r);
}
function validateTransaction(t){
  const r = vNew();
  if(!t || typeof t!=='object'){ r.errors.push('Transaction is not an object'); return vDone(r); }
  if(!t.id) r.errors.push('Missing stable id');
  if(!t.monthKey) r.errors.push('Missing monthKey');
  if(t.uraian===undefined) r.errors.push('Missing description (uraian)');
  if(t.planned!=null && !isNum(t.planned)) r.warnings.push('Planned amount is non-numeric');
  if(t.actual!=null && !isNum(t.actual)) r.warnings.push('Actual amount is non-numeric');
  if(t.planned!=null && Number(t.planned)<0) r.warnings.push('Planned amount is negative');
  return vDone(r);
}
// Imported row (pre-transaction) — used by the Excel/CSV import review.
function validateImportedRow(it){
  const r = vNew();
  if(!it || typeof it!=='object'){ r.errors.push('Row is not an object'); return vDone(r); }
  if(!String(it.uraian||'').trim()) r.warnings.push('Row has no description');
  if(it.planned!=null && !isNum(it.planned)) r.warnings.push('Planned amount is non-numeric');
  return vDone(r);
}
// Overtime record validator (v2.3.0).
function validateOvertime(o){
  const r = vNew();
  if(!o || typeof o!=='object'){ r.errors.push('Overtime record is not an object'); return vDone(r); }
  if(!o.id) r.errors.push('Missing stable id');
  if(!o.employeeId) r.errors.push('Missing employeeId link'); else if(!empById(o.employeeId)) r.warnings.push('Overtime references a missing employee');
  if(o.contractId && !contractById(o.contractId)) r.warnings.push('Overtime references a missing contract');
  if(!o.monthKey) r.errors.push('Missing monthKey');
  if(num(o.overtimeHours)<0) r.errors.push('Overtime hours are negative');
  if(o.status && !OVERTIME_STATUSES.includes(o.status)) r.warnings.push('Unrecognized overtime status: '+o.status);
  if(!(num(o.monthlyStandardHours)>0)) r.warnings.push('Invalid monthly standard hours snapshot');
  return vDone(r);
}
// Backup JSON — thin wrapper over the existing structural validator so imports
// and restore share one entry point returning the standard shape.
function validateBackupJSON(data){
  const base = validateCompleteBackup(data);
  return {valid: base.ok, errors: base.errors||[], warnings: [], info: base.info};
}

/* ---------- data integrity checker (Phase 14) ----------
   Read-only. Never deletes or edits anything. Returns findings ranked
   Critical → Warning → Info. */
function runIntegrityCheck(){
  const findings = [];
  const add = (severity, category, message)=>findings.push({severity, category, message});
  const empIds = new Set(State.employees.map(e=>e.id));
  const ctIds = new Set(State.contracts.map(c=>c.id));
  const ppIds = new Set(State.payrollPlans.map(p=>p.id));
  const txIds = new Set(State.txns.map(t=>t.id));

  // duplicate IDs (critical)
  const dupIds = (arr, label)=>{ const seen=new Set(), dup=new Set(); arr.forEach(r=>{ if(r&&r.id){ if(seen.has(r.id)) dup.add(r.id); else seen.add(r.id); } }); if(dup.size) add('critical','duplicate-id',`${dup.size} duplicate id(s) in ${label}`); };
  dupIds(State.txns,'transactions'); dupIds(State.employees,'employees'); dupIds(State.contracts,'contracts');
  dupIds(State.payrollPlans,'payroll plans'); dupIds(State.recurringExpenses,'recurring expenses'); dupIds(State.monthlyPlans,'monthly plans');

  // broken links (warning)
  let brokenEmp=0, brokenCt=0, brokenPay=0;
  State.contracts.forEach(c=>{ if(c.employeeId && !empIds.has(c.employeeId)) brokenEmp++; });
  State.payrollPlans.forEach(p=>{ if(p.employeeId && !empIds.has(p.employeeId)) brokenEmp++; if(p.contractId && !ctIds.has(p.contractId)) brokenCt++; });
  State.txns.forEach(t=>{ if(t.employeeId && !empIds.has(t.employeeId)) brokenEmp++; if(t.contractId && !ctIds.has(t.contractId)) brokenCt++; if(t.payrollPlanId && !ppIds.has(t.payrollPlanId)) brokenPay++; });
  if(brokenEmp) add('warning','broken-employee-link',`${brokenEmp} record(s) reference a missing employee`);
  if(brokenCt) add('warning','broken-contract-link',`${brokenCt} record(s) reference a missing contract`);
  if(brokenPay) add('warning','broken-payroll-link',`${brokenPay} transaction(s) reference a missing payroll plan`);

  // duplicate payroll rows (warning)
  const seenPay={}; let dupPay=0;
  State.payrollPlans.forEach(p=>{ const k=p.monthKey+'|'+p.employeeId+'|'+p.contractId; if(seenPay[k]) dupPay++; else seenPay[k]=1; });
  if(dupPay) add('warning','duplicate-payroll',`${dupPay} duplicate payroll plan row(s) (same month + employee + contract)`);
  // duplicate payroll transactions
  const seenTx={}; let dupTx=0;
  State.txns.filter(t=>t.source==='payroll').forEach(t=>{ const k=t.monthKey+'|'+t.employeeId+'|'+t.contractId; if(seenTx[k]) dupTx++; else seenTx[k]=1; });
  if(dupTx) add('warning','duplicate-payroll-txn',`${dupTx} duplicate payroll transaction(s) for the same month/employee/contract`);

  // overlapping active contracts (warning)
  let overlap=0; State.employees.forEach(e=>{ overlap += overlappingActiveContracts(e.id).length; });
  if(overlap) add('warning','overlapping-contracts',`${overlap} pair(s) of overlapping active contracts`);

  // orphan payroll transactions (warning)
  let orphan=0; State.txns.filter(t=>t.source==='payroll').forEach(t=>{ if(!t.employeeId || !t.contractId) orphan++; });
  if(orphan) add('warning','orphan-transaction',`${orphan} payroll transaction(s) missing an employee or contract link`);

  // invalid dates (warning)
  let badDates=0; State.contracts.forEach(c=>{ if(!isValidDate(c.startDate)) badDates++; }); State.employees.forEach(e=>{ if(e.joinDate && !isValidDate(e.joinDate)) badDates++; });
  if(badDates) add('warning','invalid-date',`${badDates} record(s) with a missing or invalid date`);

  // negative / invalid amounts (warning)
  let badAmt=0;
  State.txns.forEach(t=>{ if(t.planned!=null && (!isNum(t.planned)||Number(t.planned)<0)) badAmt++; });
  State.payrollPlans.forEach(p=>{ if(p.plannedAmount!=null && (!isNum(p.plannedAmount)||Number(p.plannedAmount)<0)) badAmt++; });
  State.contracts.forEach(c=>{ if(c.monthlySalary!=null && (!isNum(c.monthlySalary)||Number(c.monthlySalary)<0)) badAmt++; });
  if(badAmt) add('warning','invalid-amount',`${badAmt} record(s) with a negative or non-numeric amount`);

  // corrupt monthly-plan references (warning)
  let badRefs=0; State.monthlyPlans.forEach(m=>{ (m.committedTxnIds||[]).forEach(id=>{ if(!txIds.has(id)) badRefs++; }); });
  if(badRefs) add('warning','corrupt-plan-ref',`${badRefs} monthly-plan transaction reference(s) point to a missing transaction`);

  // ----- Overtime integrity (v2.3.0) -----
  dupIds(State.overtimeRecords,'overtime records');
  let otBrokenEmp=0, otBrokenCt=0, otBrokenPay=0, otNegHours=0, otBadSnap=0, otOutside=0;
  State.overtimeRecords.forEach(o=>{
    if(o.employeeId && !empIds.has(o.employeeId)) otBrokenEmp++;
    if(o.contractId && !ctIds.has(o.contractId)) otBrokenCt++;
    if(o.payrollPlanId && !ppIds.has(o.payrollPlanId)) otBrokenPay++;
    if(num(o.overtimeHours)<0) otNegHours++;
    if(!(num(o.monthlyStandardHours)>0) || !(num(o.hourlyRate)>=0) || !isNum(o.calculatedAmount)) otBadSnap++;
    if(o.contractId){ const c=contractById(o.contractId); if(c && !contractCalc(c, o.monthKey).coversMonth) otOutside++; }
  });
  if(otBrokenEmp) add('warning','overtime-broken-employee',`${otBrokenEmp} overtime record(s) reference a missing employee`);
  if(otBrokenCt) add('warning','overtime-broken-contract',`${otBrokenCt} overtime record(s) reference a missing contract`);
  if(otBrokenPay) add('warning','overtime-broken-payroll',`${otBrokenPay} overtime record(s) reference a missing payroll plan`);
  if(otNegHours) add('critical','overtime-negative-hours',`${otNegHours} overtime record(s) have negative hours`);
  if(otBadSnap) add('warning','overtime-bad-snapshot',`${otBadSnap} overtime record(s) have an invalid calculation snapshot`);
  if(otOutside) add('warning','overtime-outside-contract',`${otOutside} overtime record(s) fall outside their contract's covered months`);
  // approved overtime committed twice (same record referenced by >1 payroll plan)
  const otCommitRefCount={};
  State.payrollPlans.forEach(p=>{ (p.overtimeIds||[]).forEach(id=>{ otCommitRefCount[id]=(otCommitRefCount[id]||0)+1; }); });
  const otDoubleCommit = Object.values(otCommitRefCount).filter(n=>n>1).length;
  if(otDoubleCommit) add('critical','overtime-double-commit',`${otDoubleCommit} overtime record(s) are committed to more than one payroll plan`);
  // payroll amount inconsistent with linked overtime
  let otMismatch=0;
  State.payrollPlans.forEach(p=>{ if(p.status==='Committed' && Array.isArray(p.overtimeIds) && p.overtimeIds.length){ const sum=p.overtimeIds.map(id=>overtimeById(id)).filter(Boolean).reduce((s,o)=>s+num(o.approvedAmount!=null?o.approvedAmount:o.calculatedAmount),0); if(Math.abs(sum-num(p.overtimeAmount!=null?p.overtimeAmount:p.overtime))>1) otMismatch++; } });
  if(otMismatch) add('warning','overtime-payroll-mismatch',`${otMismatch} payroll plan(s) have an overtime total that differs from their linked overtime records`);

  // ----- Smart Import integrity (v2.4.0) -----
  let payNoEmp=0; State.payrollPlans.forEach(p=>{ if(!p.employeeId || !empIds.has(p.employeeId)) payNoEmp++; });
  if(payNoEmp) add('warning','payroll-without-employee',`${payNoEmp} payroll plan(s) have no valid employee`);
  // duplicate employees (same normalized name or same employeeId code)
  const seenName={}, seenCode={}; let dupName=0, dupCode=0;
  State.employees.forEach(e=>{ const n=normStr(e.fullName); if(n){ if(seenName[n]) dupName++; else seenName[n]=1; } if(e.employeeId){ if(seenCode[e.employeeId]) dupCode++; else seenCode[e.employeeId]=1; } });
  if(dupName) add('warning','duplicate-employee',`${dupName} employee(s) share a name with another record`);
  if(dupCode) add('warning','duplicate-employee-id',`${dupCode} employee(s) share an Employee ID with another record`);
  // duplicate payroll plans (employee+contract+month)
  const seenPP={}; let dupPP=0; State.payrollPlans.forEach(p=>{ const k=p.monthKey+'|'+p.employeeId+'|'+p.contractId; if(seenPP[k]) dupPP++; else seenPP[k]=1; });
  if(dupPP) add('warning','duplicate-payroll-plan',`${dupPP} duplicate payroll plan(s) (same employee + contract + month)`);
  // broken import links: records referencing a missing import batch
  const batchIds = new Set(State.importBatches.map(b=>b.batchId));
  let brokenImport=0;
  State.txns.concat(State.payrollPlans, State.employees, State.contracts).forEach(r=>{ if(r && r.importBatchId && !batchIds.has(r.importBatchId)) brokenImport++; });
  if(brokenImport) add('warning','broken-import-link',`${brokenImport} record(s) reference a missing import batch`);
  // rollback conflicts: undone batch whose created records still exist and are executed
  let rbConflict=0; State.importBatches.filter(b=>b.undone).forEach(b=>{ (b.created&&b.created.txns||[]).forEach(id=>{ const t=findTxn(id); if(t && t.actual!=null) rbConflict++; }); });
  if(rbConflict) add('info','rollback-preserved',`${rbConflict} executed transaction(s) were preserved from an undone import (expected, informational)`);
  // invalid contract evidence
  let badEvidence=0; State.contracts.forEach(c=>{ if(c.importEvidence && c.startDate && !isValidDate(c.startDate)) badEvidence++; });
  if(badEvidence) add('warning','invalid-contract-evidence',`${badEvidence} imported contract(s) have invalid start-date evidence`);

  // ----- Native Payroll Operations integrity (v2.5.0) -----
  let pNoEmp=0, pNoCt=0, pOutside=0, pNeg=0, pInconsistent=0, pMissingPlan=0, pMissingTxn=0, pTxnMismatch=0, pOverrideNoReason=0, pDupMonth=0, pOtBroken=0;
  const seenPM={};
  State.payrollPlans.forEach(p=>{
    if(p.status==='Cancelled') return;
    if(!p.employeeId || !empIds.has(p.employeeId)) pNoEmp++;
    if(!p.contractId || !ctIds.has(p.contractId)) pNoCt++;
    else { const c=contractById(p.contractId); if(c && !contractCalc(c, p.monthKey).coversMonth) pOutside++; }
    if(computePayrollPlanned(p)<0) pNeg++;
    if(p.plannedAmount!=null && Math.abs(num(p.plannedAmount)-computePayrollPlanned(p))>1) pInconsistent++;
    if(p.monthlyPlanId && !State.monthlyPlans.some(m=>m.id===p.monthlyPlanId)) pMissingPlan++;
    if(p.status==='Committed'){ const t=payrollTxnOf(p); if(!t) pMissingTxn++; else if(t.actual==null && Math.abs(num(t.planned)-num(p.plannedAmount))>1) pTxnMismatch++; }
    if(p.salaryOverride && !String(p.salaryOverride.reason||'').trim()) pOverrideNoReason++;
    const k=p.monthKey+'|'+p.employeeId; if(seenPM[k]) pDupMonth++; else seenPM[k]=1;
    (p.overtimeIds||[]).forEach(oid=>{ if(!overtimeById(oid)) pOtBroken++; });
  });
  if(pNoEmp) add('warning','payroll-no-employee',`${pNoEmp} payroll plan(s) without a valid employee`);
  if(pNoCt) add('warning','payroll-no-contract',`${pNoCt} payroll plan(s) without a valid contract`);
  if(pOutside) add('warning','payroll-outside-contract',`${pOutside} payroll plan(s) outside their contract's covered months`);
  if(pDupMonth) add('warning','payroll-duplicate-month',`${pDupMonth} duplicate employee payroll for the same month`);
  if(pNeg) add('critical','payroll-negative',`${pNeg} payroll plan(s) with a negative final amount`);
  if(pOtBroken) add('warning','payroll-overtime-broken',`${pOtBroken} broken overtime link(s) in payroll plans`);
  if(pInconsistent) add('warning','payroll-total-inconsistent',`${pInconsistent} payroll plan(s) whose stored total differs from the component sum`);
  if(pMissingPlan) add('warning','payroll-missing-monthlyplan',`${pMissingPlan} payroll plan(s) linked to a missing monthly plan`);
  if(pMissingTxn) add('warning','payroll-missing-transaction',`${pMissingTxn} committed payroll plan(s) with no linked transaction`);
  if(pTxnMismatch) add('warning','payroll-txn-mismatch',`${pTxnMismatch} transaction(s) whose amount differs from the payroll plan`);
  if(pOverrideNoReason) add('warning','payroll-override-no-reason',`${pOverrideNoReason} salary override(s) without a reason`);
  // recurring adjustment outside effective period is prevented at generation; flag stored snapshots that fall outside
  let adjOutside=0; State.payrollAdjustments.forEach(a=>{ if(a.endMonth && a.startMonth && a.endMonth < a.startMonth) adjOutside++; });
  if(adjOutside) add('warning','adjustment-invalid-period',`${adjOutside} recurring adjustment(s) with an end month before the start month`);

  // ----- Employee deduplication integrity (v2.5.2) -----
  const dupGroups = findEmployeeDuplicateGroups();
  if(dupGroups.length){
    const dupRecords = dupGroups.reduce((n,g)=>n+g.employees.length,0);
    add('critical','duplicate-employee-name',`${dupGroups.length} duplicate employee name group(s) covering ${dupRecords} record(s) — same person under multiple IDs (open Employee Duplicate Review)`);
    let splitPay=0, splitOt=0, conflictContact=0, orphanDup=0;
    dupGroups.forEach(g=>{
      const ids=new Set(g.employees.map(e=>e.id));
      if(new Set(State.payrollPlans.filter(p=>ids.has(p.employeeId)).map(p=>p.employeeId)).size>1) splitPay++;
      if(new Set(State.overtimeRecords.filter(o=>ids.has(o.employeeId)).map(o=>o.employeeId)).size>1) splitOt++;
      ['bankAccount','email'].forEach(f=>{ if(new Set(g.employees.map(e=>e[f]).filter(v=>v&&String(v).trim())).size>1) conflictContact++; });
      g.employees.forEach(e=>{ if(employeeLinkCount(e.id)===0) orphanDup++; });
    });
    if(splitPay) add('warning','payroll-split-across-duplicates',`${splitPay} person(s) have payroll plans split across multiple duplicate employee IDs`);
    if(splitOt) add('warning','overtime-split-across-duplicates',`${splitOt} person(s) have overtime split across multiple duplicate employee IDs`);
    if(conflictContact) add('info','duplicate-contact-conflict',`${conflictContact} duplicate group(s) have conflicting bank account or email values to reconcile`);
    if(orphanDup) add('info','orphan-duplicate-employee',`${orphanDup} duplicate employee record(s) have no linked data (safe to merge or remove)`);
  }
  // contract number linked to more than one employee (critical)
  const cnToEmp={}; let cnMultiEmp=0;
  State.contracts.forEach(c=>{ if(!c.contractNumber) return; const k=normStr(c.contractNumber); (cnToEmp[k]=cnToEmp[k]||new Set()).add(c.employeeId); });
  Object.values(cnToEmp).forEach(s=>{ if(s.size>1) cnMultiEmp++; });
  if(cnMultiEmp) add('critical','contract-multiple-employees',`${cnMultiEmp} contract number(s) linked to more than one employee`);
  // Smart Import batch that created multiple employees for a single candidate
  let batchMultiCand=0;
  (State.importBatches||[]).forEach(b=>{ if(b.undone || !b.candidateMap) return; const created=(b.created&&b.created.employees)||[]; if(created.length > new Set(Object.values(b.candidateMap)).size) batchMultiCand++; });
  if(batchMultiCand) add('warning','import-multiple-employees-per-candidate',`${batchMultiCand} Smart Import batch(es) created more than one employee for a single candidate`);

  // run schema validators across every entity, roll warnings/errors up
  let vErr=0, vWarn=0;
  const runV = (arr, fn)=>arr.forEach(x=>{ const r=fn(x); vErr+=r.errors.length; vWarn+=r.warnings.length; });
  runV(State.employees, validateEmployee); runV(State.contracts, validateContract);
  runV(State.payrollPlans, validatePayrollPlan); runV(State.recurringExpenses, validateRecurring);
  runV(State.monthlyPlans, validateMonthlyPlan); runV(State.txns, validateTransaction);
  runV(State.overtimeRecords, validateOvertime);
  if(vErr) add('critical','schema-error',`${vErr} field-level validation error(s) across all records`);
  if(vWarn) add('info','schema-warning',`${vWarn} field-level validation warning(s) across all records`);

  const order = {critical:0, warning:1, info:2};
  findings.sort((a,b)=>order[a.severity]-order[b.severity]);
  const counts = {critical:findings.filter(f=>f.severity==='critical').length, warning:findings.filter(f=>f.severity==='warning').length, info:findings.filter(f=>f.severity==='info').length};
  const status = counts.critical? 'Critical issues found' : counts.warning? 'Warnings found' : 'Healthy';
  const result = {findings, counts, status, ranAt:new Date().toISOString()};
  State.lastIntegrity = result;
  return result;
}

/* ---------- accessibility / global UI handlers (Phase 12) ---------- */
function focusFirstIn(container){
  if(!container) return;
  const el = container.querySelector('input:not([type=hidden]):not([disabled]), select:not([disabled]), textarea:not([disabled]), button');
  if(el){ try{ el.focus(); }catch(e){} }
}
let __installedGlobalUI = false;
function installGlobalUIHandlers(){
  if(__installedGlobalUI) return; __installedGlobalUI = true;
  // Escape closes any open modal (finance or HR) — installed exactly once so it
  // never accumulates across re-renders.
  document.addEventListener('keydown', e=>{
    if(e.key==='Escape'){
      const root = document.getElementById('modal-root');
      if(root && root.innerHTML.trim()){ e.preventDefault(); closeModal(); }
    }
  });
  bindSystemThemeListener();
}

/* ---------- appearance / theme (Part 15) ---------- */
function resolveTheme(pref){
  pref = pref || (State.settings && State.settings.appearance) || 'system';
  if(pref==='dark') return 'dark';
  if(pref==='light') return 'light';
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}
// Sets the semantic theme on <html>; all CSS variables and charts follow it.
function applyTheme(){
  const eff = resolveTheme();
  document.documentElement.dataset.theme = eff;
  const tc = document.querySelector('meta[name="theme-color"]');
  if(tc) tc.setAttribute('content', eff==='light' ? '#F3F5F8' : '#0E1420');
  return eff;
}
let __themeMediaBound = false;
function bindSystemThemeListener(){
  if(__themeMediaBound || !window.matchMedia) return; __themeMediaBound = true;
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  // Live-update only while the user is on "Follow System"; a manual override
  // ignores OS changes until they return to System.
  const handler = ()=>{ if(((State.settings && State.settings.appearance) || 'system')==='system'){ applyTheme(); if(State.storageReady) render(); } };
  if(mq.addEventListener) mq.addEventListener('change', handler);
  else if(mq.addListener) mq.addListener(handler);
}
// Read a theme-aware color from the CSS variables (charts call this at draw time).
function themeVar(name, fallback){
  try{ const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim(); return v || fallback; }
  catch(e){ return fallback; }
}

/* ============================================================
   OVERTIME ENGINE (v2.3.0)
   TAM Internal Overtime Calculation Method:
     Monthly Standard Hours = hours/day × days/week × weeks/month
     Hourly Rate            = Monthly Salary ÷ Monthly Standard Hours   (full precision)
     Overtime Amount        = Overtime Hours × Hourly Rate              (round ONLY the final payable)
   Each employee/contract carries its own schedule — no global assumption.
   ============================================================ */

/* ---------- work schedule resolution (Part 3) ---------- */
function readSchedule(o){
  if(!o) return null;
  const h=Number(o.workHoursPerDay), d=Number(o.workDaysPerWeek), w=Number(o.weeksPerMonth);
  if(o.workHoursPerDay||o.workDaysPerWeek||o.weeksPerMonth){
    return {hoursPerDay:h||0, daysPerWeek:d||0, weeksPerMonth:w||0, effectiveDate:o.scheduleEffectiveDate||null, notes:o.scheduleNotes||null};
  }
  return null;
}
// Precedence: contract schedule → employee schedule → company default settings.
function effectiveSchedule(emp, contract){
  const fromCt = readSchedule(contract), fromEmp = readSchedule(emp);
  const base = fromCt || fromEmp || {
    hoursPerDay:Number(State.settings.companyWorkHoursPerDay)||8,
    daysPerWeek:Number(State.settings.companyWorkDaysPerWeek)||5,
    weeksPerMonth:Number(State.settings.companyWeeksPerMonth)||4,
    effectiveDate:null, notes:'Company default schedule',
  };
  const source = fromCt?'contract':fromEmp?'employee':'company';
  const valid = base.hoursPerDay>0 && base.daysPerWeek>0 && base.weeksPerMonth>0;
  return {...base, source, valid};
}
// Shared work-schedule form fields for the employee and contract modals (Part 3).
// Blank = inherit (employee inherits company; contract inherits employee).
function scheduleFieldsHTML(v, scopeLabel){
  return `
    <div class="field" style="grid-column:span 2;"><div class="divider" style="margin:6px 0;"></div><label style="font-weight:600;">Work Schedule <span class="faint">(${scopeLabel} — leave blank to inherit)</span></label></div>
    <div class="field"><label>Working Hours / Day</label><input class="input" type="number" step="0.5" min="0" name="workHoursPerDay" value="${v.workHoursPerDay??''}" placeholder="e.g. 6 or 8"></div>
    <div class="field"><label>Working Days / Week</label><input class="input" type="number" step="1" min="0" name="workDaysPerWeek" value="${v.workDaysPerWeek??''}" placeholder="default 5"></div>
    <div class="field"><label>Weeks / Month</label><input class="input" type="number" step="1" min="0" name="weeksPerMonth" value="${v.weeksPerMonth??''}" placeholder="default 4"></div>
    <div class="field"><label>Schedule Effective Date</label><input class="input" type="date" name="scheduleEffectiveDate" value="${escapeHtml(v.scheduleEffectiveDate||'')}"></div>
    <div class="field" style="grid-column:span 2;"><label>Schedule Notes</label><input class="input" name="scheduleNotes" value="${escapeHtml(v.scheduleNotes||'')}"></div>`;
}
function applyScheduleFromForm(fd, rec){
  const h=fd.get('workHoursPerDay'), d=fd.get('workDaysPerWeek'), w=fd.get('weeksPerMonth');
  rec.workHoursPerDay = (h===''||h==null)?null:Number(h);
  rec.workDaysPerWeek = (d===''||d==null)?null:Number(d);
  rec.weeksPerMonth   = (w===''||w==null)?null:Number(w);
  rec.scheduleEffectiveDate = fd.get('scheduleEffectiveDate')||null;
  rec.scheduleNotes = (fd.get('scheduleNotes')||'').trim()||null;
}

/* ---------- overtime calculation (Parts 4, 5) ---------- */
function roundOvertime(v){
  const rule = OVERTIME_ROUNDING[State.settings.overtimeRounding] || OVERTIME_ROUNDING.rupiah;
  if(!rule.step) return v;                 // no rounding
  return Math.round(v/rule.step)*rule.step; // round only the final payable amount
}
// Full-precision calculation. The hourly rate is NEVER rounded before it is
// multiplied by hours — only the payable amount is rounded (per settings).
function overtimeCalc(salary, sched, hours){
  const standardHours = (Number(sched.hoursPerDay)||0)*(Number(sched.daysPerWeek)||0)*(Number(sched.weeksPerMonth)||0);
  const hourlyRate = standardHours>0 ? (Number(salary)||0)/standardHours : 0;
  const rawAmount = hourlyRate * (Number(hours)||0);
  return {standardHours, hourlyRate, rawAmount, amount: roundOvertime(rawAmount)};
}
// Salary basis for overtime: active contract's monthly salary, else employee base.
function overtimeSalaryBasis(emp, contract){
  if(contract && contract.monthlySalary!=null) return Number(contract.monthlySalary)||0;
  return Number(emp && emp.monthlyBaseSalary)||0;
}
function fmtIDRfull(n){ if(n==null||isNaN(n)) return '—'; return 'Rp'+Number(n).toLocaleString('id-ID',{maximumFractionDigits:4}); }

/* ---------- overtime record operations (Parts 6, 7) ---------- */
function overtimeById(id){ return State.overtimeRecords.find(o=>o.id===id); }
function overtimeForEmployeeMonth(empId, monthKey){ return State.overtimeRecords.filter(o=>o.employeeId===empId && o.monthKey===monthKey); }
// Overtime that should feed payroll for an employee/month: approved (not yet
// committed) plus anything already committed for that employee/month.
function approvedOvertimeForMonth(empId, monthKey){
  const recs = overtimeForEmployeeMonth(empId, monthKey).filter(o=>o.status==='Approved' || o.status==='Committed to Payroll');
  const amount = recs.reduce((s,o)=>s+num(o.approvedAmount!=null?o.approvedAmount:o.calculatedAmount),0);
  return {records:recs, amount, ids:recs.map(o=>o.id)};
}
function buildOvertimeRecord(fields){
  const emp = empById(fields.employeeId);
  const contract = fields.contractId ? contractById(fields.contractId) : (emp?activeContractToday(emp.id):null);
  const sched = effectiveSchedule(emp, contract);
  const salary = overtimeSalaryBasis(emp, contract);
  const hours = Math.max(0, num(fields.overtimeHours));
  const calc = overtimeCalc(salary, sched, hours);
  const mo = keyToMonthObj(fields.monthKey);
  const now = new Date().toISOString();
  return {
    id: uid('ot'), employeeId: emp?emp.id:null, employeeName: emp?emp.fullName:'', contractId: contract?contract.id:null, contractNumber: contract?contract.contractNumber:null,
    payrollPlanId:null, committedTxnId:null,
    monthKey: fields.monthKey, month:mo.month, year:mo.year, monthNum:mo.monthNum,
    overtimeDate: fields.overtimeDate||null, overtimeHours: hours, workDescription: fields.workDescription||'', project: fields.project||null,
    // snapshots — preserved even if schedule/salary later change
    snapHoursPerDay: sched.hoursPerDay, snapDaysPerWeek: sched.daysPerWeek, snapWeeksPerMonth: sched.weeksPerMonth, snapMonthlySalary: salary, scheduleSource: sched.source,
    monthlyStandardHours: calc.standardHours, hourlyRate: calc.hourlyRate,
    calculatedAmount: calc.amount, rawAmount: calc.rawAmount, approvedAmount: null,
    status: 'Draft', notes: fields.notes||'', createdAt: now, updatedAt: now,
    history:[{event:'created', ts:now, note:'Overtime record created'}],
  };
}
async function addOvertimeRecord(fields){
  const rec = buildOvertimeRecord(fields);
  State.overtimeRecords.push(rec);
  await persistOvertime();
  return rec;
}
async function updateOvertimeRecord(id, fields){
  const o = overtimeById(id); if(!o) return;
  Object.assign(o, fields);
  // recompute from snapshots + new hours (snapshots stay fixed unless re-derived)
  const hours = Math.max(0, num(o.overtimeHours));
  const sched = {hoursPerDay:o.snapHoursPerDay, daysPerWeek:o.snapDaysPerWeek, weeksPerMonth:o.snapWeeksPerMonth};
  const calc = overtimeCalc(o.snapMonthlySalary, sched, hours);
  o.overtimeHours=hours; o.monthlyStandardHours=calc.standardHours; o.hourlyRate=calc.hourlyRate; o.calculatedAmount=calc.amount; o.rawAmount=calc.rawAmount;
  o.updatedAt=new Date().toISOString();
  (o.history=o.history||[]).push({event:'edited', ts:o.updatedAt, note:'Overtime record edited'});
  await persistOvertime();
}
async function setOvertimeStatus(id, status){
  const o = overtimeById(id); if(!o) return;
  if(o.status==='Committed to Payroll'){ showWarning('This overtime is already committed to payroll and cannot change status.'); return; }
  o.status = status;
  if(status==='Approved' && o.approvedAmount==null) o.approvedAmount = o.calculatedAmount;
  o.updatedAt = new Date().toISOString();
  (o.history=o.history||[]).push({event:status.toLowerCase(), ts:o.updatedAt, note:'Status → '+status});
  await persistOvertime(); showSuccess('Overtime '+status.toLowerCase()+'.'); render();
}
async function duplicateOvertimeRecord(id){
  const o = overtimeById(id); if(!o) return;
  const copy = JSON.parse(JSON.stringify(o));
  copy.id = uid('ot'); copy.status='Draft'; copy.approvedAmount=null; copy.payrollPlanId=null; copy.committedTxnId=null;
  copy.createdAt = copy.updatedAt = new Date().toISOString();
  copy.history = [{event:'created', ts:copy.createdAt, note:'Duplicated from '+(o.workDescription||o.id)}];
  State.overtimeRecords.push(copy);
  await persistOvertime(); showSuccess('Overtime duplicated as Draft.'); render();
}
async function deleteOvertimeRecord(id){
  const o = overtimeById(id); if(!o) return;
  if(o.status==='Committed to Payroll'){ showWarning('Committed overtime cannot be deleted. Reject is unavailable after commit.'); return; }
  if(!confirmAction('Delete this overtime record? This cannot be undone.')) return;
  State.overtimeRecords = State.overtimeRecords.filter(x=>x.id!==id);
  await persistOvertime(); showSuccess('Overtime deleted.'); render();
}

function renderOvertimeWorksheet(main){
  if(!State.overtimeMonth) State.overtimeMonth = todayKey();

  const mo = keyToMonthObj(monthKey);
  const eligible = State.employees.filter(empEligible);
  // one worksheet row per eligible employee, prefilled from any existing draft OT for the month
  const rows = eligible.map(e=>{
    const contract = coveringContract(e.id, monthKey) || activeContractToday(e.id);
    const sched = effectiveSchedule(e, contract);
    const salary = overtimeSalaryBasis(e, contract);
    const existing = overtimeForEmployeeMonth(e.id, monthKey).filter(o=>o.status==='Draft');
    const hours = existing.reduce((s,o)=>s+num(o.overtimeHours),0);
    return {employeeId:e.id, employeeName:e.fullName, contract, contractNumber:contract?contract.contractNumber:null, sched, salary, hours, existingIds:existing.map(o=>o.id), validSched:sched.valid};
  });
  const yearOpts=[]; for(let y=mo.year-1;y<=mo.year+2;y++) yearOpts.push(y);

  main.innerHTML = pageHeader('Monthly Overtime Worksheet',
      `Enter overtime for several employees for ${escapeHtml(mo.month)} ${mo.year} in one screen.`,
      `<select class="input" id="wsMonthSel">${MONTH_ORDER.map((mn,i)=>`<option value="${i+1}" ${mo.monthNum===i+1?'selected':''}>${mn}</option>`).join('')}</select>
       <select class="input" id="wsYearSel">${yearOpts.map(y=>`<option ${y===mo.year?'selected':''}>${y}</option>`).join('')}</select>
       <button class="btn" id="wsBack">← Overtime</button>`)
    + `<div class="card"><div id="wsArea"></div></div>`;
  const sync = ()=>{ const m=+document.getElementById('wsMonthSel').value, y=+document.getElementById('wsYearSel').value; State.overtimeMonth=mkKey(y,m); renderOvertimeWorksheet(main); };
  document.getElementById('wsMonthSel').addEventListener('change', sync);
  document.getElementById('wsYearSel').addEventListener('change', sync);
  document.getElementById('wsBack').addEventListener('click', ()=>hrNavTo('overtime'));

  const area = document.getElementById('wsArea');
  if(!eligible.length){ area.innerHTML = `<div class="empty">No active employees. Add employees and contracts first.</div>`; return; }
  const draw = ()=>{
    let totalHours=0, totalAmt=0, withOt=0;
    rows.forEach(r=>{ const c=overtimeCalc(r.salary, r.sched, r.hours); r._calc=c; totalHours+=num(r.hours); totalAmt+=c.amount; if(num(r.hours)>0) withOt++; });
    const draftN = State.overtimeRecords.filter(o=>o.monthKey===monthKey && o.status==='Draft').length;
    const apprN = State.overtimeRecords.filter(o=>o.monthKey===monthKey && o.status==='Approved').length;
    const commN = State.overtimeRecords.filter(o=>o.monthKey===monthKey && o.status==='Committed to Payroll').length;
    area.innerHTML = `
      <div class="grid grid-4" style="margin-bottom:12px;">
        <div class="chart-mini-stat"><div class="lbl">Total OT Hours</div><div class="val">${totalHours.toLocaleString('id-ID',{maximumFractionDigits:2})}</div></div>
        <div class="chart-mini-stat"><div class="lbl">Total OT Amount</div><div class="val">${fmtIDRShort(totalAmt)}</div></div>
        <div class="chart-mini-stat"><div class="lbl">Employees w/ OT</div><div class="val">${withOt}</div></div>
        <div class="chart-mini-stat"><div class="lbl">Draft / Appr / Committed</div><div class="val" style="font-size:12px;">${draftN} / ${apprN} / ${commN}</div></div>
      </div>
      <div class="table-wrap" style="max-height:520px;overflow-y:auto;"><table>
        <thead><tr><th>Employee</th><th>Contract</th><th class="num">h/day</th><th class="num">Salary</th><th class="num">OT Hours</th><th class="num">Hourly Rate</th><th class="num">OT Amount</th></tr></thead>
        <tbody>${rows.map((r,i)=>`<tr>
          <td><b>${escapeHtml(r.employeeName)}</b>${r.validSched?'':' <span class="pill pill-status-cancelled">no schedule</span>'}</td>
          <td class="dim">${escapeHtml(r.contractNumber||'—')}</td>
          <td class="num">${r.sched.hoursPerDay}</td>
          <td class="num">${fmtIDR(r.salary)}</td>
          <td class="num"><input class="input" style="width:80px;text-align:right;padding:4px 6px;" type="number" step="0.25" min="0" data-ws="${i}" value="${num(r.hours)}"></td>
          <td class="num">${fmtIDRfull(r._calc.hourlyRate)}</td>
          <td class="num" id="wsamt-${i}"><b>${fmtIDR(r._calc.amount)}</b></td>
        </tr>`).join('')}</tbody>
      </table></div>
      <div class="modal-actions" style="justify-content:flex-start;margin-top:14px;flex-wrap:wrap;gap:8px;">
        <button class="btn btn-accent" id="wsSaveDraft">Save all as Draft</button>

        <button class="btn" id="wsCommitInfo" disabled title="Commit happens from Payroll Planning">Commit via Payroll →</button>

      <p class="hint" style="margin-top:6px;">Saving creates/updates Draft overtime records for this month. Approve them (here or on the Overtime page), then commit through Payroll Planning so the amounts flow into planned payroll.</p>`;
    area.querySelectorAll('[data-ws]').forEach(inp=>inp.addEventListener('input', e=>{ const i=+e.target.dataset.ws; rows[i].hours=e.target.value; const c=overtimeCalc(rows[i].salary, rows[i].sched, rows[i].hours); rows[i]._calc=c; const cell=area.querySelector(`#wsamt-${i}`); if(cell) cell.innerHTML=`<b>${fmtIDR(c.amount)}</b>`; }));
    area.querySelector('#wsSaveDraft').addEventListener('click', async ()=>{ await worksheetSave(monthKey, rows, false); renderOvertimeWorksheet(main); });
    area.querySelector('#wsApprove').addEventListener('click', async ()=>{ await worksheetSave(monthKey, rows, true); renderOvertimeWorksheet(main); });
  };
  draw();
}
async function worksheetSave(monthKey, rows, approve){
  let saved=0;
  for(const r of rows){
    const hours = num(r.hours);
    // find an existing draft to update, else create when hours>0
    let rec = State.overtimeRecords.find(o=>o.monthKey===monthKey && o.employeeId===r.employeeId && (o.status==='Draft'||(approve&&o.status==='Approved')));
    if(hours<=0){ continue; }
    if(rec){ await updateOvertimeRecord(rec.id, {overtimeHours:hours, workDescription:rec.workDescription||'Monthly worksheet entry'}); }
    else { rec = await addOvertimeRecord({employeeId:r.employeeId, monthKey, overtimeHours:hours, workDescription:'Monthly worksheet entry'}); }
    if(approve && rec){ const o=overtimeById(rec.id); if(o && o.status!=='Committed to Payroll'){ o.status='Approved'; if(o.approvedAmount==null) o.approvedAmount=o.calculatedAmount; o.updatedAt=new Date().toISOString(); } }
    saved++;
  }
  await persistOvertime();
  showSuccess(`${saved} employee overtime row(s) saved${approve?' and approved':' as Draft'}.`);
}

function meaningfulDataCounts(){

  return {

}

/* ============================================================
   SMART IMPORT & MASTER DATA SYNC ENGINE (v2.4.0, Parts 1-12)
   Extracts employees / contracts / payroll from a payroll workbook,
   matches them against master data, lets the user review conflicts,
   then commits with structured IDs, an audit batch, and undo.
   Nothing is written to storage during parsing/review — only on Commit.
   ============================================================ */

/* ---------- extraction (Parts 3, 4) ---------- */
function parseProgressText(text){
  const m = /(?:^|[^\d])(\d{1,2})\s*\/\s*(\d{1,2})(?:[^\d]|$)/.exec(String(text||''));
  if(m){ const cur=+m[1], tot=+m[2]; if(tot>=1 && tot<=60 && cur>=0 && cur<=tot) return {current:cur, total:tot}; }
  return null;
}
function parseContractNumber(text){
  const m = /(\d+\s*\/\s*[A-Za-z0-9.\-]+\s*\/\s*[IVXLCDM]+\s*\/\s*\d{4})/.exec(String(text||''));
  return m ? m[1].replace(/\s+/g,'') : null;
}
// Roman month/year embedded in a contract number (e.g. XI/2025) — supporting evidence only.
function contractNumberMonthYear(cn){
  const m = /\/([IVXLCDM]+)\/(\d{4})\s*$/.exec(cn||'');
  if(!m) return null;
  const rom={I:1,II:2,III:3,IV:4,V:5,VI:6,VII:7,VIII:8,IX:9,X:10,XI:11,XII:12};
  const mn = rom[m[1].toUpperCase()]; if(!mn) return null;
  return {monthNum:mn, year:+m[2]};
}
function parseRpValue(text){
  const m = /Rp\s*([\d.,]+)/i.exec(String(text||''));
  if(!m) return null;
  const v = Number(m[1].replace(/[.,]/g,''));
  return isFinite(v) ? v : null;
}
function extractEmployeeName(text){
  const lines = String(text||'').split(/[\n\r]+/).map(s=>s.trim()).filter(Boolean);
  for(const ln of lines){
    if(parseContractNumberFlexible(ln) || looksLikeContractNumber(ln)) continue;  // v2.5.1 flexible
    if(/^\d{1,2}(?:[.,]\d)?\s*\/\s*\d{1,2}$/.test(ln)) continue;                    // bare progress
    if(/^rp\b|^\d[\d.,]*$/i.test(ln)) continue;
    if(/^bulan\b/i.test(ln)) continue;                                             // "bulan Juni" note
    return ln;
  }
  return (lines[0]||'').trim();
}
// Infer the proposed contract start: Payroll Month − (current − 1), first of month.
// v2.5.1 — current may be fractional (e.g. 8,5/12); round to the nearest whole month.
function inferContractStart(monthKey, current){
  if(current==null || current<1) return null;
  const cur = Math.round(current);
  const abs = keyAbs(monthKey) - (cur-1);
  const y = Math.floor(abs/12), m = (abs%12)+1;
  return mkKey(y,m)+'-01';
}
// Extract payroll rows from the parsed workbook's salary (Gaji / code A) items.
function smartExtractRows(rawBatches){
  const rows = [];
  (rawBatches||[]).forEach(batch=>{
    (batch.categories||[]).forEach(cat=>{
      const isGaji = cat.code==='A' || /gaji|salary|payroll/i.test(cat.name||'');
      if(!isGaji) return;
      (cat.items||[]).forEach(it=>{
        const text = it.uraian || '';
        // v2.5.1 — full evidence text = name cell + sub-rows (letterdoc) for regex fallback.
        const evidence = [text, ...((it.subLines||[]))].filter(Boolean).join('\n');
        const planned = it.jumlahRencana||0;
        const actual = (it.jumlahRealisasi===undefined) ? null : it.jumlahRealisasi;
        // Prefer structured fields carried from the parser; fall back to regex on the evidence text.
        const hasStructProgress = (it.progressCurrent!=null || it.progressTotal!=null);
        const prog = hasStructProgress ? {current:it.progressCurrent, total:it.progressTotal} : parseProgressFlexible(evidence);
        const employeeName = (it.employeeName && String(it.employeeName).trim()) || extractEmployeeName(evidence);
        const contractNumber = (it.contractNumber && String(it.contractNumber).trim()) || parseContractNumberFlexible(evidence);
        const salary = (it.salary!=null && it.salary!=='') ? Number(it.salary)||0 : (planned || parseRpValue(evidence) || 0);
        rows.push({
          importRowId: uid('irow'), monthKey: batch.key, month: batch.monthName, year: batch.year, monthNum: batch.monthNum,
          rawText: text, evidenceText: evidence, subLines: it.subLines||[], originalPlanned: planned, originalActual: actual,
          employeeName, contractNumber,
          progressCurrent: prog?prog.current:null, progressTotal: prog?prog.total:null,
          progressRaw: prog ? (prog.current+'/'+prog.total) : null,
          salary, planned, actual, overtime:0, allowance:0, deduction:0,
          workingHoursPerDay: it.workingHoursPerDay!=null?it.workingHoursPerDay:null,
          workingDaysPerWeek: it.workingDaysPerWeek!=null?it.workingDaysPerWeek:null,
          overtimeHours: it.overtimeHours!=null?it.overtimeHours:null,
          // v2.5.2 — supporting identity evidence for cross-month employee grouping
          bankAccount: it.bankAccount||null, bankName: it.bankName||null, email: it.email||null,
        });
      });
    });
  });
  return rows;
}

/* ---------- matching (Parts 5, 6) ---------- */
function smartMatchEmployee(row){
  const nn = normStr(row.employeeName);
  if(!nn) return {status:'No Match', employee:null, confidence:0};
  const exact = State.employees.find(e=>normStr(e.fullName)===nn);
  if(exact) return {status:'Exact', employee:exact, confidence:1};
  let best=null, score=0;
  State.employees.forEach(e=>{ const s=similarText(e.fullName, row.employeeName); if(s>score){ score=s; best=e; } });
  if(best && score>=0.9) return {status:'High Confidence', employee:best, confidence:score};
  if(best && score>=0.72) return {status:'Needs Review', employee:best, confidence:score};
  return {status:'No Match', employee:null, confidence:score};
}
function smartMatchContract(row, empMatch){
  const emp = empMatch.employee;
  // Start inference: progress relative to the payroll month is primary (most precise); the
  // contract number's own month/year is only supporting evidence used when progress is absent.
  const cnMY = row.contractNumber ? contractNumberMonthYearFlex(row.contractNumber) : null;
  const startFromCN = cnMY ? (mkKey(cnMY.year, cnMY.monthNum)+'-01') : null;
  const startFromProgress = inferContractStart(row.monthKey, row.progressCurrent);
  const inferredStart = startFromProgress || startFromCN;
  if(row.contractNumber){
    const byNum = State.contracts.find(c=>normStr(c.contractNumber)===normStr(row.contractNumber));
    if(byNum){
      // Conflicts are only raised against EXISTING master data — never overwritten automatically.
      const conflicts=[];
      if(row.progressTotal && byNum.durationMonths && +byNum.durationMonths!==row.progressTotal) conflicts.push({field:'Duration', existing:byNum.durationMonths, imported:row.progressTotal});
      if(startFromProgress && byNum.startDate && byNum.startDate.slice(0,7)!==startFromProgress.slice(0,7)) conflicts.push({field:'Start', existing:byNum.startDate, imported:startFromProgress});
      if(row.salary && byNum.monthlySalary && Math.abs(byNum.monthlySalary-row.salary)>1) conflicts.push({field:'Salary', existing:byNum.monthlySalary, imported:row.salary});
      return {status: conflicts.length?'Conflict':'Existing', contract:byNum, conflicts, inferredStart};
    }
  }
  if(emp && row.progressTotal && startFromProgress){
    const match = State.contracts.find(c=>c.employeeId===emp.id && +c.durationMonths===row.progressTotal && c.startDate && c.startDate.slice(0,7)===startFromProgress.slice(0,7));
    if(match) return {status:'Existing', contract:match, conflicts:[], inferredStart};
  }
  // v2.5.1 — no contract number AND no progress: infer a default contract from the payroll month
  // instead of blocking. Still flagged (missingInfo) so it is reviewed, not silently guessed.
  if(!row.contractNumber && row.progressTotal==null){
    return {status:'New', contract:null, conflicts:[], inferredStart:(row.monthKey+'-01'), missingInfo:true};
  }
  return {status:'New', contract:null, conflicts:[], inferredStart};
}

/* ============================================================
   EMPLOYEE DEDUPLICATION & MASTER DATA CONSOLIDATION (v2.5.2)
   Employees are master data — one record per real person. Smart Import
   builds ONE canonical employee index across the whole workbook and all
   existing TAM data, then reuses the same employeeId across every month.
   ============================================================ */

// Part 2 — shared employee-name normalization. Trims, collapses spaces,
// removes line breaks, normalizes apostrophes/hyphens and trailing harmless
// punctuation, case-insensitive. The original display name is preserved
// separately by the caller. Genuinely different names are never merged.
function normalizeEmployeeName(name){
  return String(name==null?'':name)
    .replace(/[\r\n\t]+/g,' ')                 // remove accidental line breaks
    .replace(/[‘’ʼ`´']/g,"'")  // normalize apostrophes
    .replace(/[‐-―−\-]+/g,'-')  // normalize hyphens/dashes
    .replace(/\s+/g,' ')                        // collapse repeated spaces
    .trim()
    .replace(/[.,;:]+$/,'')                     // trailing harmless punctuation
    .trim()
    .toLowerCase();
}

// Part 6 helpers — how many linked records reference an employee, contact/bank
// completeness, and the employee sequence number (from the EMP-xxx code).
function employeeLinkCount(id){
  return State.contracts.filter(c=>c.employeeId===id).length
    + State.payrollPlans.filter(p=>p.employeeId===id).length
    + State.txns.filter(t=>t.employeeId===id).length
    + State.overtimeRecords.filter(o=>o.employeeId===id).length
    + State.payrollAdjustments.filter(a=>a.employeeId===id).length;
}
function employeeCompleteness(e){
  let s=0; ['bankAccount','email','phone','department','jobTitle','joinDate','monthlyBaseSalary'].forEach(f=>{ if(e[f]!=null && String(e[f]).trim()!=='') s++; }); return s;
}
function employeeSeqNum(e){ const m=/(\d+)/.exec(e&&e.employeeId||''); return m?+m[1]:Infinity; }
// Canonical-record priority: most linked records → most complete profile → oldest createdAt → lowest sequence.
function pickCanonicalEmployee(list){
  return list.slice().sort((a,b)=>{
    const lc=employeeLinkCount(b.id)-employeeLinkCount(a.id); if(lc) return lc;
    const cc=employeeCompleteness(b)-employeeCompleteness(a); if(cc) return cc;
    const ta=Date.parse(a.createdAt||'')||Infinity, tb=Date.parse(b.createdAt||'')||Infinity; if(ta!==tb) return ta-tb;
    return employeeSeqNum(a)-employeeSeqNum(b);
  })[0];
}

// Part 3 — resolve one workbook candidate to an existing employee using the
// matching priority: (2) existing contract already linked to a person, then
// (3) exact normalized full name. Bank/email/salary are supporting evidence
// only — never merge on fuzzy similarity or on salary alone.
function resolveEmployeeCandidate(cand){
  for(const cn of cand.contractNumbers){
    const ct = State.contracts.find(c=>c.contractNumber && normStr(c.contractNumber)===normStr(cn) && c.employeeId);
    if(ct){ const e=State.employees.find(x=>x.id===ct.employeeId); if(e) return {matchedEmployee:e, matchedEmployeeId:e.id, status:'Exact Existing Match', confidence:0.98, via:'contract'}; }
  }
  const byName = State.employees.filter(e=>normalizeEmployeeName(e.fullName)===cand.key);
  if(byName.length===1) return {matchedEmployee:byName[0], matchedEmployeeId:byName[0].id, status:'Exact Existing Match', confidence:1, via:'name'};
  if(byName.length>1){
    const canon = pickCanonicalEmployee(byName);
    return {matchedEmployee:canon, matchedEmployeeId:canon.id, status:'Possible Duplicate', confidence:0.9, via:'name-dup', possibleDuplicate:true, dupGroupIds:byName.map(e=>e.id)};
  }
  return {matchedEmployee:null, matchedEmployeeId:null, status:'New Employee', confidence: cand.sourceNames.size>1?0.85:0.95, via:'new'};
}

// Parts 1 & 4 — scan ALL workbook rows first and group into unique employee
// candidates (one per normalized name). Every monthly row for the same person
// references the same candidate. Sets row._candidateKey. Returns a Map.
function buildEmployeeCandidates(rows){
  const map = new Map();
  (rows||[]).forEach(row=>{
    const key = normalizeEmployeeName(row.employeeName);
    if(!key){ row._candidateKey=null; return; }
    let cand = map.get(key);
    if(!cand){
      cand = {key, canonicalName:(row.employeeName||'').trim(), sourceNames:new Set(), workbookMonths:new Set(),
        contractNumbers:new Set(), salariesObserved:new Set(), bankAccountsObserved:new Set(), emailsObserved:new Set(), sourceRowIds:[]};
      map.set(key, cand);
    }
    if(row.employeeName) cand.sourceNames.add(String(row.employeeName).trim());
    if(row.monthKey) cand.workbookMonths.add(row.monthKey);
    if(row.contractNumber) cand.contractNumbers.add(row.contractNumber);
    if(row.salary) cand.salariesObserved.add(row.salary);
    if(row.bankAccount) cand.bankAccountsObserved.add(String(row.bankAccount));
    if(row.email) cand.emailsObserved.add(String(row.email).toLowerCase());
    cand.sourceRowIds.push(row.importRowId);
    row._candidateKey = key;
  });
  map.forEach(cand=>{ Object.assign(cand, resolveEmployeeCandidate(cand)); });
  return map;
}

// Map a resolved candidate to the empMatch shape the rest of Smart Import expects.
function candidateEmpMatch(cand){
  if(!cand) return {status:'No Match', employee:null, confidence:0, candidateStatus:null};
  if(cand.status==='Exact Existing Match') return {status:'Exact', employee:cand.matchedEmployee, confidence:cand.confidence, candidateStatus:cand.status};
  if(cand.status==='Possible Duplicate')  return {status:'Needs Review', employee:cand.matchedEmployee, confidence:cand.confidence, candidateStatus:cand.status, possibleDuplicate:true};
  return {status:'No Match', employee:null, confidence:cand.confidence, candidateStatus:cand.status};
}

/* ---------- model (Part 7) ---------- */
function buildSmartImport(rawBatches, fileName){
  const rows = smartExtractRows(rawBatches);
  const months = [...new Set(rows.map(r=>r.monthKey))];
  const candidates = buildEmployeeCandidates(rows);   // workbook-wide grouping (Parts 1,4); sets row._candidateKey
  const items = rows.map(row=>{
    const cand = row._candidateKey ? candidates.get(row._candidateKey) : null;
    const empMatch = candidateEmpMatch(cand);
    const ctMatch = smartMatchContract(row, empMatch);
    const reviewRequired = empMatch.status==='Needs Review' || ctMatch.status==='Conflict' || ctMatch.missingInfo || !row.employeeName || !!(cand&&cand.possibleDuplicate);
    const actions = {
      createEmployee: !!(cand && !cand.matchedEmployeeId) && !!row.employeeName,  // resolved once per candidate at commit
      linkEmployee: !!(cand && cand.matchedEmployeeId),
      createContract: ctMatch.status==='New',
      updateContract: false,          // never auto-update
      generatePayroll: true,
      createTransaction: true,
      skip: false,
    };
    const proposed = {
      contractNumber: row.contractNumber || null,
      start: ctMatch.inferredStart, duration: row.progressTotal || Number(State.settings.defaultContractDuration)||12,
      salary: row.salary,
    };
    return {row, candidateKey: row._candidateKey, empMatch, ctMatch, actions, reviewRequired, proposed, selected: !reviewRequired};
  });
  // Record workbook-wide unique-employee count for diagnostics.
  State.lastSmartImportUnique = {ts:new Date().toISOString(), fileName, rows:rows.length, uniqueEmployees:candidates.size,
    newEmployees:[...candidates.values()].filter(c=>!c.matchedEmployeeId).length,
    matchedEmployees:[...candidates.values()].filter(c=>c.matchedEmployeeId).length};
  return {fileName, createdAt:new Date().toISOString(), batchId:uid('imp'), rows, items, months, candidates,
    mapping: LAST_COLUMN_MAPPING ? Object.assign({}, LAST_COLUMN_MAPPING) : null,
    source: (rawBatches[0] && rawBatches[0].source) || (LAST_COLUMN_MAPPING && LAST_COLUMN_MAPPING.source) || 'unknown'};
}

// v2.5.1 — rebuild the whole Smart Import model from a manually overridden generic column map.
function rebuildSmartImportFromOverride(model, overrideColMap){
  const map = model.mapping;
  if(!map || map.source!=='generic' || !map.rows) return model;
  const items = buildGenericItems(map.rows, map.headerIdx, overrideColMap);
  const batches = groupGenericBatches(items);
  // refresh mapping report so recognized/unrecognized reflect the override
  parseGenericTable(map.rows); // recomputes LAST_COLUMN_MAPPING base
  if(LAST_COLUMN_MAPPING){ LAST_COLUMN_MAPPING.colMap = Object.assign({}, overrideColMap); LAST_COLUMN_MAPPING.rows = map.rows; LAST_COLUMN_MAPPING.sheetName = map.sheetName; }
  const fresh = buildSmartImport(batches, model.fileName);
  return fresh;
}
function smartCounts(model){
  const c={months:model.months.length, rows:model.items.length, employees:0, matchedEmp:0, newEmp:0, contracts:0, matchedCt:0, newCt:0, conflicts:0, reviewRequired:0, ready:0, skipped:0, payroll:0, txns:0, duplicates:0,
    uniqueEmployees:0, existingMatched:0, newEmployees:0, possibleDuplicates:0};
  // v2.5.2 — employee counts are workbook-wide UNIQUE candidates, not per-row.
  const cands = model.candidates ? [...model.candidates.values()] : [];
  c.uniqueEmployees = cands.length;
  c.existingMatched = cands.filter(x=>x.matchedEmployeeId && !x.possibleDuplicate).length;
  c.newEmployees   = cands.filter(x=>!x.matchedEmployeeId).length;
  c.possibleDuplicates = cands.filter(x=>x.possibleDuplicate).length;
  c.matchedEmp = c.existingMatched; c.newEmp = c.newEmployees; c.employees = c.uniqueEmployees;
  // Unique contracts = distinct (candidate + contract number), plus one AUTO contract per candidate that has missing-info rows.
  const ctKeys = new Set(), matchedCtIds = new Set(), autoEmp = new Set();
  model.items.forEach(i=>{
    if(i.ctMatch.status==='Conflict') c.conflicts++;
    if(i.reviewRequired) c.reviewRequired++;
    if(i.actions.skip) c.skipped++;
    else if(!i.reviewRequired) c.ready++;
    if(i.actions.generatePayroll) c.payroll++;
    if(i.actions.createTransaction) c.txns++;
    if(i.ctMatch.contract){ matchedCtIds.add(i.ctMatch.contract.id); }
    else if(i.row.contractNumber){ ctKeys.add((i.candidateKey||'?')+'|'+normStr(i.row.contractNumber)); }
    else if(i.candidateKey){ autoEmp.add(i.candidateKey); }
    // duplicate payroll (employee+contract+month already exists)
    const emp=i.empMatch.employee; const ct=i.ctMatch.contract;
    if(emp && State.payrollPlans.some(p=>p.monthKey===i.row.monthKey && p.employeeId===emp.id && (ct?p.contractId===ct.id:true))) c.duplicates++;
  });
  c.newCt = ctKeys.size + autoEmp.size;
  c.matchedCt = matchedCtIds.size;
  c.contracts = c.newCt + c.matchedCt;
  return c;
}

/* ---------- commit (Parts 9, 10, 11) ---------- */
async function commitSmartImport(model){
  const now = new Date().toISOString(), batchId = model.batchId;
  // Part 11 — automatic safety backup + audit before commit.
  State.backups.unshift({id:uid('backup'), monthKey:'__all__', monthLabel:'Pre-Smart-Import backup ('+model.fileName+')', timestamp:now, txns:JSON.parse(JSON.stringify(State.txns)), migration:true});
  await saveBackups();
  const created = {employees:[], contracts:[], payrollPlans:[], txns:[], monthlyPlanTxns:[]};
  let skipped=0, dupSkipped=0, contractConflicts=0;
  // Part 9 — ONE shared employee-resolution map for the whole commit, plus a
  // per-employee contract map so the same contract number is never duplicated
  // across months. Employees are never created independently per monthly row.
  const empMap = new Map();       // candidateKey -> employeeId
  const ctMap  = new Map();       // employeeId + '|' + contractKey -> contractId
  const candidateMap = {};        // candidateKey -> employeeId (persisted for re-import stability)

  // Phase A — resolve or create each unique employee candidate exactly once.
  const selByCand = new Map();
  model.items.forEach(i=>{ if(!i.selected || i.actions.skip || !i.candidateKey) return; if(!selByCand.has(i.candidateKey)) selByCand.set(i.candidateKey, []); selByCand.get(i.candidateKey).push(i); });
  selByCand.forEach((items, key)=>{
    const cand = model.candidates.get(key);
    const existingId = cand && cand.matchedEmployeeId;
    if(existingId && State.employees.some(e=>e.id===existingId)){ empMap.set(key, existingId); candidateMap[key]=existingId; return; }
    const first = items[0].row;
    const emp = {id:uid('emp'), employeeId:nextEmployeeCode(), fullName:(cand&&cand.canonicalName)||first.employeeName, employmentStatus:'Active', active:true,
      monthlyBaseSalary: first.salary||null,
      bankAccount: (items.map(x=>x.row.bankAccount).find(Boolean))||null,
      email: (items.map(x=>x.row.email).find(Boolean))||null,
      source:'Smart Import', importBatchId:batchId, candidateKey:key, createdAt:now, updatedAt:now,
      history:[{event:'created', ts:now, note:'Created by Smart Import from '+model.fileName+' — canonical across '+((cand&&cand.workbookMonths.size)||1)+' month(s)'}]};
    State.employees.push(emp); created.employees.push(emp.id); empMap.set(key, emp.id); candidateMap[key]=emp.id;
  });

  // Phase B — contracts (deduped per employee + contract number), payroll, transactions.
  for(const item of model.items){
    if(!item.selected || item.actions.skip){ skipped++; continue; }
    const row = item.row;
    const empId = item.candidateKey ? empMap.get(item.candidateKey) : null;
    const emp = empId ? State.employees.find(e=>e.id===empId) : null;
    if(!emp){ skipped++; continue; }
    let ct = item.ctMatch.contract || null;   // existing matched contract (reused)
    if(!ct){
      const cnKey = row.contractNumber ? normStr(row.contractNumber) : 'AUTO';
      const mapKey = emp.id+'|'+cnKey;
      if(ctMap.has(mapKey)){ ct = State.contracts.find(c=>c.id===ctMap.get(mapKey)) || null; } // reuse within this commit
      // v2.5.2 — re-import safety for missing-info rows: reuse this employee's existing AUTO
      // contract instead of creating a duplicate one (AUTO contracts have no number to match).
      if(!ct && !row.contractNumber){
        const existingAuto = State.contracts.find(c=>c.employeeId===emp.id && (/^AUTO-/.test(c.contractNumber||'') || (c.importEvidence && c.importEvidence.startInferred)));
        if(existingAuto){ ct = existingAuto; ctMap.set(mapKey, ct.id); }
      }
      if(!ct && row.contractNumber){
        // Part 5 — same contract number on a DIFFERENT employee = critical conflict; never link across people.
        const clash = State.contracts.find(c=>c.contractNumber && normStr(c.contractNumber)===cnKey && c.employeeId && c.employeeId!==emp.id);
        if(clash) contractConflicts++;
      }
      if(!ct && item.actions.createContract){
        const start = item.proposed.start || (row.monthKey+'-01');
        ct = {id:uid('ct'), employeeId:emp.id, employeeName:emp.fullName,
          contractNumber: row.contractNumber || ('AUTO-'+emp.employeeId),
          startDate:start, durationMonths:item.proposed.duration, monthlySalary:item.proposed.salary||row.salary||null,
          status:'Active', source:'Smart Import', importBatchId:batchId,
          importEvidence:{progress: row.progressCurrent!=null?(row.progressCurrent+'/'+row.progressTotal):null, fromMonth:row.monthKey, contractNumberRaw:row.contractNumber, startInferred:!row.contractNumber},
          createdAt:now, updatedAt:now,
          history:[{event:'created', ts:now, note:'Created by Smart Import — start '+(row.contractNumber?'from contract evidence':'inferred from payroll month + progress')}]};
        State.contracts.push(ct); created.contracts.push(ct.id); ctMap.set(mapKey, ct.id);
      }
    }
    if(item.actions.generatePayroll){
      const dup = State.payrollPlans.find(p=>p.monthKey===row.monthKey && p.employeeId===emp.id && (ct? p.contractId===ct.id : true));
      if(dup){ dupSkipped++; continue; } // Prevent duplicates: Employee + Contract + Month
      const mo = keyToMonthObj(row.monthKey);
      const plannedAmt = (row.planned||row.salary||0) + num(row.overtime) + num(row.allowance) - num(row.deduction);
      // v2.5.1 — progress snapshot derives from the structured contract when available
      // (calculated from start + duration + month); raw N/M is only a fallback label.
      const progress = ct ? contractCalc(ct,row.monthKey).progress : (row.progressCurrent!=null ? (Math.round(row.progressCurrent)+'/'+(row.progressTotal||'')) : null);
      const pp = {id:uid('pp'), monthKey:row.monthKey, month:mo.month, year:mo.year, monthNum:mo.monthNum,
        employeeId:emp.id, employeeName:emp.fullName, contractId:ct?ct.id:null, contractNumber:ct?ct.contractNumber:row.contractNumber, contractProgress:progress,
        baseSalary:row.salary||0, overtime:num(row.overtime), allowance:num(row.allowance), deduction:num(row.deduction), bonus:0, benefits:0, otherAdjustment:0, overtimeIds:[],
        plannedAmount:plannedAmt, actual:(row.actual!=null?row.actual:null), notes:'Imported', status:'Committed',
        source:'Smart Import', importBatchId:batchId, importRowId:row.importRowId, createdAt:now, updatedAt:now};
      State.payrollPlans.push(pp); created.payrollPlans.push(pp.id);
      if(item.actions.createTransaction){
        const mplan = ensureMonthlyPlan(row.monthKey);
        const uraian = `${emp.fullName}${ct?' · '+ct.contractNumber:''}${progress?' · '+progress:''}`;
        const txn = {id:uid('pay'), monthKey:row.monthKey, month:mo.month, year:mo.year, monthNum:mo.monthNum,
          category:State.settings.defaultPayrollCategory||'Gaji', categoryCode:'A', no:null, uraian, vol:1, satuan:'bulan', hargaSatuan:plannedAmt,
          planned:plannedAmt, actual:(row.actual!=null?row.actual:null), type:'expense', txnDate:null, source:'payroll', unplanned:false,
          scheduledDate:null, paymentMethod:null, bankAccount:null, referenceNumber:null, notes:'Smart Import', vendor:null,
          execution:null, status:'planned', employeeId:emp.id, contractId:ct?ct.id:null, payrollPlanId:pp.id, overtimeIds:[],
          monthlyPlanId:mplan.id, importBatchId:batchId, importRowId:row.importRowId,
          payrollMeta:{employeeName:emp.fullName, contractNumber:ct?ct.contractNumber:row.contractNumber, contractProgress:progress},
          history:[{event:'created', ts:now, note:'Created by Smart Import'}]};
        if(txn.actual!=null){ txn.status = computeStatus(txn); if(txn.actual>0){ txn.execution={executionDate:null, actualAmount:txn.actual, method:null, bank:null, reference:null, notes:'Imported as realized', executedBy:'—', executionId:uid('exec'), ts:now}; txn.history.push({event:'executed', ts:now, note:'Imported realized amount '+fmtIDR(txn.actual), amount:txn.actual}); } }
        State.txns.push(txn); pp.committedTxnId=txn.id; created.txns.push(txn.id);
        if(!mplan.committedTxnIds.includes(txn.id)){ mplan.committedTxnIds.push(txn.id); created.monthlyPlanTxns.push(txn.id); }
        mplan.status='Committed';
      }
    }
  }
  const audit = {batchId, fileName:model.fileName, ts:now, mode:'smart', created, candidateMap,
    uniqueEmployees: Object.keys(candidateMap).length,
    counts:{employees:created.employees.length, contracts:created.contracts.length, payrollPlans:created.payrollPlans.length, txns:created.txns.length, skipped, duplicatesSkipped:dupSkipped, contractConflicts, uniqueEmployees:Object.keys(candidateMap).length}, undone:false};
  State.importBatches.unshift(audit);
  await saveAllData();
  return audit;
}

/* ---------- undo (Part 11) ---------- */
function smartRollbackPreview(batch){
  const c = batch.created;
  const removableTxns = c.txns.filter(id=>{ const t=findTxn(id); return t && t.actual==null && statusOf(t)==='planned' && (!t.history || t.history.length<=1); });
  return {removableTxns, blockedTxns: c.txns.length - removableTxns.length, employees:c.employees.length, contracts:c.contracts.length, payrollPlans:c.payrollPlans.length};
}
async function undoLastSmartImport(){
  const batch = State.importBatches.find(b=>!b.undone);
  if(!batch){ showWarning('No Smart Import batch available to undo.'); return; }
  const pv = smartRollbackPreview(batch);
  if(!confirmAction(`Undo Smart Import "${batch.fileName}"?\n\nWill remove: ${pv.employees} employee(s), ${pv.contracts} contract(s), ${pv.payrollPlans} payroll plan(s), ${pv.removableTxns.length} planned transaction(s).\n${pv.blockedTxns?('\n'+pv.blockedTxns+' executed or modified transaction(s) will be KEPT (rollback never removes them).'):''}`)) return;
  const c = batch.created;
  const removeTxn = new Set(pv.removableTxns);
  State.txns = State.txns.filter(t=>!removeTxn.has(t.id));
  // Drop created payroll plans unless their transaction survived (executed/kept).
  State.payrollPlans = State.payrollPlans.filter(p=>!c.payrollPlans.includes(p.id) || (p.committedTxnId && !removeTxn.has(p.committedTxnId)));
  const refEmp = new Set([].concat(State.txns.map(t=>t.employeeId), State.payrollPlans.map(p=>p.employeeId)).filter(Boolean));
  const refCt = new Set([].concat(State.txns.map(t=>t.contractId), State.payrollPlans.map(p=>p.contractId)).filter(Boolean));
  State.contracts = State.contracts.filter(ct=>!c.contracts.includes(ct.id) || refCt.has(ct.id));
  State.employees = State.employees.filter(e=>!c.employees.includes(e.id) || refEmp.has(e.id));
  // Clean removed txn ids out of monthly plans.
  State.monthlyPlans.forEach(mp=>{ if(Array.isArray(mp.committedTxnIds)) mp.committedTxnIds = mp.committedTxnIds.filter(id=>!removeTxn.has(id)); });
  batch.undone = true; batch.undoneAt = new Date().toISOString(); batch.keptTxns = pv.blockedTxns;
  await saveAllData();
  showSuccess(`Smart Import undone.${pv.blockedTxns?(' '+pv.blockedTxns+' executed/modified record(s) preserved.'):''}`, 6000);
  render();
}

/* ============================================================
   EMPLOYEE DUPLICATE REVIEW & MERGE (Parts 6, 7, 11, 12)
   Detect-only; never merges without explicit user confirmation.
   ============================================================ */
const MERGE_PROFILE_FIELDS = ['bankAccount','email','phone','jobTitle','department','joinDate','monthlyBaseSalary','employmentStatus'];

// Groups of existing employees that share a normalized name (Part 6 detection).
function findEmployeeDuplicateGroups(){
  const byKey = new Map();
  State.employees.forEach(e=>{ const k=normalizeEmployeeName(e.fullName); if(!k) return; if(!byKey.has(k)) byKey.set(k,[]); byKey.get(k).push(e); });
  const groups=[];
  byKey.forEach((emps,key)=>{ if(emps.length>1) groups.push({key, name:emps[0].fullName, employees:emps, canonical:pickCanonicalEmployee(emps)}); });
  return groups;
}
// All records linked to an employee id.
function employeeLinkedRecords(id){
  return {
    contracts: State.contracts.filter(c=>c.employeeId===id),
    payrollPlans: State.payrollPlans.filter(p=>p.employeeId===id),
    txns: State.txns.filter(t=>t.employeeId===id),
    overtime: State.overtimeRecords.filter(o=>o.employeeId===id),
    adjustments: State.payrollAdjustments.filter(a=>a.employeeId===id),
  };
}
function employeeLinkTotals(id){ const r=employeeLinkedRecords(id); return {contracts:r.contracts.length, payrollPlans:r.payrollPlans.length, txns:r.txns.length, overtime:r.overtime.length, adjustments:r.adjustments.length}; }

// Part 7 — merge duplicates into one canonical employee. Backup first; relink
// every record; never delete contracts/payroll/txns/overtime or change amounts;
// apply only chosen profile values; write an audit record.
async function mergeEmployeeGroup(canonicalId, duplicateIds, profileChoices){
  const now = new Date().toISOString();
  const canon = State.employees.find(e=>e.id===canonicalId);
  if(!canon || !duplicateIds.length) return null;
  const dupSet = new Set(duplicateIds.filter(id=>id!==canonicalId));
  if(!dupSet.size) return null;
  // Complete safety backup (full master-data snapshot + transactions).
  State.backups.unshift({id:uid('backup'), monthKey:'__all__', monthLabel:'Pre-employee-merge backup ('+canon.fullName+')', timestamp:now, migration:true,
    txns: JSON.parse(JSON.stringify(State.txns)),
    masterSnapshot: JSON.parse(JSON.stringify({employees:State.employees, contracts:State.contracts, payrollPlans:State.payrollPlans, overtimeRecords:State.overtimeRecords, payrollAdjustments:State.payrollAdjustments}))});
  await saveBackups();
  const relinked = {contracts:[], payrollPlans:[], txns:[], overtime:[], adjustments:[]};
  State.contracts.forEach(c=>{ if(dupSet.has(c.employeeId)){ c.employeeId=canonicalId; c.employeeName=canon.fullName; c.updatedAt=now; relinked.contracts.push(c.id);} });
  State.payrollPlans.forEach(p=>{ if(dupSet.has(p.employeeId)){ p.employeeId=canonicalId; p.employeeName=canon.fullName; p.updatedAt=now; relinked.payrollPlans.push(p.id);} });
  State.txns.forEach(t=>{ if(dupSet.has(t.employeeId)){ t.employeeId=canonicalId; if(t.payrollMeta) t.payrollMeta.employeeName=canon.fullName; relinked.txns.push(t.id);} });
  State.overtimeRecords.forEach(o=>{ if(dupSet.has(o.employeeId)){ o.employeeId=canonicalId; if(o.employeeName!==undefined) o.employeeName=canon.fullName; o.updatedAt=now; relinked.overtime.push(o.id);} });
  State.payrollAdjustments.forEach(a=>{ if(dupSet.has(a.employeeId)){ a.employeeId=canonicalId; a.updatedAt=now; relinked.adjustments.push(a.id);} });
  // Apply chosen profile values (user-selected; empties fall back to canonical's own value — never silent overwrite of non-empty).
  const appliedProfile={};
  MERGE_PROFILE_FIELDS.forEach(f=>{ if(profileChoices && profileChoices[f]!=null && profileChoices[f]!=='' ){ if(canon[f]!==profileChoices[f]){ canon[f]=profileChoices[f]; appliedProfile[f]=profileChoices[f]; } } });
  canon.updatedAt=now; canon.history=canon.history||[];
  canon.history.push({event:'merged', ts:now, note:`Merged ${dupSet.size} duplicate record(s) into this canonical employee`});
  // Remove the now-empty duplicate employee master records (their links were repointed).
  const removedCodes = State.employees.filter(e=>dupSet.has(e.id)).map(e=>e.employeeId||e.id);
  State.employees = State.employees.filter(e=>!dupSet.has(e.id));
  const auditRec = {id:uid('merge'), ts:now, canonicalEmployeeId:canonicalId, canonicalCode:canon.employeeId, canonicalName:canon.fullName,
    duplicateEmployeeIds:[...dupSet], duplicateCodes:removedCodes, relinked,

  return `<span class="pill ${map[status]||'pill-other'}">${escapeHtml(status)}</span>`;

}
