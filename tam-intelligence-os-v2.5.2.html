<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAM Intelligence OS v2.5.2</title>
<meta name="theme-color" content="#0E1420">
<meta name="color-scheme" content="dark light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root, :root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0E1420;
  --surface:#161D2C;
  --surface-2:#1D2740;
  --surface-3:#242F4C;
  --border:#2A3550;
  --border-soft:#1F2942;
  --text:#E8EAF0;
  --text-dim:#96A1BA;
  --text-faint:#5E6A87;
  --accent:#C9A15C;
  --accent-soft:rgba(201,161,92,0.14);
  --blue:#6FA3D8;
  --blue-soft:rgba(111,163,216,0.14);
  --brick:#C1543F;
  --brick-soft:rgba(193,84,63,0.14);
  --green:#4FAE7C;
  --green-soft:rgba(79,174,124,0.14);
  /* semantic chart tokens (theme-aware; charts read these live) */
  --chart-grid:#26314c;
  --chart-axis:#8592AD;
  --chart-tip-bg:#1D2740;
  --chart-tip-border:#2A3550;
  --chart-hollow:#161D2C;
  --serif:'Source Serif 4', Georgia, serif;
  --sans:'Inter', -apple-system, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, monospace;
}
/* Professional light theme (Part 15): off-white bg, white cards, navy text,
   gold accent — no pure-white glare, WCAG-readable contrast. */
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#F3F5F8;
  --surface:#FFFFFF;
  --surface-2:#EDF1F6;
  --surface-3:#E1E7F0;
  --border:#CDD5E1;
  --border-soft:#E3E8F0;
  --text:#1B2740;
  --text-dim:#4E5D78;
  --text-faint:#7A879E;
  --accent:#9C6B1E;
  --accent-soft:rgba(156,107,30,0.13);
  --blue:#2E6CB0;
  --blue-soft:rgba(46,108,176,0.12);
  --brick:#B0402A;
  --brick-soft:rgba(176,64,42,0.11);
  --green:#2C8358;
  --green-soft:rgba(44,131,88,0.12);
  --chart-grid:#D2DAE6;
  --chart-axis:#5A6884;
  --chart-tip-bg:#1B2740;
  --chart-tip-border:#33405C;
  --chart-hollow:#FFFFFF;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;transition:background .2s,color .2s;}
/* Light-theme readability overrides for status pills / badges / toast so text
   keeps WCAG-readable contrast on white cards (Part 15). */
:root[data-theme="light"] .pill-gaji, :root[data-theme="light"] .pill-status-planned{background:rgba(156,107,30,0.14);color:#7A5214;}
:root[data-theme="light"] .pill-rutin, :root[data-theme="light"] .pill-status-scheduled{background:rgba(46,108,176,0.13);color:#1F5290;}
:root[data-theme="light"] .pill-kegiatan, :root[data-theme="light"] .pill-status-cancelled{background:rgba(176,64,42,0.13);color:#8F2E1B;}
:root[data-theme="light"] .pill-income, :root[data-theme="light"] .pill-status-completed{background:rgba(44,131,88,0.14);color:#1E6340;}
:root[data-theme="light"] .pill-status-partial{background:rgba(196,120,40,0.16);color:#8A5410;}
:root[data-theme="light"] .pill-other, :root[data-theme="light"] .pill-status-archived, :root[data-theme="light"] .pill-onbudget{background:#E1E7F0;color:#4E5D78;}
:root[data-theme="light"] .toast{background:#1B2740;color:#F3F5F8;border-color:#33405C;}
::selection{background:var(--accent-soft);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px;}
::-webkit-scrollbar-track{background:transparent;}

a{color:inherit;}
button{font-family:var(--sans);cursor:pointer;}
input,select,textarea{font-family:var(--sans);}

/* ===== Shell ===== */
#app{display:flex;min-height:100vh;}

.sidebar{
  width:258px;flex:none;background:var(--surface);border-right:1px solid var(--border-soft);
  display:flex;flex-direction:column;padding:20px 0;position:sticky;top:0;height:100vh;
}
.brand{padding:0 20px 18px 20px;border-bottom:1px solid var(--border-soft);margin-bottom:14px;}
.brand .mark{font-family:var(--serif);font-weight:700;font-size:19px;letter-spacing:0.1px;color:var(--text);white-space:nowrap;line-height:1.2;}
.brand .mark span{color:var(--accent);}
.brand .mark .mshort{display:none;}
.brand .sub{font-size:10.5px;color:var(--text-faint);margin-top:5px;letter-spacing:0.5px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
@media(max-width:640px){
  .sidebar{width:170px;}
  .brand .mark .mfull{display:none;}
  .brand .mark .mshort{display:inline;}
}

.nav{display:flex;flex-direction:column;gap:10px;padding:0 10px;overflow-y:auto;}
.nav-group{display:flex;flex-direction:column;gap:2px;}
.nav-group-head{
  display:flex;align-items:center;justify-content:space-between;background:transparent;border:none;
  color:var(--text-faint);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;
  padding:6px 10px;cursor:pointer;
}
.nav-group-head:hover{color:var(--text-dim);}
.nav-group-head .chev{font-size:9px;}
.nav-group-items{display:flex;flex-direction:column;gap:2px;}
.nav-preview-tag{
  margin-left:auto;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;
  background:var(--surface-3);color:var(--text-faint);padding:1px 6px;border-radius:8px;
}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:var(--text-dim);
  font-size:13.5px;font-weight:500;border:none;background:transparent;text-align:left;width:100%;
  transition:background .12s, color .12s;
}
.nav-item:hover{background:var(--surface-2);color:var(--text);}
.nav-item.active{background:var(--accent-soft);color:var(--accent);}
.nav-item .ic{width:16px;text-align:center;font-size:14px;}

.sidebar-foot{margin-top:auto;padding:14px 20px 0 20px;border-top:1px solid var(--border-soft);font-size:11px;color:var(--text-faint);line-height:1.6;}

.main{flex:1;min-width:0;padding:28px 36px 60px 36px;max-width:1320px;}

.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
.page-head h1{font-family:var(--serif);font-weight:600;font-size:26px;margin:0 0 4px 0;}
.page-head .desc{color:var(--text-dim);font-size:13px;margin:0;}
.head-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}

select, .input{
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:8px;
  padding:8px 12px;font-size:13px;outline:none;
}
select:focus, .input:focus{border-color:var(--accent);}

.btn{
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:8px;
  padding:8px 14px;font-size:13px;font-weight:500;transition:border-color .12s, background .12s;
}
.btn:hover{border-color:var(--text-faint);}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#1A1406;font-weight:600;}
.btn-accent:hover{background:#D9B06F;border-color:#D9B06F;}
.btn-danger{color:var(--brick);}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}

/* ===== Cards / grid ===== */
.grid{display:grid;gap:14px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-2{grid-template-columns:1.3fr 1fr;}
.grid-3{grid-template-columns:repeat(3,1fr);}
@media(max-width:1050px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-2{grid-template-columns:1fr;} .grid-3{grid-template-columns:1fr;}}

.card{background:var(--surface);border:1px solid var(--border-soft);border-radius:12px;padding:18px 20px;}
.card h3{font-family:var(--serif);font-weight:600;font-size:14.5px;margin:0 0 14px 0;color:var(--text);}
.card h3 .tag{font-family:var(--sans);font-size:10.5px;color:var(--text-faint);font-weight:500;margin-left:8px;text-transform:uppercase;letter-spacing:.4px;}

.stat-card{padding:16px 18px;}
.stat-label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
.stat-value{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:-.3px;}
.stat-sub{font-size:12px;margin-top:6px;color:var(--text-dim);}
.stat-sub.pos{color:var(--green);}
.stat-sub.neg{color:var(--brick);}

/* ===== Tables ===== */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12.8px;}
th{
  text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-faint);
  padding:8px 10px;border-bottom:1px solid var(--border);font-weight:600;white-space:nowrap;position:sticky;top:0;background:var(--surface);
}
td{padding:9px 10px;border-bottom:1px solid var(--border-soft);color:var(--text);vertical-align:middle;}
tr:hover td{background:var(--surface-2);}
td.num, th.num{text-align:right;font-family:var(--mono);}
.mono{font-family:var(--mono);}
.dim{color:var(--text-dim);}
.faint{color:var(--text-faint);}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
.pill-gaji{background:var(--accent-soft);color:var(--accent);}
.pill-rutin{background:var(--blue-soft);color:var(--blue);}
.pill-kegiatan{background:var(--brick-soft);color:var(--brick);}
.pill-income{background:var(--green-soft);color:var(--green);}
.pill-other{background:var(--surface-3);color:var(--text-dim);}
.pill-over{background:var(--brick-soft);color:var(--brick);}
.pill-under{background:var(--green-soft);color:var(--green);}
.pill-onbudget{background:var(--surface-3);color:var(--text-dim);}
.pill-status-planned{background:rgba(201,161,92,0.16);color:#C9A15C;}
.pill-status-scheduled{background:rgba(111,163,216,0.16);color:#6FA3D8;}
.pill-status-partial{background:rgba(217,138,61,0.16);color:#D98A3D;}
.pill-status-completed{background:rgba(79,174,124,0.16);color:#4FAE7C;}
.pill-status-cancelled{background:rgba(193,84,63,0.16);color:#C1543F;}
.pill-status-archived{background:var(--surface-3);color:#96A1BA;}

.linklike{background:none;border:none;color:var(--text);font:inherit;cursor:pointer;padding:0;text-align:left;}
.linklike:hover{color:var(--accent);text-decoration:underline;}

.actions-menu{position:relative;display:inline-block;}
.actions-dropdown{position:absolute;right:0;top:calc(100% + 4px);background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:4px;z-index:20;min-width:170px;box-shadow:0 8px 28px rgba(0,0,0,.45);}
.actions-item{display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);font-size:12.5px;padding:7px 10px;border-radius:6px;cursor:pointer;}
.actions-item:hover{background:var(--surface-3);}
.actions-item.danger{color:var(--brick);}

.exec-timeline{display:flex;align-items:center;gap:0;margin:6px 0;}
.exec-stage{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;width:70px;text-align:center;}
.exec-connector{flex:1;height:2px;background:var(--border);margin-top:-16px;}
.exec-dot{width:14px;height:14px;border-radius:50%;background:var(--surface-3);border:2px solid var(--border);}
.exec-stage.reached .exec-dot{background:var(--accent);border-color:var(--accent);}
.exec-stage.cancelled .exec-dot{background:var(--brick);border-color:var(--brick);}
.exec-stage-label{font-size:10.5px;color:var(--text-dim);}
.exec-stage.reached .exec-stage-label{color:var(--text);}

.hist-list{display:flex;flex-direction:column;gap:6px;}
.hist-row{display:grid;grid-template-columns:90px 1fr auto;gap:10px;font-size:12px;align-items:baseline;}
.hist-event{font-weight:600;color:var(--accent);}
.hist-note{color:var(--text-dim);}
.hist-ts{font-size:10.5px;}
.pill-dup{background:var(--brick-soft);color:var(--brick);}

.bar-track{width:100%;height:6px;background:var(--surface-3);border-radius:4px;overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;}

/* ===== Forms ===== */
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:11.5px;color:var(--text-dim);font-weight:500;}
.field select, .field input{width:100%;}
.hint{font-size:11.5px;color:var(--text-faint);margin-top:4px;}

.dropzone{
  border:1.5px dashed var(--border);border-radius:12px;padding:34px 20px;text-align:center;
  color:var(--text-dim);font-size:13px;cursor:pointer;transition:border-color .12s,background .12s;
}
.dropzone:hover, .dropzone.drag{border-color:var(--accent);background:var(--accent-soft);}
.dropzone .big{font-size:26px;margin-bottom:8px;}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border-soft);margin-bottom:18px;}
.tab{padding:9px 14px;font-size:13px;color:var(--text-dim);border:none;background:transparent;border-bottom:2px solid transparent;font-weight:500;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}

.section-title{font-family:var(--serif);font-size:15px;font-weight:600;margin:22px 0 10px 0;}
.divider{height:1px;background:var(--border-soft);margin:18px 0;}

.insight-list{display:flex;flex-direction:column;gap:10px;}
.insight-item{display:flex;gap:10px;font-size:13px;line-height:1.5;padding:10px 12px;background:var(--surface-2);border-radius:8px;border-left:3px solid var(--accent);}
.insight-item.warn{border-left-color:var(--brick);}
.insight-item.good{border-left-color:var(--green);}

.badge-count{background:var(--brick);color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:1px 6px;margin-left:auto;}

.empty{padding:40px 20px;text-align:center;color:var(--text-faint);font-size:13px;}
.empty .big{font-size:28px;margin-bottom:10px;opacity:.6;}

.toast{
  position:fixed;bottom:24px;right:24px;background:var(--surface-3);border:1px solid var(--border);
  color:var(--text);padding:12px 18px;border-radius:10px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.4);
  z-index:999;max-width:340px;
}

.checkbox-row{display:flex;align-items:center;gap:8px;}

.modal-overlay{position:fixed;inset:0;background:rgba(6,9,16,.6);display:flex;align-items:center;justify-content:center;z-index:998;padding:20px;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;max-width:480px;width:100%;}
.modal h3{font-family:var(--serif);margin:0 0 10px 0;}
.modal p{color:var(--text-dim);font-size:13.5px;line-height:1.6;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;}

.kpi-chip{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-dim);}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:900px){.two-col{grid-template-columns:1fr;} .form-grid{grid-template-columns:1fr 1fr;}}

.upload-preview-cat{margin-bottom:16px;}
.upload-preview-cat h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-faint);margin:0 0 8px 0;}

.small-btn-row{display:flex;gap:6px;}

.chart-wrap{position:relative;min-height:320px;overflow:hidden;}
.chart-wrap.tall{min-height:380px;}
.chart-wrap.dense{min-height:420px;}
.chart-legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;padding-top:2px;}
.chart-legend button{font-family:var(--sans);}
.chart-mini-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px;}
.chart-mini-stat{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:8px;padding:10px 12px;}
.chart-mini-stat .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-faint);margin-bottom:4px;}
.chart-mini-stat .val{font-family:var(--mono);font-size:14px;font-weight:600;}
.chart-range-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}

.month-strip{display:flex;gap:6px;flex-wrap:wrap;}
.month-chip{padding:5px 10px;border-radius:7px;background:var(--surface-2);border:1px solid var(--border-soft);font-size:11.5px;color:var(--text-dim);cursor:pointer;}
.month-chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}

textarea.input{resize:vertical;min-height:70px;font-family:var(--mono);font-size:12px;}
</style>
</head>

<script>
/* Apply the saved appearance BEFORE first paint to avoid a theme flash (Part 15). */
(function(){
  try{
    var raw = localStorage.getItem('tam_settings_v1');
    var pref = 'system';
    if(raw){ var s = JSON.parse(raw); if(s && s.appearance) pref = s.appearance; }
    var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var eff = pref==='light' ? 'light' : pref==='dark' ? 'dark' : (sysDark ? 'dark' : 'light');
    document.documentElement.dataset.theme = eff;
  }catch(e){ document.documentElement.dataset.theme = 'dark'; }
})();
</script>

<script>
/* ============================================================
   TAM FINANCE OS — application logic
   ============================================================ */

/* ============================================================
   TAM INTELLIGENCE OS — single-file application script
   Section map (v2.2.1 Architecture Review & Stabilization):
     1.  Constants & app identity
     2.  Storage Adapter (single persistence gateway)
     3.  Utilities & centralized notifications
     4.  Chart engine (self-contained SVG)
     5.  State, settings, load & migrations
     6.  Data services & derived business logic
     7.  Parsers / Excel-CSV import
     8.  Navigation, shell & page renderers
     9.  Modal renderers
     10. People & Contracts engine (employees/contracts/payroll/plans)
     11. Reports, settings & dashboard integration
     12. v2.2.1 Stabilization layer: save coordinator, normalization
         migration, validators, integrity checker, a11y helpers
     13. Initialization
   Business calculations are centralized (one implementation each):
     statusOf/computeStatus, contractCalc, payrollAmount, monthTotals,
     execStats, recurringDueInMonth, coveringContract, empEligible.
   ============================================================ */

/* ---------- app identity ---------- */
const APP_NAME = 'TAM Intelligence OS';
const APP_VERSION = '2.5.2';
const APP_RELEASE_NAME = 'Employee Deduplication & Master Data Consolidation';
const APP_TAGLINE = 'Finance Execution Engine';
const FILE_BASE = 'tam-intelligence-os-v' + APP_VERSION; // versioned base for the file itself and every download
const APP_POSITIONING = 'Integrated Management Intelligence for PT Total Asset Manajemen';
const COMPANY_NAME_DEFAULT = 'PT Total Asset Manajemen';
const SCHEMA_VERSION = 6;

/* ---------- transaction lifecycle ---------- */
const STATUS = {
  PLANNED:'planned', SCHEDULED:'scheduled', PARTIAL:'partial',
  COMPLETED:'completed', CANCELLED:'cancelled', ARCHIVED:'archived',
};
const STATUS_META = {
  planned:   {label:'Planned',   color:'#C9A15C', dot:'🟡', pill:'pill-status-planned'},
  scheduled: {label:'Scheduled', color:'#6FA3D8', dot:'🔵', pill:'pill-status-scheduled'},
  partial:   {label:'Partial',   color:'#D98A3D', dot:'🟠', pill:'pill-status-partial'},
  completed: {label:'Completed', color:'#4FAE7C', dot:'🟢', pill:'pill-status-completed'},
  cancelled: {label:'Cancelled', color:'#C1543F', dot:'🔴', pill:'pill-status-cancelled'},
  archived:  {label:'Archived',  color:'#96A1BA', dot:'⚪', pill:'pill-status-archived'},
};
const PAYMENT_METHODS = ['Cash','Bank Transfer','QRIS','Virtual Account','Credit Card','Other'];
const BANK_ACCOUNTS = ['Mandiri Operational','Mandiri Payroll','BCA','BSI','Cash'];

/* ---------- People & Contracts lifecycle (v2.2.0) ---------- */
const EMPLOYMENT_STATUSES = ['Active','Inactive','On Leave','Resigned','Terminated'];
const EMP_STATUS_META = {
  'Active':     {pill:'pill-status-completed', eligible:true},
  'On Leave':   {pill:'pill-status-partial',   eligible:false},
  'Inactive':   {pill:'pill-status-archived',  eligible:false},
  'Resigned':   {pill:'pill-status-cancelled', eligible:false},
  'Terminated': {pill:'pill-status-cancelled', eligible:false},
};
const CONTRACT_TYPES = ['Permanent','Fixed-Term (PKWT)','Probation','Freelance','Internship'];
// Draft / Active / Cancelled / Renewed are stored states the user sets.
// Expiring Soon / Expired are derived from dates and never stored.
const CONTRACT_STORED_STATUSES = ['Draft','Active','Renewed','Cancelled'];
const CONTRACT_STATUS_META = {
  'Draft':         {pill:'pill-status-planned'},

// Derive the correct status from a transaction's amounts, unless it's been
// explicitly set to a terminal/manual state (cancelled, archived, scheduled).
function computeStatus(t){
  if(t.status==='cancelled') return 'cancelled';
  if(t.status==='archived') return 'archived';
  const a = t.actual;
  if(a===null || a===undefined){
    return t.status==='scheduled' ? 'scheduled' : 'planned';
  }
  if(a<=0) return t.status==='scheduled' ? 'scheduled' : 'planned';
  if(a < (t.planned||0)) return 'partial';

}

/* ---------- centralized user-facing notifications (v2.2.1) ----------
   Single funnel for success / warning / error messages and confirmations.
   Technical detail goes to console; users see a short readable message. No
   important error is silently swallowed. These wrap the existing toast/confirm
   so behaviour is unchanged — they standardize call sites going forward. */
function showSuccess(msg, ms){ toast(msg, ms||2600); }
function showWarning(msg, ms){ toast(msg, ms||5000); }
function showError(msg, err, ms){
  if(err) console.error('[TAM]', msg, err); else console.error('[TAM]', msg);
  toast(msg, ms||6000);
}
// Confirmation dialog wrapper. Kept synchronous (window.confirm) to preserve the
// exact blocking behaviour every current call site relies on.
function confirmAction(message){ return window.confirm(message); }
function levenshtein(a,b){
  a=a||''; b=b||'';
  const m=a.length, n=b.length;
  if(m===0) return n; if(n===0) return m;
  const dp = Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0]=i;
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
    }
  }
  return dp[m][n];
}
function similarText(a,b){
  a=normStr(a); b=normStr(b);
  if(!a || !b) return 0;
  if(a===b) return 1;
  const dist = levenshtein(a,b);
  return 1 - dist/Math.max(a.length,b.length);
}

/* ============================================================
   STORAGE ADAPTER (v2.1.1) — single persistence gateway.
   Priority: Claude Artifact storage (window.storage) when the
   host provides it; otherwise browser localStorage. The rest of
   the app must ONLY call StorageAdapter.get / .set / .remove —
   never window.storage or localStorage directly.
   get() returns {value: string} or null, matching the previous
   window.storage.get call-site shape.
   ============================================================ */
const StorageAdapter = {
  mode: (typeof window!=='undefined' && window.storage && typeof window.storage.get==='function' && typeof window.storage.set==='function') ? 'claude' : 'local',
  status: 'unknown', // 'active' | 'unavailable' | 'error' | 'unknown'
  lastError: null,
  modeLabel(){ return this.mode==='claude' ? 'Claude Artifact Storage' : 'Browser Local Storage'; },
  statusLabel(){ return this.status==='active' ? 'Active' : this.status==='unavailable' ? 'Unavailable' : this.status==='error' ? 'Error' : 'Unknown'; },
  _fail(e){
    this.status = 'error';
    this.lastError = e && (e.message || String(e));
    console.error('StorageAdapter error', e);
  },
  _isQuotaError(e){
    return !!e && (e.name==='QuotaExceededError' || e.name==='NS_ERROR_DOM_QUOTA_REACHED' || e.code===22 || e.code===1014);
  },
  _localGet(key){
    try{
      const v = window.localStorage.getItem(key);
      return v===null ? null : {value: v};
    }catch(e){ this._fail(e); return null; }
  },
  _localSet(key, value){
    try{
      window.localStorage.setItem(key, value);
      return true;
    }catch(e){
      this._fail(e);
      if(this._isQuotaError(e)){
        toast('Browser storage quota exceeded — data was NOT saved. Export a Complete Backup from Settings, then clear old data.', 8000);
      }else{
        toast('Could not save to browser storage — your changes may not persist.', 6000);
      }
      return false;
    }
  },
  async get(key){
    if(this.mode==='claude'){
      try{
        const res = await window.storage.get(key, false);
        if(res && res.value!==null && res.value!==undefined && res.value!=='') return res;
      }catch(e){ console.warn('Claude storage read failed for '+key+', trying localStorage fallback.', e); }
      // Claude storage has nothing for this key — fall back to any data a
      // standalone session left in localStorage (read-only migration path).
      return this._localGet(key);
    }
    return this._localGet(key);
  },
  async set(key, value){
    // Unified write path (v2.2.1): both storage modes flow through one place so
    // success/failure is surfaced consistently and the last-successful-save
    // timestamp used by System Diagnostics is recorded in exactly one spot.
    let ok;
    if(this.mode==='claude'){
      try{ await window.storage.set(key, value, false); ok = true; }
      catch(e){ this._fail(e); toast('Could not save to Claude storage — your changes may not persist.', 6000); ok = false; }
    } else {
      ok = this._localSet(key, value);
    }
    if(ok && typeof State!=='undefined' && State){ State.lastSaveAt = Date.now(); }
    return ok;
  },
  async remove(key){
    let ok = true;
    if(this.mode==='claude'){
      try{
        if(typeof window.storage.delete==='function'){ await window.storage.delete(key, false); }
        else { await window.storage.set(key, '', false); }
      }catch(e){ this._fail(e); ok = false; }
    }
    try{ window.localStorage.removeItem(key); }catch(e){ /* localStorage may be unavailable; claude removal above already handled */ }
    return ok;
  },
  // Round-trip probe: writes, reads back, and removes a throwaway key to
  // establish whether persistence actually works in this environment.
  async selfTest(){
    const probe = 'tam_storage_probe';
    try{
      const token = 'ok_' + Date.now();
      const wrote = await this.set(probe, token);
      const back = await this.get(probe);
      await this.remove(probe);
      if(wrote && back && back.value===token){ this.status = 'active'; }
      else if(this.status!=='error'){ this.status = 'unavailable'; }
    }catch(e){ this._fail(e); }
    return this.status;
  },
};

// Parse persisted JSON defensively. On corruption: notify the user, preserve
// the raw corrupt payload under a recovery key (never silently discarded),
// and return null so the caller can fall back to safe defaults.
function safeParse(raw, label){
  try{ return JSON.parse(raw); }
  catch(e){
    console.error('Corrupt stored JSON for "'+label+'"', e);
    try{ window.localStorage.setItem('tam_corrupt_'+label+'_'+Date.now(), raw); }catch(_e){}
    toast('Stored '+label+' data was corrupted and could not be read. Falling back to defaults — a copy of the corrupt data was preserved for recovery.', 8000);
    return null;
  }
}

/* ============================================================
   CHART LIBRARY — self-contained SVG charts, no external deps.
   Responsive: SVG fills its wrapper's exact box (width & height
   set from JS, not "auto"), so a fill/area can never render
   taller than its own card. Legend toggle state persists per
   container id for the current page view.
   ============================================================ */
const SVGNS = 'http://www.w3.org/2000/svg';
const chartLegendState = {}; // containerId -> Set of hidden series keys
function getHiddenSet(containerId){
  if(!chartLegendState[containerId]) chartLegendState[containerId] = new Set();
  return chartLegendState[containerId];
}
function chartTooltip(host){
  const tip = document.createElement('div');
  tip.className = 'chart-tip';
  const bg = themeVar('--chart-tip-bg','#1D2740'), bd = themeVar('--chart-tip-border','#2A3550');
  tip.style.cssText = `position:absolute;pointer-events:none;background:${bg};border:1px solid ${bd};border-radius:8px;padding:9px 12px;font-size:12px;line-height:1.65;color:#F3F5F8;box-shadow:0 8px 24px rgba(0,0,0,.45);z-index:6;opacity:0;transition:opacity .1s;white-space:nowrap;`;
  host.style.position = 'relative';
  host.appendChild(tip);
  return tip;
}
function positionTooltip(host, tip, evt){
  const bcr = host.getBoundingClientRect();
  let left = evt.clientX - bcr.left + 14;
  let top = evt.clientY - bcr.top - 12;
  if(left + 190 > bcr.width) left = evt.clientX - bcr.left - 200;
  if(left < 0) left = 4;
  if(top < 0) top = 0;
  tip.style.left = left+'px'; tip.style.top = top+'px';
}
function chartFallback(container, msg){
  container.style.height='auto';
  container.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;min-height:200px;color:var(--text-faint);font-size:13px;text-align:center;padding:20px;" role="img" aria-label="${escapeHtml(msg||'Chart unavailable')}">${escapeHtml(msg||'Chart could not render — no data available.')}</div>`;
}
function svgLine(svg, x1,y1,x2,y2, stroke, width, extra){
  const l = document.createElementNS(SVGNS,'line');
  l.setAttribute('x1',x1); l.setAttribute('y1',y1); l.setAttribute('x2',x2); l.setAttribute('y2',y2);
  l.setAttribute('stroke',stroke); l.setAttribute('stroke-width',width||1);
  if(extra) Object.keys(extra).forEach(k=>l.setAttribute(k,extra[k]));
  svg.appendChild(l); return l;
}
function svgText(svg, x,y, str, opts){
  opts = opts||{};
  const t = document.createElementNS(SVGNS,'text');
  t.setAttribute('x',x); t.setAttribute('y',y);
  t.setAttribute('text-anchor', opts.anchor||'middle');
  t.setAttribute('fill', opts.fill||themeVar('--chart-axis','#8592AD'));
  t.setAttribute('font-size', opts.size||'12');
  t.setAttribute('font-family', opts.mono ? "'JetBrains Mono',monospace" : "'Inter',sans-serif");
  t.textContent = str;
  svg.appendChild(t); return t;
}
/** Builds the wrapper (legend + clipped chart area) that every chart draws into.
 *  The chart area's height is set explicitly in px (never "auto"), and both the
 *  outer container and inner area use overflow:hidden, so lines/fills/points can
 *  never render outside their own card regardless of container width. */
function chartShell(container, id, W, H, legendSeries, hidden, onToggle){
  container.innerHTML = '';
  container.style.overflow = 'hidden';
  container.style.height = 'auto'; // let the wrapper grow to fit legend + plot area exactly, so overflow:hidden never clips the chart itself (this was cutting off the bottom axis/Rp0 label whenever a legend was present)
  container.style.display = 'flex';
  container.style.flexDirection = 'column';
  if(legendSeries && legendSeries.length>1){
    const bar = document.createElement('div');
    bar.className = 'chart-legend';
    bar.setAttribute('role','group');
    bar.setAttribute('aria-label','Toggle chart series');
    legendSeries.forEach(s=>{
      const isHidden = hidden.has(s.key);
      const item = document.createElement('button');
      item.type = 'button';
      item.setAttribute('aria-pressed', String(!isHidden));
      item.setAttribute('aria-label', `${isHidden?'Show':'Hide'} ${s.label} series`);
      item.style.cssText = `display:flex;align-items:center;gap:6px;background:transparent;border:1px solid transparent;cursor:pointer;color:${isHidden?'var(--text-faint)':'var(--text)'};padding:3px 8px;border-radius:6px;font-size:12px;`;
      item.innerHTML = `<span style="width:10px;height:10px;border-radius:3px;background:${isHidden?themeVar('--border','#2A3550'):s.color};display:inline-block;"></span>${escapeHtml(s.label)}`;
      item.addEventListener('mouseenter', ()=>{ item.style.borderColor='var(--border)'; });
      item.addEventListener('mouseleave', ()=>{ item.style.borderColor='transparent'; });
      item.addEventListener('click', ()=>onToggle(s.key));
      bar.appendChild(item);
    });
    container.appendChild(bar);
  }
  const area = document.createElement('div');
  area.style.cssText = `position:relative;width:100%;height:${H}px;flex:none;overflow:hidden;`;
  container.appendChild(area);

  const svg = document.createElementNS(SVGNS,'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('preserveAspectRatio','none');
  svg.setAttribute('role','img');
  svg.style.width = '100%'; svg.style.height = '100%'; svg.style.display = 'block';
  area.appendChild(svg);

  const clipId = 'clip_' + id + '_' + Math.random().toString(36).slice(2,8);
  const defs = document.createElementNS(SVGNS,'defs');
  const clip = document.createElementNS(SVGNS,'clipPath');
  clip.setAttribute('id', clipId);
  defs.appendChild(clip);
  svg.appendChild(defs);

  return {area, svg, clipId, clipEl:clip};
}

/* Shared layout constants so every chart in the app uses identical padding/typography.
   v2.4.0 readability: wider left margin so Rp labels (incl. billions) never clip,
   taller bottom band, and a minimum 12px axis font. */
const CHART_PAD = {L:86, R:24, T:28, B:46};
const AXIS_LABEL_SIZE = '12';
const GRID_COLOR = '#26314c';
const GRID_OPACITY = '0.55';
const CHART_TICK_MIN_PX = 44; // minimum vertical spacing between Y ticks
// Chart heights (Part 13): min wrapper 320, standard 380, dense 420.
function chartHeightFor(n){ if(n>=10) return 420; if(n>=5) return 380; return 320; }
// Indonesian short currency for chart axes, e.g. Rp20,1 Jt / Rp40,3 Jt / Rp1,2 M.
function fmtIDRid(v){
  if(v===null||v===undefined||isNaN(v)) return '';
  if(v===0) return 'Rp0';
  const sign = v<0?'-':''; const a = Math.abs(v);
  const id = (x)=>x.toLocaleString('id-ID',{minimumFractionDigits:0, maximumFractionDigits:1});
  if(a>=1e12) return sign+'Rp'+id(a/1e12)+' T';
  if(a>=1e9)  return sign+'Rp'+id(a/1e9)+' M';
  if(a>=1e6)  return sign+'Rp'+id(a/1e6)+' Jt';
  if(a>=1e3)  return sign+'Rp'+id(a/1e3)+' Rb';
  return sign+'Rp'+id(a);
}
// Number of Y ticks that keeps spacing >= CHART_TICK_MIN_PX (reduce, never compress).
function yTickCount(plotH){ return Math.max(2, Math.min(5, Math.floor(plotH / CHART_TICK_MIN_PX))); }

/**
 * Multi-series line chart. Gaps (null/undefined) break the line instead of
 * dropping to zero. Supports a legend, a hover crosshair with a rich tooltip
 * callback, per-point color/hollow overrides (for over/under/incomplete
 * status), and click-to-navigate.
 * opts: {labels, series:[{key,label,color,data,fill,pointColor[],pointHollow[],pointRadius[]}],
 *        formatY, height, legend, tooltipHTML(i), onIndexClick(i), ariaLabel}
 */
function drawLineChart(container, opts){
  try{
    const id = container.id || 'lc_'+Math.random().toString(36).slice(2,8);
    const {labels, series, formatY=(v=>v), height=260, legend=true} = opts;
    if(!labels || !labels.length || !series || !series.length || !series.some(s=>s.data.some(v=>v!==null&&v!==undefined))){
      return chartFallback(container, opts.emptyMessage);
    }
    const hidden = getHiddenSet(id);
    const n=labels.length;
    const gridColor = themeVar('--chart-grid', GRID_COLOR);
    const W=780, H=Math.max(320, height || chartHeightFor(n)), padL=CHART_PAD.L, padR=CHART_PAD.R, padT=CHART_PAD.T, padB=CHART_PAD.B;
    const plotW=W-padL-padR, plotH=H-padT-padB;
    const visible = series.filter(s=>!hidden.has(s.key));
    const activeSeries = visible.length ? visible : series; // never hide every series into a blank chart
    const allVals = activeSeries.flatMap(s=>s.data.filter(v=>v!==null&&v!==undefined));
    let maxV=Math.max(0,...allVals), minV=Math.min(0,...allVals);
    if(maxV===minV) maxV = maxV + Math.max(1,Math.abs(maxV)*0.1) || 1;
    const single = n===1;
    const xStep = n>1 ? plotW/(n-1) : 0;
    const yScale = v => padT + plotH - ((v-minV)/(maxV-minV))*plotH;
    // Single-point charts center the marker/label instead of pinning to the left.
    const xScale = i => single ? padL + plotW/2 : padL + i*xStep;

    const {svg, clipId, clipEl} = chartShell(container, id, W, H, legend?series:null, hidden, key=>{
      if(hidden.has(key)) hidden.delete(key); else hidden.add(key);
      drawLineChart(container, opts);
    });
    if(opts.ariaLabel) svg.setAttribute('aria-label', opts.ariaLabel);

    const rect = document.createElementNS(SVGNS,'rect');
    rect.setAttribute('x',padL); rect.setAttribute('y',padT); rect.setAttribute('width',plotW); rect.setAttribute('height',plotH);
    clipEl.appendChild(rect);

    // Dynamic Y ticks — reduce the count rather than compress labels below 44px.
    const ticks = yTickCount(plotH);
    for(let g=0; g<=ticks; g++){
      const v = minV + (maxV-minV)*g/ticks, y = yScale(v);
      svgLine(svg, padL, y, W-padR, y, gridColor, 1, {'stroke-opacity':GRID_OPACITY});
      svgText(svg, padL-12, y+4, fmtIDRid(v), {anchor:'end', mono:true, size:AXIS_LABEL_SIZE});
    }
    if(minV<0 && maxV>0) svgLine(svg, padL, yScale(0), W-padR, yScale(0), gridColor, 1.4);
    const labelEvery = Math.max(1, Math.ceil(n/10));
    labels.forEach((lab,i)=>{
      if(!single && i%labelEvery!==0 && i!==n-1) return;
      svgText(svg, xScale(i), H-12, lab, {size:AXIS_LABEL_SIZE});
    });

    const dataG = document.createElementNS(SVGNS,'g');
    dataG.setAttribute('clip-path', `url(#${clipId})`);
    svg.appendChild(dataG);

    activeSeries.forEach(s=>{
      const segments=[]; let cur=[];
      s.data.forEach((v,i)=>{
        if(v===null||v===undefined){ if(cur.length) segments.push(cur); cur=[]; }
        else cur.push([i,v]);
      });
      if(cur.length) segments.push(cur);
      segments.forEach(seg=>{
        const d = seg.map(([i,v],idx)=>`${idx===0?'M':'L'} ${xScale(i).toFixed(1)} ${yScale(v).toFixed(1)}`).join(' ');
        if(s.fill && seg.length){
          const baseY = yScale(Math.max(minV,0));
          const areaD = d + ` L ${xScale(seg[seg.length-1][0]).toFixed(1)} ${baseY.toFixed(1)} L ${xScale(seg[0][0]).toFixed(1)} ${baseY.toFixed(1)} Z`;
          const area = document.createElementNS(SVGNS,'path');
          area.setAttribute('d', areaD); area.setAttribute('fill', s.color); area.setAttribute('opacity','0.10'); area.setAttribute('stroke','none');
          dataG.appendChild(area);
        }
        const path = document.createElementNS(SVGNS,'path');
        path.setAttribute('d', d); path.setAttribute('fill','none'); path.setAttribute('stroke', s.color);
        path.setAttribute('stroke-width','2.2'); path.setAttribute('stroke-linejoin','round'); path.setAttribute('stroke-linecap','round');
        dataG.appendChild(path);
      });
      s.data.forEach((v,i)=>{
        if(v===null||v===undefined) return;
        const rad = Array.isArray(s.pointRadius) ? s.pointRadius[i] : (s.pointRadius!==undefined ? s.pointRadius : 3);
        if(rad===0) return;
        const isHollow = Array.isArray(s.pointHollow) ? !!s.pointHollow[i] : !!s.pointHollow;
        const pc = Array.isArray(s.pointColor) ? (s.pointColor[i]||s.color) : (s.pointColor||s.color);
        const c = document.createElementNS(SVGNS,'circle');
        c.setAttribute('cx', xScale(i)); c.setAttribute('cy', yScale(v)); c.setAttribute('r', single?5:rad);
        c.setAttribute('fill', isHollow ? themeVar('--chart-hollow','#161D2C') : pc);
        c.setAttribute('stroke', pc); c.setAttribute('stroke-width', isHollow?'2':'1.3');
        dataG.appendChild(c);
      });
    });
    // Single-point annotation (Part 13): show each series' value beside the
    // centered marker — no fake trend line is drawn (a lone point has no line).
    if(single){
      let ann = padT + 16;
      activeSeries.forEach(s=>{
        const v = s.data[0]; if(v===null||v===undefined) return;
        svgText(svg, xScale(0), ann, `${s.label}: ${formatY(v)}`, {size:AXIS_LABEL_SIZE, fill:s.color, mono:true});
        ann += 18;
      });
    }

    // hover crosshair + click-to-navigate over the full plot area
    const tip = chartTooltip(container.querySelector('div'));
    const guide = svgLine(svg, 0,padT, 0,padT+plotH, '#5E6A87', 1, {'stroke-dasharray':'3,3', opacity:'0'});
    const hitRect = document.createElementNS(SVGNS,'rect');
    hitRect.setAttribute('x',padL); hitRect.setAttribute('y',padT); hitRect.setAttribute('width',plotW); hitRect.setAttribute('height',plotH);
    hitRect.setAttribute('fill','transparent');
    hitRect.style.cursor = opts.onIndexClick ? 'pointer' : 'crosshair';
    if(opts.onIndexClick) hitRect.setAttribute('role','button');
    let lastIdx = -1;
    function nearestIndex(evt){
      const bcr = svg.getBoundingClientRect();
      const relX = (evt.clientX-bcr.left) * (W/bcr.width);
      let idx = n>1 ? Math.round((relX-padL)/xStep) : 0;
      return Math.max(0, Math.min(n-1, idx));
    }
    hitRect.addEventListener('mousemove', evt=>{
      const i = nearestIndex(evt);
      if(i!==lastIdx){
        lastIdx = i;
        guide.setAttribute('x1', xScale(i)); guide.setAttribute('x2', xScale(i)); guide.setAttribute('opacity','1');
        if(opts.tooltipHTML){ tip.innerHTML = opts.tooltipHTML(i); }
        else{
          const rows = activeSeries.map(s=>{
            const v = s.data[i];
            return `<div style="display:flex;align-items:center;gap:6px;"><span style="width:8px;height:8px;border-radius:50%;background:${s.color};display:inline-block;"></span>${escapeHtml(s.label)}: <b style="font-family:monospace;">${v===null||v===undefined?'no data':formatY(v)}</b></div>`;
          }).join('');
          tip.innerHTML = `<div style="font-weight:600;margin-bottom:4px;">${escapeHtml(labels[i])}</div>${rows}`;
        }
        tip.style.opacity='1';
      }
      positionTooltip(container.querySelector('div'), tip, evt);
    });
    hitRect.addEventListener('mouseleave', ()=>{ tip.style.opacity='0'; guide.setAttribute('opacity','0'); lastIdx=-1; });
    if(opts.onIndexClick) hitRect.addEventListener('click', evt=>opts.onIndexClick(nearestIndex(evt)));
    svg.appendChild(hitRect);
  }catch(err){
    console.error('drawLineChart error', err);
    chartFallback(container, 'Chart could not render (' + err.message + ').');
  }
}

/**
 * Grouped or single-series bar chart. Supports signed values (green/red),
 * a legend, a rich tooltip callback, muted "no data" ticks for null values
 * (never rendered as zero), and click-to-navigate.
 * opts: {labels, series:[{key,label,color,data,colors?}], formatY, height, signed, legend, tooltipHTML(i,seriesIndex), onBarClick(i,seriesIndex)}
 */
function drawBarChart(container, opts){
  try{
    const id = container.id || 'bc_'+Math.random().toString(36).slice(2,8);
    const {labels, series, formatY=(v=>v), height=260, signed=false, legend=true} = opts;
    if(!labels || !labels.length || !series || !series.length){ return chartFallback(container, opts.emptyMessage); }
    const hidden = getHiddenSet(id);
    const visible = series.filter(s=>!hidden.has(s.key));
    const activeSeries = visible.length ? visible : series;
    const allVals = activeSeries.flatMap(s=>s.data.filter(v=>v!==null&&v!==undefined));
    if(!allVals.length){ return chartFallback(container, opts.emptyMessage); }
    const n=labels.length;
    const gridColor = themeVar('--chart-grid', GRID_COLOR);
    const W=780, H=Math.max(320, height || chartHeightFor(n)), padL=CHART_PAD.L, padR=CHART_PAD.R, padT=CHART_PAD.T, padB=CHART_PAD.B;
    const plotW=W-padL-padR, plotH=H-padT-padB;
    let maxV=Math.max(0,...allVals), minV=Math.min(0,...allVals);
    if(maxV===minV) maxV = maxV + Math.max(1,Math.abs(maxV)*0.1) || 1;
    const groupW = plotW/n;
    const barW = Math.min(30, (groupW*0.68)/activeSeries.length);
    const yScale = v => padT + plotH - ((v-minV)/(maxV-minV))*plotH;
    const zeroY = yScale(0);

    const {svg, clipId, clipEl} = chartShell(container, id, W, H, legend&&series.length>1?series:null, hidden, key=>{
      if(hidden.has(key)) hidden.delete(key); else hidden.add(key);
      drawBarChart(container, opts);
    });
    if(opts.ariaLabel) svg.setAttribute('aria-label', opts.ariaLabel);
    const clipRect = document.createElementNS(SVGNS,'rect');
    clipRect.setAttribute('x',padL); clipRect.setAttribute('y',padT); clipRect.setAttribute('width',plotW); clipRect.setAttribute('height',plotH);
    clipEl.appendChild(clipRect);

    const ticks = yTickCount(plotH);
    for(let g=0; g<=ticks; g++){
      const v = minV + (maxV-minV)*g/ticks, y = yScale(v);
      svgLine(svg, padL, y, W-padR, y, gridColor, 1, {'stroke-opacity':GRID_OPACITY});
      svgText(svg, padL-12, y+4, fmtIDRid(v), {anchor:'end', mono:true, size:AXIS_LABEL_SIZE});
    }
    const labelEvery = Math.max(1, Math.ceil(n/12));
    const tip = chartTooltip(container.querySelector('div'));

    const dataG = document.createElementNS(SVGNS,'g');
    dataG.setAttribute('clip-path', `url(#${clipId})`);
    svg.appendChild(dataG);

    labels.forEach((lab,i)=>{
      const gx = padL + i*groupW;
      if(i%labelEvery===0 || i===n-1) svgText(svg, gx+groupW/2, H-12, lab, {size:AXIS_LABEL_SIZE});
      activeSeries.forEach((s,si)=>{
        const v = s.data[i];
        const bx = gx + groupW/2 - (activeSeries.length*barW)/2 + si*barW;
        const g2 = document.createElementNS(SVGNS,'g');
        g2.style.cursor = 'pointer';
        if(v===null||v===undefined){
          const tick = document.createElementNS(SVGNS,'rect');
          tick.setAttribute('x',bx); tick.setAttribute('y',zeroY-1); tick.setAttribute('width',Math.max(barW-4,4)); tick.setAttribute('height',2);
          tick.setAttribute('fill', themeVar('--chart-axis','#5E6A87')); tick.setAttribute('opacity','0.5');
          g2.appendChild(tick);
        } else {
          const barY = v>=0 ? yScale(v) : zeroY;
          const barH = Math.max(Math.abs(zeroY-yScale(v)),1);
          const barRect = document.createElementNS(SVGNS,'rect');
          barRect.setAttribute('x',bx); barRect.setAttribute('y',barY); barRect.setAttribute('width',Math.max(barW-4,4)); barRect.setAttribute('height',barH); barRect.setAttribute('rx','2');
          const fill = signed ? (v>=0?'#4FAE7C':'#C1543F') : ((s.colors && s.colors[i]) || s.color);
          barRect.setAttribute('fill', fill);
          g2.appendChild(barRect);
        }
        g2.addEventListener('mouseenter', ()=>{
          tip.innerHTML = opts.tooltipHTML ? opts.tooltipHTML(i, si) :
            `<div style="font-weight:600;margin-bottom:4px;">${escapeHtml(lab)}</div><div>${escapeHtml(s.label)}: <b style="font-family:monospace;">${v===null||v===undefined?'no data':formatY(v)}</b></div>`;
          tip.style.opacity='1';
        });
        g2.addEventListener('mousemove', e=>positionTooltip(container.querySelector('div'), tip, e));
        g2.addEventListener('mouseleave', ()=>{ tip.style.opacity='0'; });
        if(opts.onBarClick) g2.addEventListener('click', ()=>opts.onBarClick(i, si));
        dataG.appendChild(g2);
      });
    });
    svgLine(svg, padL, zeroY, W-padR, zeroY, gridColor, 1.4);
  }catch(err){
    console.error('drawBarChart error', err);
    chartFallback(container, 'Chart could not render (' + err.message + ').');
  }
}

async function loadState(){
  await StorageAdapter.selfTest();
  try{
    // Load priority: Claude Artifact storage → browser localStorage → seed
    // data. StorageAdapter.get already implements the claude→local fallback,
    // so stored user data is never overwritten and seed is loaded exactly once.
    // v2.3.0 clean build: no data is bundled. A returning user's stored data is
    // loaded and never erased; a genuinely fresh browser starts empty (0 records).
    const res = await StorageAdapter.get('tam_txns_v1');
    let loaded = (res && res.value) ? safeParse(res.value, 'transactions') : null;
    if(Array.isArray(loaded)){
      State.txns = loaded;
      // v2.5.2 — an EMPTY stored array is not "existing data". _hadStoredData is
      // computed from meaningful business datasets below (see hasMeaningfulBusinessData).
    } else {
      State.txns = [];        // clean empty state — the seed element is intentionally []
      await persist();
    }
  }catch(e){
    console.error('loadState error', e);
    State.txns = [];
  }
  await loadSettings();
  await loadBackups();
  await loadHRData();
  await migrateToExecutionSchema();
  await migrateToHRSchema();
  await migrateNormalizeEntities();
  await migrateToOvertimeSchema();
  await migrateToPayrollOpsSchema();
  await migrateToDedupSchema();
  // v2.5.2 — treat the app as carrying data ONLY when a meaningful business
  // dataset has real records. Empty arrays, settings, migration flags, schema
  // version, empty backups/audits and UI prefs never count (fresh-install fix).
  State._hadStoredData = hasMeaningfulBusinessData();
  const months = getMonths();
  if(months.length){ State.selectedMonth = months[months.length-1].key; }
  State.view = ['execDashboard','financeOverview','transactions','add','planvsactual','compare','trends','executioncenter'].includes(State.settings.defaultLandingPage) ? State.settings.defaultLandingPage : 'execDashboard';
  if(State.settings.defaultTrendRange) State.trendsFilter.range = State.settings.defaultTrendRange;
  State.storageReady = true;
}

// One-time migration to the v2.1 execution schema. Runs at most once (guarded
// by a persisted flag). Backs up the pre-migration transaction set first, then
// assigns every transaction a lifecycle status derived from its existing
// amounts — so old records with recorded actuals become Completed/Partial and
// records with no actual become Planned. No data is invented or discarded.
async function migrateToExecutionSchema(){
  try{
    const flagRes = await StorageAdapter.get('tam_migrated_exec_v21');
    if(flagRes && flagRes.value==='done') {
      // Still ensure any transaction lacking a status gets one (defensive, no-op for migrated data).
      let touched=false;
      State.txns.forEach(t=>{ if(!t.status){ t.status = computeStatus(t); t.history = t.history||[{event:'created', ts:t._importedAt||null}]; touched=true; } });
      if(touched) await persist();
      return;
    }
    // pre-migration backup (skip on a clean/empty install so a fresh file keeps 0 backups)
    if(State.txns.length){
      State.backups.unshift({
        id: uid('backup'), monthKey:'__all__', monthLabel:'Pre-2.1 migration (all months)',
        timestamp: new Date().toISOString(), txns: JSON.parse(JSON.stringify(State.txns)), migration:true,
      });
      await saveBackups();
    }
    // assign lifecycle fields
    const nowIso = new Date().toISOString();
    State.txns.forEach(t=>{
      if(!t.status) t.status = computeStatus(t);
      if(!t.history){
        const hist = [{event:'created', ts:null, note:'Imported / created before execution tracking'}];
        if(t.actual!==null && t.actual!==undefined){
          hist.push({event:'executed', ts:null, note:'Actual recorded from source data', amount:t.actual});
        }
        t.history = hist;
      }
      if(t.execution===undefined) t.execution = (t.actual!==null && t.actual!==undefined)
        ? {executionDate:t.txnDate||null, actualAmount:t.actual, method:null, bank:null, reference:null, notes:'Migrated from realization data', executedBy:'—', executionId:uid('exec'), ts:nowIso}
        : null;
    });
    await persist();
    await StorageAdapter.set('tam_migrated_exec_v21', 'done');
    toast('Data upgraded to Finance Execution Engine (v2.1).');
  }catch(e){
    console.error('migration error', e);
  }
}

    const parsed = (res && res.value) ? safeParse(res.value, 'settings') : null;
    if(parsed && typeof parsed==='object' && !Array.isArray(parsed)){
      // Existing settings found — merge onto defaults so new fields always have safe values (no destructive overwrite of user values).
      State.settings = {...DEFAULT_SETTINGS, ...parsed, schemaVersion: SCHEMA_VERSION};
    } else {
