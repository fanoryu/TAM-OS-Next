/* ---- BUDGET CENTER ---- */
function renderBudgetCenter(main){
  const months = getMonths();
  if(!months.length){ main.innerHTML = emptyState('No data yet','Add or upload monthly data first.'); return; }
  const years = [...new Set(months.map(m=>m.year))];
  if(!State.budgetYear || !years.includes(State.budgetYear)) State.budgetYear = years[years.length-1];
  const yearMonths = months.filter(m=>m.year===State.budgetYear);
  const yRows = trendRows(yearMonths);
  const annualPlanned = yearMonths.reduce((s,m)=>s+monthTotals(m.key).planned,0);
  const knownActualRows = yRows.filter(r=>r.info.hasData);
  const annualActual = knownActualRows.reduce((s,r)=>s+r.tot.actual,0);
  const remaining = annualPlanned - annualActual;
  const utilization = annualPlanned ? (annualActual/annualPlanned*100) : 0;
  const catUtil = KNOWN_CATEGORIES.map(cat=>{
    let planned=0, actual=0, hasAny=false;
    yearMonths.forEach(m=>{ const cb=categoryBreakdown(m.key).find(c=>c.category===cat); if(cb){ planned+=cb.planned; if(cb.hasActual){ actual+=cb.actual; hasAny=true; } } });
    return {cat, planned, actual, hasAny, pctUsed: planned?actual/planned*100:0};
  });
  const atRisk = yRows.filter(r=>r.info.hasData && r.tot.planned && (r.tot.actual/r.tot.planned)>=0.9);

  const sim = State.budgetSim;
  const catBase = {};
  KNOWN_CATEGORIES.forEach(cat=>{ const cu=catUtil.find(c=>c.cat===cat); catBase[cat] = cu&&cu.hasAny? cu.actual/Math.max(1,knownActualRows.length) : 0; });
  const projGaji = catBase['Gaji']*(1+sim.payrollPct/100);
  const projRutin = catBase['Operasional Rutin']*(1+sim.opsPct/100);
  const projKegiatan = catBase['Operasional Kegiatan']*(1+sim.opsPct/100);
  const projTotal = (projGaji+projRutin+projKegiatan) * (1+sim.expensePct/100);
  const currentAvgActual = knownActualRows.length ? annualActual/knownActualRows.length : 0;
  const projVariance = currentAvgActual - projTotal;

  main.innerHTML = `
    <div class="page-head">
      <div><h1>Budget Center</h1><p class="desc">Annual and monthly budget utilization for ${escapeHtml(State.settings.companyName||COMPANY_NAME_DEFAULT)}.</p></div>
      <div class="head-controls"><select id="budgetYear" class="input">${years.map(y=>`<option value="${y}" ${y===State.budgetYear?'selected':''}>${y}</option>`).join('')}</select></div>
    </div>
    <div class="grid grid-4" style="margin-bottom:14px;">
      <div class="card stat-card"><div class="stat-label">Annual Planned Budget</div><div class="stat-value">${fmtIDRShort(annualPlanned)}</div></div>
      <div class="card stat-card"><div class="stat-label">Annual Actual Spend</div><div class="stat-value">${fmtIDRShort(annualActual)}</div><div class="stat-sub dim">${knownActualRows.length} of ${yearMonths.length} months recorded</div></div>
      <div class="card stat-card"><div class="stat-label">Remaining Budget</div><div class="stat-value" style="color:${remaining>=0?'var(--green)':'var(--brick)'}">${fmtIDRShort(remaining)}</div></div>
      <div class="card stat-card"><div class="stat-label">Budget Utilization</div><div class="stat-value">${utilization.toFixed(0)}%</div></div>
    </div>
    <div class="card" style="margin-bottom:14px;">
      <h3>Monthly Planned vs. Actual — ${State.budgetYear}</h3>
      <p class="hint">Click a point to open that month's Finance Overview.</p>
      <div class="chart-wrap" id="budgetMonthlyChart"></div>
    </div>
    <div class="card" style="margin-bottom:14px;">
      <h3>Category Utilization</h3>
      <div class="table-wrap"><table>
        <thead><tr><th>Category</th><th class="num">Planned</th><th class="num">Actual</th><th class="num">% Used</th></tr></thead>
        <tbody>${catUtil.map(c=>`<tr><td>${categoryPill(c.cat)}</td><td class="num">${fmtIDR(c.planned)}</td><td class="num">${c.hasAny?fmtIDR(c.actual):'<span class="faint">—</span>'}</td><td class="num">${c.hasAny?c.pctUsed.toFixed(0)+'%':'—'}</td></tr>`).join('')}</tbody>
      </table></div>
    </div>
    <div class="card" style="margin-bottom:14px;">
      <h3>Months at Risk of Overspending<span class="tag">≥90% of plan used</span></h3>
      <div class="table-wrap"><table>
        <thead><tr><th>Month</th><th class="num">Planned</th><th class="num">Actual</th><th class="num">% Used</th></tr></thead>
        <tbody>${atRisk.map(r=>`<tr><td>${escapeHtml(monthLabel(r.m))}</td><td class="num">${fmtIDR(r.tot.planned)}</td><td class="num">${fmtIDR(r.tot.actual)}</td><td class="num" style="color:var(--brick);">${(r.tot.actual/r.tot.planned*100).toFixed(0)}%</td></tr>`).join('') || '<tr><td colspan="4" class="empty">No months at risk this year</td></tr>'}</tbody>
      </table></div>
    </div>
    <div class="card">
      <h3>Scenario Simulator<span class="tag">simulation only — not saved</span></h3>
      <p class="hint">Projects monthly spending from this year's average monthly actuals by category. Nothing here is written to your data.</p>
      <div class="form-grid" style="grid-template-columns:repeat(3,1fr);">
        <div class="field"><label>Overall Expense Increase %</label><input class="input" id="simExpense" type="number" step="1" value="${sim.expensePct}"></div>
        <div class="field"><label>Payroll Increase %</label><input class="input" id="simPayroll" type="number" step="1" value="${sim.payrollPct}"></div>
        <div class="field"><label>Operational Cost Increase %</label><input class="input" id="simOps" type="number" step="1" value="${sim.opsPct}"></div>
      </div>
      <div class="grid grid-2" style="margin-top:14px;">
        <div class="card stat-card"><div class="stat-label">Projected Monthly Spending (Simulation)</div><div class="stat-value">${fmtIDRShort(projTotal)}</div></div>
        <div class="card stat-card"><div class="stat-label">Projected Variance vs. Current Average (Simulation)</div><div class="stat-value" style="color:${projVariance>=0?'var(--green)':'var(--brick)'}">${fmtIDRShort(projVariance)}</div></div>
      </div>
    </div>
  `;
  document.getElementById('budgetYear').addEventListener('change', e=>{ State.budgetYear=Number(e.target.value); renderBudgetCenter(main); });
  ['simExpense','simPayroll','simOps'].forEach((id,ix)=>{
    document.getElementById(id).addEventListener('input', e=>{
      const skey = ['expensePct','payrollPct','opsPct'][ix];
      State.budgetSim[skey] = Number(e.target.value)||0;
      renderBudgetCenter(main);
    });
  });
  const bmEl = document.getElementById('budgetMonthlyChart');
  if(bmEl){
    drawLineChart(bmEl, {
      labels: yearMonths.map(m=>m.month.slice(0,3)),
      series: [
        {key:'planned', label:'Planned', color:'#96A1BA', data: yRows.map(r=>r.tot.planned)},
        {key:'actual', label:'Actual', color:'#C9A15C', fill:true, data: yRows.map(r=>r.info.hasData?r.tot.actual:null),
          pointColor: yRows.map(r=>actualPointColor(r)), pointHollow: yRows.map(r=>r.info.hasData && !r.info.complete)},
      ],
      formatY: fmtIDRShort, height:260,
      emptyMessage:'No data for this year.',
      ariaLabel:'Monthly planned versus actual budget',
      tooltipHTML:(i)=>trendTooltip(yRows[i]),
      onIndexClick:(i)=>goToMonthOverview(yRows[i].m.key),
    });
  }
}

/* ---- EXECUTIVE INSIGHTS ---- */
function renderExecutiveInsights(main){
  const months = getMonths();
  if(!months.length){ main.innerHTML = emptyState('No data yet','Add or upload monthly data first.'); return; }
  const rows = trendRows(months);
  const withData = rows.filter(r=>r.info.hasData);
  const insights = [];

  const growthRows = rows.filter(r=>r.growthAbs!==null);
  if(growthRows.length){
    const biggestIncrease = growthRows.reduce((a,b)=>b.growthAbs>a.growthAbs?b:a);
    const biggestDecrease = growthRows.reduce((a,b)=>b.growthAbs<a.growthAbs?b:a);
    if(biggestIncrease.growthAbs>0) insights.push({text:`Largest expense growth: ${fmtIDR(biggestIncrease.growthAbs)} increase in ${monthLabel(biggestIncrease.m)} (${pct(biggestIncrease.growthPct)}).`, basis:'Actual data', type:'warn'});
    if(biggestDecrease.growthAbs<0) insights.push({text:`Largest saving: ${fmtIDR(Math.abs(biggestDecrease.growthAbs))} decrease in ${monthLabel(biggestDecrease.m)} (${pct(biggestDecrease.growthPct)}).`, basis:'Actual data', type:'good'});
  }
  const catTotals = {};
  State.txns.filter(t=>t.type!=='income' && t.actual!=null).forEach(t=>{ catTotals[t.category]=(catTotals[t.category]||0)+t.actual; });
  const catEntries = Object.entries(catTotals).sort((a,b)=>b[1]-a[1]);
  if(catEntries.length) insights.push({text:`Highest-spending category overall: ${catEntries[0][0]} at ${fmtIDR(catEntries[0][1])}.`, basis: withData.length===months.length?'Complete data':'Partial data', type:'info'});

  [...new Set([...KNOWN_CATEGORIES, ...State.txns.map(t=>t.category)])].forEach(cat=>{
    const series = categorySeries(cat, months).filter(x=>x.hasActual);
    let streak=0;
    for(let i=series.length-1;i>0;i--){ if(series[i].actual>series[i-1].actual) streak++; else break; }
    if(streak>=2) insights.push({text:`${cat} spending has increased for ${streak+1} consecutive months.`, basis:'Actual data', type:'warn'});
  });
  const unplanned = State.txns.filter(t=>t.unplanned && t.actual);
  if(unplanned.length) insights.push({text:`${unplanned.length} unplanned expense${unplanned.length>1?'s':''} recorded across all history, totaling ${fmtIDR(unplanned.reduce((s,t)=>s+t.actual,0))}.`, basis:'Actual data', type:'warn'});
  const incompleteMonths = rows.filter(r=>r.info.hasData && !r.info.complete);
  if(incompleteMonths.length) insights.push({text:`${incompleteMonths.length} month${incompleteMonths.length>1?'s have':' has'} partially recorded actuals: ${incompleteMonths.map(r=>monthLabel(r.m)).join(', ')}.`, basis:'Partial data', type:'info'});
  const missingMonths = rows.filter(r=>!r.info.hasData);
  if(missingMonths.length) insights.push({text:`${missingMonths.length} month${missingMonths.length>1?'s have':' has'} no realization data at all: ${missingMonths.map(r=>monthLabel(r.m)).join(', ')}.`, basis:'Planned data only', type:'info'});
  let overStreak=0;
  for(let i=withData.length-1;i>=0;i--){ if(withData[i].tot.actual>withData[i].tot.planned) overStreak++; else break; }
  if(overStreak>=2) insights.push({text:`The last ${overStreak} months with recorded actuals each ran over budget — elevated over-budget risk going forward.`, basis:'Actual data', type:'warn'});
  const recurring = recurringItems();
  if(recurring.length) insights.push({text:`${recurring.length} line items recur across 3 or more months — the largest is "${recurring[0].label}" at an average of ${fmtIDR(recurring[0].monthCount?recurring[0].totalActual/recurring[0].monthCount:0)}/month.`, basis:'Actual data', type:'info'});
  if(withData.length) insights.push({text:`Historical average actual spending is ${fmtIDR(withData.reduce((s,r)=>s+r.tot.actual,0)/withData.length)}/month across ${withData.length} recorded months.`, basis: withData.length===months.length?'Complete data':'Partial data', type:'info'});
  const lastRow = rows[rows.length-1];
  if(lastRow && lastRow.growthAbs!==null) insights.push({text:`Most recent month-over-month change: ${lastRow.growthAbs>0?'+':''}${fmtIDR(lastRow.growthAbs)} (${pct(lastRow.growthPct)}) in ${monthLabel(lastRow.m)}.`, basis:'Actual data', type: lastRow.growthAbs>0?'warn':'good'});

  main.innerHTML = `
    <div class="page-head"><div><h1>Executive Insights</h1><p class="desc">Observations generated only from recorded data — each labeled with how complete that data is.</p></div></div>
    <div class="card">
      <div class="insight-list">
        ${insights.map(i=>`<div class="insight-item ${i.type}" style="display:block;">
          <div>${i.text}</div>
          <div class="faint" style="font-size:10.5px;margin-top:4px;text-transform:uppercase;letter-spacing:.4px;">Based on: ${escapeHtml(i.basis)}</div>
        </div>`).join('') || '<div class="empty">Not enough data yet for insights.</div>'}
      </div>
    </div>
  `;
}

// System Diagnostics summary block (Phase 14).
function buildDiagnosticsHTML(){
  const li = State.lastIntegrity;
  const integrityStatus = li ? (li.counts.critical?`<span style="color:var(--brick);">${escapeHtml(li.status)}</span>`:li.counts.warning?`<span style="color:var(--accent);">${escapeHtml(li.status)}</span>`:`<span style="color:var(--green);">${escapeHtml(li.status)}</span>`) : '<span class="faint">not yet run</span>';
  const rows = [
    ['App Version', escapeHtml(APP_VERSION+' — '+APP_RELEASE_NAME)],
    ['Schema Version', String(SCHEMA_VERSION)],
    ['Storage Mode', escapeHtml(StorageAdapter.modeLabel())],
    ['Persistence Status', escapeHtml(StorageAdapter.statusLabel())],
    ['Transactions', String(State.txns.length)],
    ['Employees', String(State.employees.length)],
    ['Unique Employee Names', (function(){ return String(new Set(State.employees.map(e=>normalizeEmployeeName(e.fullName)).filter(Boolean)).size); })()],
    ['Duplicate Employee Groups', (function(){ const g=findEmployeeDuplicateGroups(); return g.length?`<span style="color:var(--brick);">${g.length}</span>`:'0'; })()],
    ['Duplicate Employee Records', (function(){ const g=findEmployeeDuplicateGroups(); const n=g.reduce((a,x)=>a+x.employees.length,0); return n?`<span style="color:var(--brick);">${n}</span>`:'0'; })()],
    ['Last Employee Merge', (function(){ const m=(State.employeeMerges||[])[0]; return m?escapeHtml(new Date(m.ts).toLocaleString('id-ID'))+' → '+escapeHtml(m.canonicalCode||m.canonicalEmployeeId):'<span class="faint">never</span>'; })()],
    ['Last Smart Import Unique Employees', (function(){ const s=State.lastSmartImportUnique; return s?`${s.uniqueEmployees} of ${s.rows} row(s) (${s.newEmployees} new · ${s.matchedEmployees} matched)`:'<span class="faint">—</span>'; })()],
    ['Contracts', String(State.contracts.length)],
    ['Payroll Plans', String(State.payrollPlans.length)],
    ['Monthly Plans', String(State.monthlyPlans.length)],
    ['Recurring Expenses', String(State.recurringExpenses.length)],
    ['Overtime Records', String(State.overtimeRecords.length)],
    ['Import Batches', String(State.importBatches.length)+(State.importBatches.some(b=>!b.undone)?' ('+State.importBatches.filter(b=>!b.undone).length+' active)':'')],
    ['Payroll Adjustments', String(State.payrollAdjustments.length)],
    ['Backups', String(State.backups.length)],
    ['Last Successful Save', State.lastSaveAt?escapeHtml(new Date(State.lastSaveAt).toLocaleString('id-ID')):'<span class="faint">— (no write yet this session)</span>'],
    ['Last Migration', State.settings.lastMigrationAt?escapeHtml(new Date(State.settings.lastMigrationAt).toLocaleString('id-ID')):'<span class="faint">—</span>'],
    ['Last Data Reset', (()=>{ const r=lastResetAudit(); return r?escapeHtml(new Date(r.ts).toLocaleString('id-ID')):'<span class="faint">never</span>'; })()],
    ['Data Integrity', integrityStatus],
  ];
  return `<div class="table-wrap"><table><tbody>${rows.map(([k,v])=>`<tr><td class="dim" style="width:210px;">${k}</td><td><b>${v}</b></td></tr>`).join('')}</tbody></table></div>`;
}
// Integrity findings block (Phase 14) — read-only, never deletes anything.
function buildIntegrityHTML(res){
  if(!res) return '';
  const head = `<p class="hint" style="margin-bottom:8px;">Ran ${escapeHtml(new Date(res.ranAt).toLocaleString('id-ID'))} · ${res.counts.critical} critical · ${res.counts.warning} warning · ${res.counts.info} info. Findings are reported only — nothing is deleted or changed automatically.</p>`;
  if(!res.findings.length) return head + `<div class="insight-item good" style="display:block;">No integrity issues detected. All records have valid IDs, links, dates, and amounts.</div>`;
  return head + `<div class="insight-list">${res.findings.map(f=>`<div class="insight-item ${f.severity==='critical'?'warn':f.severity==='warning'?'warn':''}">${severityPill(f.severity)} <span style="margin-left:6px;">${escapeHtml(f.message)}</span></div>`).join('')}</div>`;
}

function renderReleaseNotes(main){
  const notes = [
    {v:'2.5.2 — Employee Deduplication & Master Data Consolidation', items:['Fixed the core bug where importing a multi-sheet workbook created the same employee once per month (e.g. Achmad Ferdiansyah appearing under many Employee IDs). Employees are master data — one record per real person','Smart Import now builds ONE workbook-wide canonical employee index across all rows, existing Employees, existing Contracts, and existing payroll/transaction links BEFORE creating anything; every monthly row for the same person references one candidate','Shared employee-name normalization (trim, collapse spaces, remove line breaks, normalize apostrophes/hyphens and trailing punctuation, case-insensitive) — the original display name is preserved and genuinely different names are never merged on fuzzy similarity','Matching priority: existing employeeId → existing contract already linked to a person → exact normalized full name → name+bank → name+email → name+salary (supporting evidence only) → manual review. A new contract number for the same person creates a new Contract linked to the existing Employee; salary changes and contract renewals never create a new Employee','Commit uses ONE shared employee-resolution map and a per-employee contract map: each unique person is created once, each contract number is created once per person and reused across months, and payroll plans and transactions all link to the same employeeId','Re-importing the same workbook (or separate monthly workbooks) produces 0 duplicate employees, 0 duplicate contracts, 0 duplicate payroll plans and 0 duplicate transactions — stable matching plus import audit evidence','New Employee Duplicate Review tool: detects groups with the same normalized name, shows every duplicate Employee ID with its linked contracts/payroll/transactions/overtime/adjustments, proposes a canonical record (most links → most complete profile → oldest → lowest sequence), and merges only on confirmation — repointing all linked records, preserving every history entry and financial amount, with a complete automatic backup and an audit record; profile conflicts are shown side-by-side and never overwritten silently','Smart Import review now shows workbook-wide unique counts (payroll rows, unique employees, existing matched, new, possible duplicates, contracts, payroll plans, transactions) and the shared candidate + canonical Employee ID per row','Integrity Check detects duplicate normalized names, one contract number linked to multiple employees, payroll/overtime split across duplicate IDs, orphaned duplicates, conflicting bank/email within a group, and import batches that created multiple employees for one candidate — with navigation to Employee Duplicate Review (never auto-merging)','Diagnostics add unique employee-name count, duplicate groups/records, last merge, and last Smart Import unique-employee count; a new Employee Duplicate Audit report (Normalized Name, Employee IDs, Canonical Employee, Contracts, Payroll Plans, Transactions, Merge Status)','Fresh-install fix: the "Existing data detected" prompt now appears only when a real business dataset has records (transactions, employees, contracts, payroll plans, recurring expenses, monthly plans, overtime, adjustments, or import batches that created records) — empty arrays, default settings, migration flags, schema version, empty backups/audits and UI preferences no longer trigger it, and it lists only datasets with non-zero counts','Safe one-time v2.5.2 migration takes a backup, runs once, preserves all data and storage keys, and never auto-merges existing duplicates — they are only detected and surfaced for your confirmation. Smart Import, Payroll Planning, Overtime, Monthly Plan, Execution Center, themes, charts, backup/restore and sidebar behavior are all preserved']},
    {v:'2.5.1 — Structured Payroll Column Mapping', items:['Smart Import now reads the real TAM "Rencana Penggunaan Dana" layout where each employee is a vertically-merged block in column B — employee name (main row), contract number (sub-row), and contract progress N/M (sub-row) are gathered together instead of the sub-rows being discarded, which is what previously left contracts as "Missing Information"','Sub-row gathering: parseLetterDocSheet now attaches each block\'s contract-number and progress cells to the employee item and derives structured employeeName / contractNumber / progressCurrent / progressTotal / salary fields that survive the plan⇄realisasi merge','Structured column support: parseGenericTable recognizes dedicated Indonesian & English headers — Nama / Nama Karyawan / Employee, No Kontrak / Nomor Kontrak / Contract Number, Progress / Masa Kontrak, Gaji / Salary / Nominal, Jam Kerja, Hari Kerja, Lembur — and preserves employeeName, contractNumber, contractProgress, salary, workingHoursPerDay, workingDaysPerWeek and overtimeHours through every parsing stage','Flexible contract-number parsing accepts arabic or roman month segments, 3–6 segments and "/" or "." separators (e.g. 1/AIMO-DT/1/2026, 01/TAM/01.SDM.IV/2026, 3/AIMO-DT/SPK/VI/2025); progress parsing accepts 8/12, 8 / 12, 8,5/12, "Month 8 of 12" and "8 of 12"','Progress is always converted to currentMonth + durationMonths and start is inferred from the contract number, payroll month and progress — the raw "8/12" is never stored as permanent contract state; when the contract number\'s own month/year disagrees with the progress-derived start, the row is flagged instead of guessed','Employees with no contract number and no progress (e.g. a "bulan Juni" note) are no longer blocked — a default-duration contract starting the payroll month is proposed and clearly flagged "defaults" for review','New Column Mapping page before import shows Source Header, Detected Meaning, Sample Value and Confidence with manual override for structured column tables, plus a Raw Parsed Row Preview so you can inspect exactly what was extracted from each payroll row','Full backward compatibility: the existing letter-document import, generic CSV/XLSX import, Update Existing Month, Legacy Mapping, audit batch and Undo are all preserved; no storage keys, migrations or data changed']},

/* ============================================================
   PEOPLE & CONTRACTS ENGINE (v2.2.0)
   Master data (employees, contracts), the calendar-month contract
   progress calculator, payroll planning, recurring expenses, and
   the monthly plan generator. All planned finance transactions that
   originate here carry structured links (employeeId / contractId /
   payrollPlanId / monthlyPlanId) — never description text alone.
   ============================================================ */

/* ---------- month-key math ---------- */
// Transactions key months as "YYYY-MM". These helpers keep contract
// progress, payroll and planning consistent with that scheme.
function mkKey(y, m){ return `${y}-${String(m).padStart(2,'0')}`; }
function keyParts(key){ const y=+String(key).slice(0,4), m=+String(key).slice(5,7); return {y, m}; }
function keyToMonthObj(key){ const {y,m}=keyParts(key); return {key, month:NUM_MONTH[m], year:y, monthNum:m}; }
function dateToKey(iso){ if(!iso) return null; return String(iso).slice(0,7); }
function todayKey(){ return isoToday().slice(0,7); }
// 0-based absolute month index for arithmetic (year*12 + (month-1)).
function absMonth(y, m){ return y*12 + (m-1); }
function keyAbs(key){ const {y,m}=keyParts(key); return absMonth(y,m); }
function daysBetween(isoA, isoB){ return Math.round((new Date(isoB+'T00:00:00') - new Date(isoA+'T00:00:00'))/86400000); }

/* ---------- contract progress calculator ---------- */
// Pure, calendar-month based. Never stores "8/12" — always derived from
// startDate + durationMonths for a given reference month (default: current).
//   before the contract starts → 0/N
//   during month 1             → 1/N
//   after it ends              → N/N and Expired
function contractCalc(c, refKey){
  const dur = Math.max(0, Number(c && c.durationMonths)||0);
  const start = c && c.startDate ? String(c.startDate).slice(0,10) : null;
  const ref = refKey || todayKey();
  const out = {total:dur, current:0, remaining:dur, pct:0, progress:`0/${dur}`,
    beforeStart:true, coversMonth:false, expiredForRef:false,
    startDate:start, endDate:null, daysUntilEnd:null, valid:!!(start && dur>0)};
  if(!out.valid) return out;
  const sp = keyParts(start.slice(0,7));
  const startAbs = absMonth(sp.y, sp.m);
  const refAbs = keyAbs(ref);
  const elapsed = refAbs - startAbs;      // 0 = start month
  const current = elapsed + 1;            // 1 during the start month
  // end date = start + duration months − 1 day (last covered calendar day)
  const endD = new Date(sp.y, (sp.m-1)+dur, 0);
  out.endDate = `${endD.getFullYear()}-${String(endD.getMonth()+1).padStart(2,'0')}-${String(endD.getDate()).padStart(2,'0')}`;
  out.daysUntilEnd = daysBetween(isoToday(), out.endDate);
  if(current < 1){ out.current=0; out.beforeStart=true; }
  else if(current > dur){ out.current=dur; out.expiredForRef=true; out.beforeStart=false; }
  else { out.current=current; out.beforeStart=false; out.coversMonth=true; }
  out.remaining = Math.max(0, dur - out.current);
  out.pct = dur ? Math.round(out.current/dur*100) : 0;
  out.progress = `${out.current}/${dur}`;
  return out;
}
// Effective status string (derived) — Draft/Cancelled/Renewed are stored;
// Active-family contracts resolve to Active / Expiring Soon / Expired by date.
function contractEffectiveStatus(c, refKey){
  if(!c) return '—';
  if(c.status==='Cancelled') return 'Cancelled';
  if(c.status==='Renewed') return 'Renewed';
  if(c.status==='Draft') return 'Draft';
  const calc = contractCalc(c, refKey||todayKey());
  if(!calc.valid) return 'Draft';
  if(calc.beforeStart) return 'Active';                 // confirmed, not yet started
  if(calc.expiredForRef) return 'Expired';
  const warn = Number(State.settings.contractExpiryWarningDays)||90;
  if(calc.daysUntilEnd!=null && calc.daysUntilEnd <= warn) return 'Expiring Soon';
  return 'Active';
}
function contractsForEmployee(empId){ return State.contracts.filter(c=>c.employeeId===empId); }
// The contract that funds payroll for a given month: covers it, and is not
// Draft/Cancelled. Prefer a live Active contract over a Renewed historical one.
function coveringContract(empId, monthKey){
  const cands = contractsForEmployee(empId).filter(c=>
    c.status!=='Cancelled' && c.status!=='Draft' && contractCalc(c, monthKey).coversMonth);
  if(!cands.length) return null;
  cands.sort((a,b)=> (a.status==='Renewed'?1:0)-(b.status==='Renewed'?1:0)
    || String(b.startDate||'').localeCompare(String(a.startDate||'')));
  return cands[0];
}
function activeContractToday(empId){ return coveringContract(empId, todayKey()); }
// Two Active contracts overlap if their covered month ranges intersect.
function overlappingActiveContracts(empId){
  const act = contractsForEmployee(empId).filter(c=>c.status==='Active' && contractCalc(c).valid);
  const ranges = act.map(c=>{ const sp=keyParts(String(c.startDate).slice(0,7)); const s=absMonth(sp.y,sp.m); return {c, s, e:s+(Number(c.durationMonths)||0)-1}; });
  const clash = [];
  for(let i=0;i<ranges.length;i++) for(let j=i+1;j<ranges.length;j++){
    if(ranges[i].s <= ranges[j].e && ranges[j].s <= ranges[i].e){ clash.push([ranges[i].c, ranges[j].c]); }
  }
  return clash;
}

/* ---------- linkage helpers ---------- */
function empById(id){ return State.employees.find(e=>e.id===id); }
function contractById(id){ return State.contracts.find(c=>c.id===id); }
function payrollPlanById(id){ return State.payrollPlans.find(p=>p.id===id); }
function txnsForEmployee(empId){ return State.txns.filter(t=>t.employeeId===empId); }
function txnsForContract(ctId){ return State.txns.filter(t=>t.contractId===ctId); }
function payrollPlansForContract(ctId){ return State.payrollPlans.filter(p=>p.contractId===ctId); }
function payrollPlansForEmployee(empId){ return State.payrollPlans.filter(p=>p.employeeId===empId); }
function empHasHistory(empId){ return txnsForEmployee(empId).length>0 || payrollPlansForEmployee(empId).length>0; }
function empEligible(e){ return e && e.active!==false && e.employmentStatus==='Active'; }
function monthlyPlanFor(key){ return State.monthlyPlans.find(p=>p.monthKey===key); }

  const root = document.getElementById('modal-root');

  root.innerHTML = `<div class="modal-overlay" id="hrModalOverlay"><div class="modal" role="dialog" aria-modal="true" style="max-width:${(opts&&opts.width)||560}px;max-height:88vh;overflow-y:auto;">${inner}</div></div>`;

  if(opts && opts.onMount) opts.onMount(root);
  focusFirstIn(root); // move keyboard focus into the dialog
}
function progressBar(pct, color){ return `<div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,Math.max(0,pct))}%;background:${color||'var(--accent)'};"></div></div>`; }
function hrNavTo(view, extra){ if(extra) Object.assign(State, extra); State.view=view; render(); }
function fmtDateID(iso){ if(!iso) return '—'; try{ return new Date(iso+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}); }catch(e){ return iso; } }
function nextEmployeeCode(){
  let max=0; State.employees.forEach(e=>{ const m=/(\d+)\s*$/.exec(e.employeeId||''); if(m) max=Math.max(max, +m[1]); });
  return 'EMP-'+String(max+1).padStart(3,'0');
}

async function setEmployeeActive(id, active){
  const e = empById(id); if(!e) return;
  e.active = active;
  if(!active && e.employmentStatus==='Active') e.employmentStatus='Inactive';
  e.updatedAt = new Date().toISOString();
  (e.history=e.history||[]).push({event:active?'reactivated':'deactivated', ts:e.updatedAt, note:active?'Record reactivated':'Record deactivated'});
  await persistEmployees(); toast(active?'Employee reactivated.':'Employee deactivated.'); render();
}
async function deleteEmployee(id){
  const e = empById(id); if(!e) return;
  if(empHasHistory(id)){
    toast('This employee has linked payroll or transactions and cannot be deleted. Deactivate instead.', 6000);
    return;
  }
  if(!confirm(`Permanently delete ${e.fullName}? This is only allowed because the record has no linked payroll or transactions.`)) return;
  State.employees = State.employees.filter(x=>x.id!==id);
  await persistEmployees(); toast('Employee deleted.'); render();
}

/* ---------- generic HR actions menu (mirrors the finance actions menu) ---------- */
function hrActionsMenu(kind, id, items){
  return `<div class="actions-menu">
    <button class="btn btn-sm actions-toggle" data-hr-actions="${kind}:${id}">Actions ▾</button>
    <div class="actions-dropdown" data-hr-menu="${kind}:${id}" style="display:none;">
      ${items.filter(Boolean).map(([a,l])=>`<button class="actions-item ${a.endsWith('delete')?'danger':''}" data-hr-action="${a}" data-hr-id="${id}">${l}</button>`).join('')}
    </div></div>`;
}
function bindHRActions(main){
  main.querySelectorAll('[data-hr-actions]').forEach(btn=>btn.addEventListener('click', e=>{
    e.stopPropagation();
    const menu = main.querySelector(`[data-hr-menu="${btn.dataset.hrActions}"]`);
    const open = menu.style.display==='block';
    main.querySelectorAll('.actions-dropdown').forEach(m=>m.style.display='none');
    menu.style.display = open?'none':'block';
    if(!open) document.addEventListener('click', ()=>{ main.querySelectorAll('.actions-dropdown').forEach(m=>m.style.display='none'); }, {once:true});
  }));
  main.querySelectorAll('[data-hr-action]').forEach(btn=>btn.addEventListener('click', async e=>{
    e.stopPropagation();
    main.querySelectorAll('.actions-dropdown').forEach(m=>m.style.display='none');
    const id = btn.dataset.hrId, a = btn.dataset.hrAction;
    if(a==='emp-detail') hrNavTo('employeeDetail', {detailEmpId:id});
    else if(a==='emp-edit') openEmployeeModal(id);
    else if(a==='emp-deactivate') setEmployeeActive(id, false);
    else if(a==='emp-reactivate') setEmployeeActive(id, true);
    else if(a==='emp-delete') deleteEmployee(id);
    else if(a==='ct-detail') hrNavTo('contractDetail', {detailContractId:id});
    else if(a==='ct-edit') openContractModal(id);
    else if(a==='ct-renew') openRenewModal(id);
    else if(a==='ct-activate') setContractStatus(id, 'Active');
    else if(a==='ct-cancel') setContractStatus(id, 'Cancelled');
    else if(a==='ct-delete') deleteContract(id);
    else if(a==='re-edit') openRecurringModal(id);
    else if(a==='re-toggle') toggleRecurring(id);
    else if(a==='re-delete') deleteRecurring(id);
    else if(a==='padj-edit') openAdjustmentModal(id);
    else if(a==='padj-toggle') toggleAdjustment(id);
    else if(a==='padj-delete') deleteAdjustment(id);
    else if(a==='prow-detail') hrNavTo('payrollDetail',{detailPayrollId:id});
    else if(a==='prow-review') { await setPayrollStatus(id,'Reviewed'); render(); }
    else if(a==='prow-ready') { await setPayrollStatus(id,'Ready'); render(); }
    else if(a==='prow-draft') { await setPayrollStatus(id,'Draft'); render(); }
    else if(a==='prow-cancel') { if(confirmAction('Cancel this payroll row? It will not create a finance transaction.')){ await setPayrollStatus(id,'Cancelled'); render(); } }
    else if(a==='prow-exec') { State.view='executioncenter'; State.execFilter='today'; render(); }
    else if(a==='ot-view') openOvertimeBreakdown(id);
    else if(a==='ot-edit') openOvertimeModal(id);
    else if(a==='ot-duplicate') duplicateOvertimeRecord(id);
    else if(a==='ot-review') setOvertimeStatus(id, 'Reviewed');
    else if(a==='ot-approve') setOvertimeStatus(id, 'Approved');
    else if(a==='ot-reject') setOvertimeStatus(id, 'Rejected');
    else if(a==='ot-delete') deleteOvertimeRecord(id);
  }));
}

function allContractAlerts(){
  const alerts = [];
  const warn = Number(State.settings.contractExpiryWarningDays)||90;
  State.contracts.forEach(c=>{
    const es = contractEffectiveStatus(c);
    const cc = contractCalc(c);
    if(es==='Expired' && c.status==='Active') alerts.push({type:'warn', sev:0, text:`Contract ${escapeHtml(c.contractNumber||'')} (${escapeHtml(c.employeeName||'')}) has expired — renew or close it.`});
    else if(es==='Expiring Soon'){
      const d = cc.daysUntilEnd;
      const band = d<=30?30:d<=60?60:90;
      alerts.push({type:'warn', sev:band, text:`Contract ${escapeHtml(c.contractNumber||'')} (${escapeHtml(c.employeeName||'')}) expires within ${band} days — ${d} day${d===1?'':'s'} left (${fmtDateID(cc.endDate)}).`});
    }
  });
  // employees with no active contract / overlaps
  State.employees.filter(empEligible).forEach(e=>{
    if(!activeContractToday(e.id)) alerts.push({type:'warn', sev:200, text:`${escapeHtml(e.fullName)} is Active but has no active contract for this month.`});
    if(overlappingActiveContracts(e.id).length) alerts.push({type:'warn', sev:150, text:`${escapeHtml(e.fullName)} has overlapping active contracts — dates conflict.`});
  });
  return alerts.sort((a,b)=>a.sev-b.sev);
}

async function setContractStatus(id, status){
  const c = contractById(id); if(!c) return;
  if(status==='Cancelled' && payrollPlansForContract(id).some(p=>p.status==='committed')){
    if(!confirm('This contract has committed payroll. Cancelling it will NOT modify historical payroll or transactions. Continue?')) return;
  }
  c.status = status; c.updatedAt = new Date().toISOString();
  (c.history=c.history||[]).push({event:status.toLowerCase(), ts:c.updatedAt, note:`Status set to ${status}`});
  await persistContracts(); toast(`Contract ${status.toLowerCase()}.`); render();
}
async function deleteContract(id){
  const c = contractById(id); if(!c) return;
  if(payrollPlansForContract(id).length || txnsForContract(id).length){
    toast('This contract has linked payroll or transactions and cannot be deleted. Cancel it instead.', 6000);
    return;
  }
  if(c.status!=='Draft' && !confirm('Permanently delete this contract? Only unused records should be deleted.')) return;
  State.contracts = State.contracts.filter(x=>x.id!==id);
  await persistContracts(); toast('Contract deleted.'); render();
}

/* ============================================================
   PAYROLL PLANNING
   ============================================================ */
function num(x){ const n=Number(x); return isFinite(n)?n:0; }
function payrollAmount(r){ return num(r.baseSalary)+num(r.overtime)+num(r.allowance)+num(r.bonus)+num(r.benefits)+num(r.otherAdjustment)-num(r.deduction); }
function samePayrollComponents(a,b){
  return ['baseSalary','overtime','allowance','deduction','bonus','benefits','otherAdjustment'].every(k=>num(a[k])===num(b[k])) && (a.notes||'')===(b.notes||'');
}
// Build editable draft rows for every eligible employee with a covering
// contract; collect exclusion reasons for everyone else.
function generatePayrollRows(monthKey){
  const rows=[], excluded=[];
  State.employees.forEach(e=>{
    if(!empEligible(e)){ excluded.push({name:e.fullName, reason:`Not an active employee (status: ${e.employmentStatus}${e.active===false?', record deactivated':''})`}); return; }
    const ct = coveringContract(e.id, monthKey);
    if(!ct){ excluded.push({name:e.fullName, reason:'No active contract covering this month'}); return; }
    const cc = contractCalc(ct, monthKey);
    const base = (ct.monthlySalary!=null?ct.monthlySalary:e.monthlyBaseSalary)||0;
    const existing = State.payrollPlans.find(p=>p.monthKey===monthKey && p.employeeId===e.id && p.contractId===ct.id);
    const src = existing || {baseSalary:base, overtime:0, allowance:0, deduction:0, bonus:0, benefits:0, otherAdjustment:0, notes:''};
    // Auto-populate overtime from Approved (and already-committed) overtime for
    // this employee + month — the user never re-types the overtime total (Part 9).
    const ot = approvedOvertimeForMonth(e.id, monthKey);
    const overtime = ot.ids.length ? ot.amount : num(src.overtime);
    let otDup = 'none';
    if(ot.ids.length){
      const anyCommitted = ot.records.some(o=>o.status==='Committed to Payroll');
      if(anyCommitted && existing) otDup='committed';
      else if(existing && num(existing.overtime)===overtime) otDup='existing';
      else if(existing) otDup='changed';
      else otDup='new';
    }
    const src2 = {...src, overtime};
    let dup='new';
    if(existing){ dup = samePayrollComponents(existing, src2)?'existing':'changed'; }
    rows.push({
      _existingId: existing?existing.id:null, dup,
      employeeId:e.id, employeeName:e.fullName, contractId:ct.id, contractNumber:ct.contractNumber, contractProgress:cc.progress,
      baseSalary:num(src.baseSalary), overtime:num(overtime), allowance:num(src.allowance), deduction:num(src.deduction),
      bonus:num(src.bonus), benefits:num(src.benefits), otherAdjustment:num(src.otherAdjustment),
      notes:src.notes||'', missingSalary: base<=0,
      otIds: ot.ids, otAmount: ot.amount, otDup, otRecords: ot.records,
    });
  });
  return {monthKey, rows, excluded};
}
function ensureMonthlyPlan(monthKey){
  let plan = monthlyPlanFor(monthKey);
  if(!plan){ const mo=keyToMonthObj(monthKey); plan={id:uid('mp'), monthKey, month:mo.month, year:mo.year, monthNum:mo.monthNum, status:'Draft', committedTxnIds:[], createdAt:new Date().toISOString()}; State.monthlyPlans.push(plan); }
  if(!Array.isArray(plan.committedTxnIds)) plan.committedTxnIds=[];
  return plan;
}
// Planned Gaji transaction generated from a payroll plan. Carries structured
// links (never description text alone) so it round-trips to employee/contract.
function buildPayrollTxn(pp, mo, uraian){
  const ts = new Date().toISOString();
  return {
    id: uid('pay'), monthKey:pp.monthKey, month:mo.month, year:mo.year, monthNum:mo.monthNum,
    category: State.settings.defaultPayrollCategory||'Gaji', categoryCode:'A', no:null,
    uraian, vol:1, satuan:'bulan', hargaSatuan:pp.plannedAmount,
    planned:pp.plannedAmount, actual:null, type:'expense', txnDate:null,
    source:'payroll', unplanned:false,
    scheduledDate:null, paymentMethod:null, bankAccount:null, referenceNumber:null, notes:pp.notes||null, vendor:null,
    executionId:null, executionTimestamp:null, execution:null, status:'planned',
    employeeId:pp.employeeId, contractId:pp.contractId, payrollPlanId:pp.id, monthlyPlanId:pp.monthlyPlanId||null,
    overtimeIds: Array.isArray(pp.overtimeIds)?pp.overtimeIds.slice():[], overtimeAmount: num(pp.overtime),
    payrollMeta:{employeeName:pp.employeeName, contractNumber:pp.contractNumber, contractProgress:pp.contractProgress},
    history:[{event:'created', ts, note:'Generated from Payroll Planning'}],
  };
}
async function commitPayroll(monthKey, rows){
  const mo = keyToMonthObj(monthKey);
  const plan = ensureMonthlyPlan(monthKey);
  let created=0, updated=0;
  for(const r of rows){
    const amount = payrollAmount(r);
    const now = new Date().toISOString();
    let pp = r._existingId ? payrollPlanById(r._existingId) : null;
    if(!pp){ pp={id:uid('pp'), createdAt:now}; State.payrollPlans.push(pp); }
    const otIds = Array.isArray(r.otIds)?r.otIds.slice():[];
    Object.assign(pp, {
      monthKey, month:mo.month, year:mo.year, monthNum:mo.monthNum,
      employeeId:r.employeeId, employeeName:r.employeeName, contractId:r.contractId,
      contractNumber:r.contractNumber, contractProgress:r.contractProgress,
      baseSalary:num(r.baseSalary), overtime:num(r.overtime), allowance:num(r.allowance), deduction:num(r.deduction),
      bonus:num(r.bonus), benefits:num(r.benefits), otherAdjustment:num(r.otherAdjustment),
      overtimeIds: otIds,
      plannedAmount:amount, notes:r.notes||'', status:'committed', monthlyPlanId:plan.id, updatedAt:now,
    });
    const uraian = `${r.employeeName} · ${r.contractNumber} · ${r.contractProgress}`;
    let txn = pp.committedTxnId ? findTxn(pp.committedTxnId) : null;
    if(!txn){
      txn = buildPayrollTxn(pp, mo, uraian); State.txns.push(txn); pp.committedTxnId=txn.id; created++;
    } else if(txn.actual==null){
      txn.planned=amount; txn.hargaSatuan=amount; txn.uraian=uraian;
      txn.overtimeIds = otIds; txn.overtimeAmount = num(r.overtime);
      txn.payrollMeta={employeeName:r.employeeName, contractNumber:r.contractNumber, contractProgress:r.contractProgress};
      pushHistory(txn,'edited','Payroll plan re-committed'); updated++;
    }
    // Flip the included Approved overtime to Committed to Payroll and link it.
    // Records already Committed stay put — this prevents committing the same
    // overtime twice (Part 9).
    otIds.forEach(oid=>{ const o=overtimeById(oid); if(o && o.status==='Approved'){ o.status='Committed to Payroll'; o.payrollPlanId=pp.id; o.committedTxnId=pp.committedTxnId; o.updatedAt=now; (o.history=o.history||[]).push({event:'committed', ts:now, note:'Committed to payroll '+uraian}); } });
    if(pp.committedTxnId && !plan.committedTxnIds.includes(pp.committedTxnId)) plan.committedTxnIds.push(pp.committedTxnId);
  }
  if(plan.status==='Draft'||plan.status==='Reviewed') plan.status='Committed';
  plan.committedAt=new Date().toISOString(); plan.updatedAt=plan.committedAt;
  await persistPayrollPlans(); await persistMonthlyPlans(); await persistOvertime(); await persist();
  return {created, updated};
}

function recurringDueInMonth(monthKey){
  return State.recurringExpenses.filter(r=>{
    if(r.active===false) return false;
    if(!r.startMonth) return false;
    if(monthKey < r.startMonth) return false;
    if(r.endMonth && monthKey > r.endMonth) return false;
    const interval = RECUR_FREQUENCIES[r.frequency]||1;
    const diff = keyAbs(monthKey) - keyAbs(r.startMonth);
    return diff>=0 && diff % interval === 0;
  });
}

function catCode(category){ return category==='Gaji'?'A':category==='Operasional Rutin'?'B':category==='Operasional Kegiatan'?'C':null; }
function buildPlannedExpenseTxn(monthKey, mo, o){
  const ts=new Date().toISOString();
  return {id:uid(o.source||'plan'), monthKey, month:mo.month, year:mo.year, monthNum:mo.monthNum,
    category:o.category, categoryCode:catCode(o.category), no:null,
    uraian:o.uraian, vol:1, satuan:'bulan', hargaSatuan:o.amount, planned:o.amount, actual:null, type:'expense', txnDate:null,
    source:o.source||'manual', unplanned:false, scheduledDate:null, paymentMethod:o.paymentMethod||null, bankAccount:o.bankAccount||null,
    referenceNumber:null, notes:o.notes||null, vendor:o.vendor||null,
    executionId:null, executionTimestamp:null, execution:null, status:'planned',
    monthlyPlanId:o.monthlyPlanId||null, recurringId:o.recurringId||null,
    history:[{event:'created', ts, note:'Generated by Monthly Plan Generator'}]};
}
function prevMonthKey(monthKey){ const a=keyAbs(monthKey)-1; return mkKey(Math.floor(a/12), (a%12)+1); }
// Non-payroll, non-recurring planned expense items from a month — the only
// things eligible to copy forward (actuals are never copied).
function manualItemsForMonth(monthKey){
  return State.txns.filter(t=>t.monthKey===monthKey && t.type!=='income' && t.source!=='payroll' && !t.recurringId && statusOf(t)!=='cancelled');
}
function buildMonthlyPreview(monthKey, opts){
  const rows=[], warnings=[];
  if(opts.payroll){
    // Part 11: the Monthly Plan CONSUMES payroll committed in Payroll Planning —
    // it never generates payroll independently. Committed payroll already carries
    // its own planned Gaji transaction, so these rows are informational (locked).
    const committed = State.payrollPlans.filter(p=>p.monthKey===monthKey && p.status==='Committed');
    committed.forEach(p=>{
      const txn = payrollTxnOf(p);
      rows.push({type:'payroll', label:`${p.employeeName}${p.contractNumber?' · '+p.contractNumber:''}${p.contractProgress?' · '+p.contractProgress:''}`, category:State.settings.defaultPayrollCategory||'Gaji', planned:num(p.plannedAmount), selected:false, dup:'committed', warn:null, committedTxnId: txn?txn.id:null});
    });
    const cyc = payrollCycleStatus(monthKey);
    if(cyc==='Not Generated') warnings.push('Payroll has not been generated for this month — open Payroll Planning to generate and commit payroll.');
    else if(!committed.length) warnings.push('Payroll generated but not committed yet — commit Ready payroll in Payroll Planning.');
    else if(cyc==='Ready to Commit' || cyc==='In Review' || cyc==='Draft') warnings.push('Some payroll rows are not yet committed — commit them in Payroll Planning to include them.');
  }
  if(opts.recurring){
    recurringDueInMonth(monthKey).forEach(r=>{
      const dupTxn = State.txns.find(t=>t.recurringId===r.id && t.monthKey===monthKey);
      rows.push({type:'recurring', label:r.name, category:r.category||'Operasional Rutin', planned:num(r.defaultAmount), selected:!dupTxn, dup:dupTxn?'duplicate':'new', recurringId:r.id, vendor:r.vendor, paymentMethod:r.paymentMethod, bankAccount:r.bankAccount, warn: num(r.defaultAmount)<=0?'zero-value':null});
    });
  }
  (opts.copyRows||[]).forEach(cr=>{
    const dupTxn = State.txns.find(t=>t.monthKey===monthKey && normStr(t.uraian)===normStr(cr.uraian) && t.category===cr.category);
    rows.push({type:'manual', label:cr.uraian, category:cr.category, planned:num(cr.planned), selected:!dupTxn, dup:dupTxn?'duplicate':'new', warn:null});
  });
  return {monthKey, rows, warnings};
}
function previewTotals(preview){
  const sel = preview.rows.filter(r=>r.selected);
  const by = t=>sel.filter(r=>r.type===t).reduce((s,r)=>s+num(r.planned),0);
  // Payroll is already committed (informational rows) — count all of it.
  const payroll = preview.rows.filter(r=>r.type==='payroll').reduce((s,r)=>s+num(r.planned),0);
  const dup = preview.rows.filter(r=>r.dup==='duplicate').length;
  const missing = preview.rows.filter(r=>r.warn==='missing salary').length;
  const zero = preview.rows.filter(r=>r.warn==='zero-value').length;
  return {payroll, recurring:by('recurring'), manual:by('manual'), total: payroll + sel.filter(r=>r.type!=='payroll').reduce((s,r)=>s+num(r.planned),0), rows:sel.filter(r=>r.type!=='payroll').length, dup, missing, zero};
}
async function commitMonthlyPlan(preview){
  const mo = keyToMonthObj(preview.monthKey);
  const plan = ensureMonthlyPlan(preview.monthKey);
  // Payroll rows are consumed from Payroll Planning (already committed) — never
  // re-created here. Only recurring/manual rows create transactions.
  const sel = preview.rows.filter(r=>r.selected && r.dup!=='duplicate' && r.dup!=='committed' && r.type!=='payroll');
  let created=0;
  for(const r of sel){
    const txn = buildPlannedExpenseTxn(preview.monthKey, mo, {
      uraian:r.label, category:r.category, amount:num(r.planned), source:r.type==='recurring'?'recurring':'manual',
      recurringId:r.recurringId||null, vendor:r.vendor||null, paymentMethod:r.paymentMethod||null, bankAccount:r.bankAccount||null, monthlyPlanId:plan.id,
    });
    State.txns.push(txn); plan.committedTxnIds.push(txn.id); created++;
  }
  plan.status='Committed'; plan.committedAt=new Date().toISOString(); plan.updatedAt=plan.committedAt;
  await persist(); await persistMonthlyPlans();
  return {created};
}

/* ============================================================
   LEGACY PAYROLL MAPPING
   Conservatively links historical Gaji transactions (imported from
   Excel, where the description is the employee name) to employee &
   contract master data. Never guesses aggressively, never creates
   contracts, always requires confirmation, preserves descriptions.
   ============================================================ */
function unlinkedGajiTxns(){
  return State.txns.filter(t=>t.type!=='income' && (t.category==='Gaji') && !t.employeeId && t.source!=='payroll');
}
function suggestEmployeeForName(name){
  const n = normStr(name);
  let exact = State.employees.find(e=>normStr(e.fullName)===n);
  if(exact) return {emp:exact, confidence:'high'};
  let best=null, bestScore=0;
  State.employees.forEach(e=>{ const s=similarText(e.fullName, name); if(s>bestScore){ bestScore=s; best=e; } });
  if(best && bestScore>=0.82) return {emp:best, confidence:'medium', score:bestScore};
  return {emp:null, confidence:'none'};
}
function renderLegacyPayrollMapping(main){
  const unlinked = unlinkedGajiTxns();
  // group by description (employee name as written on the historical row)
  const groups = {};
  unlinked.forEach(t=>{ const k=t.uraian||'(blank)'; (groups[k]=groups[k]||{name:t.uraian, txns:[]}).txns.push(t); });
  const rows = Object.values(groups).map(g=>({...g, suggestion:suggestEmployeeForName(g.name)}))
    .sort((a,b)=>b.txns.length-a.txns.length);

  main.innerHTML = `
    <div class="page-head">
      <div><h1>Legacy Payroll Mapping</h1><p class="desc">Link historical Gaji transactions to employee and contract master data. Matching is conservative — review every suggestion before applying. Descriptions are preserved.</p></div>
      <div class="head-controls"><button class="btn" id="backPay">← Payroll Planning</button></div>
    </div>
    ${!State.employees.length?`<div class="insight-item warn" style="margin-bottom:14px;">No employees exist yet. Add employees first (People &amp; Contracts → Employees), then return here to map historical payroll to them.</div>`:''}
    <div class="card">
      <h3>Unmapped Historical Payroll <span class="tag">${unlinked.length} transaction(s) · ${rows.length} distinct name(s)</span></h3>
      ${rows.length?`
      <div class="table-wrap" style="max-height:560px;overflow-y:auto;">
        <table>
          <thead><tr><th>Historical Description</th><th class="num">Txns</th><th>Match Confidence</th><th>Map to Employee</th><th>Auto-link Contract</th></tr></thead>
          <tbody>${rows.map((g,i)=>`<tr>
            <td><b>${escapeHtml(g.name||'—')}</b></td>
            <td class="num">${g.txns.length}</td>
            <td>${g.suggestion.confidence==='high'?'<span class="pill pill-status-completed">high</span>':g.suggestion.confidence==='medium'?`<span class="pill pill-status-partial">medium ${(g.suggestion.score*100).toFixed(0)}%</span>`:'<span class="pill pill-status-archived">no match</span>'}</td>
            <td><select class="input" data-map="${i}"><option value="">— do not map —</option>${State.employees.map(e=>`<option value="${e.id}" ${g.suggestion.emp&&g.suggestion.emp.id===e.id&&g.suggestion.confidence==='high'?'selected':''}>${escapeHtml(e.fullName)} (${escapeHtml(e.employeeId||'')})</option>`).join('')}</select></td>
            <td><label class="checkbox-row"><input type="checkbox" data-autoct="${i}" checked> match by month</label></td>
          </tr>`).join('')}</tbody>
        </table>
      </div>
      <div class="modal-actions" style="justify-content:flex-start;margin-top:14px;">
        <button class="btn btn-accent" id="applyMap">Apply Mappings</button>
        <span class="hint" style="align-self:center;">Only rows with an employee selected are linked. Contracts are linked only where one already covers that transaction's month — none are created.</span>
      </div>`:'<div class="empty">All Gaji transactions are already linked to employees, or there is no historical payroll to map.</div>'}
    </div>`;
  document.getElementById('backPay').addEventListener('click', ()=>hrNavTo('payroll'));
  const applyBtn = document.getElementById('applyMap');
  if(applyBtn) applyBtn.addEventListener('click', async ()=>{
    let linked=0, ctLinked=0;
    rows.forEach((g,i)=>{
      const sel = main.querySelector(`[data-map="${i}"]`); const empId = sel && sel.value;
      if(!empId) return;
      const emp = empById(empId); if(!emp) return;
      const autoCt = main.querySelector(`[data-autoct="${i}"]`).checked;
      g.txns.forEach(t=>{
        t.employeeId = empId;
        if(!t.payrollMeta) t.payrollMeta = {employeeName:emp.fullName, contractNumber:null, contractProgress:null};
        pushHistory(t, 'linked', `Mapped to employee ${emp.fullName} via Legacy Payroll Mapping`);
        if(autoCt){ const ct = coveringContract(empId, t.monthKey); if(ct){ t.contractId=ct.id; const cc=contractCalc(ct,t.monthKey); t.payrollMeta.contractNumber=ct.contractNumber; t.payrollMeta.contractProgress=cc.progress; ctLinked++; } }
        linked++;
      });
    });
    if(!linked){ toast('No rows had an employee selected.'); return; }
    await persist();
    toast(`Linked ${linked} transaction(s) to employees${ctLinked?`, ${ctLinked} to contracts`:''}. Descriptions preserved.`, 6000);
    render();
  });
}

/* ============================================================
   DASHBOARD & REPORT INTEGRATION HELPERS (v2.2.0)
   ============================================================ */
function hrDashboardStats(monthKey){
  const activeEmployees = State.employees.filter(empEligible).length;
  const activeContracts = State.contracts.filter(c=>contractEffectiveStatus(c)==='Active').length;
  const expiringSoon = State.contracts.filter(c=>contractEffectiveStatus(c)==='Expiring Soon').length;
  const plans = State.payrollPlans.filter(p=>p.monthKey===monthKey && p.status==='committed');
  const payrollPlanned = plans.reduce((s,p)=>s+(p.plannedAmount||0),0);
  const plan = monthlyPlanFor(monthKey);
  // payroll generation status for the month
  let payrollGen='Not generated';
  const eligible = State.employees.filter(empEligible).filter(e=>coveringContract(e.id, monthKey));
  if(plans.length){ payrollGen = plans.length>=eligible.length ? 'Committed' : 'Partially committed'; }
  else if(State.payrollDraft && State.payrollDraft.monthKey===monthKey){ payrollGen='Generated, not committed'; }
  return {activeEmployees, activeContracts, expiringSoon, payrollPlanned, payrollCount:plans.length, planStatus:plan?plan.status:'Not started', payrollGen, eligibleCount:eligible.length};
}
function hrDashboardAlerts(monthKey){
  const alerts = [];
  const warn = Number(State.settings.contractExpiryWarningDays)||90;
  const soon = State.contracts.filter(c=>contractEffectiveStatus(c)==='Expiring Soon');
  soon.slice(0,4).forEach(c=>{ const cc=contractCalc(c); alerts.push({type:'warn', text:`Contract ${escapeHtml(c.contractNumber||'')} (${escapeHtml(c.employeeName||'')}) is expiring soon — ${cc.daysUntilEnd} days left.`}); });
  const expired = State.contracts.filter(c=>contractEffectiveStatus(c)==='Expired' && c.status==='Active');
  expired.slice(0,3).forEach(c=>alerts.push({type:'warn', text:`Contract ${escapeHtml(c.contractNumber||'')} (${escapeHtml(c.employeeName||'')}) has expired — renew or close it.`}));
  State.employees.filter(empEligible).forEach(e=>{ if(!activeContractToday(e.id)) alerts.push({type:'warn', text:`${escapeHtml(e.fullName)} is Active with no current contract.`}); });
  const st = hrDashboardStats(monthKey);
  if(st.eligibleCount>0 && st.payrollGen==='Not generated') alerts.push({type:'info', text:`Payroll for ${escapeHtml(keyToMonthObj(monthKey).month)} has not been generated yet (${st.eligibleCount} eligible employee${st.eligibleCount>1?'s':''}).`});
  if(st.payrollGen==='Generated, not committed') alerts.push({type:'warn', text:`Payroll for ${escapeHtml(keyToMonthObj(monthKey).month)} is generated but not committed to the monthly plan.`});
  if(st.planStatus==='Draft') alerts.push({type:'info', text:`Monthly plan for ${escapeHtml(keyToMonthObj(monthKey).month)} is still in Draft.`});
  // duplicate payroll safety check
  const seen={}; let dup=0;
  State.txns.filter(t=>t.source==='payroll' && t.monthKey===monthKey).forEach(t=>{ const k=t.employeeId+'|'+t.contractId; if(seen[k]) dup++; else seen[k]=1; });
  if(dup) alerts.push({type:'warn', text:`${dup} potential duplicate payroll transaction(s) detected for ${escapeHtml(keyToMonthObj(monthKey).month)}.`});
  return alerts;
}
function hrStatStripHTML(monthKey){
  const st = hrDashboardStats(monthKey);
  return `<div class="grid grid-4" style="margin-bottom:14px;">
    <div class="card stat-card"><div class="stat-label">Active Employees</div><div class="stat-value">${st.activeEmployees}</div><div class="stat-sub dim">eligible for payroll</div></div>
